<style>
  :root {
    --bg: #0d0f13;
    --panel: #161a21;
    --panel-2: #1d222b;
    --line: #2a3140;
    --ink: #e8ecf3;
    --muted: #96a0b2;
    --accent: #7fd4c1;
    --warn: #e8b96a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 1rem 5rem;
    background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 68rem; margin: 0 auto; }

  /* album hero */
  .hero { padding: 1.6rem 0 1rem; }
  .hero-media { position: relative; }
  .hero-banner, .slot.hero-banner {
    width: 100%; display: block; border-radius: .9rem;
    border: 1px solid var(--line); background: var(--panel);
  }
  .hero-banner { aspect-ratio: 16 / 9; object-fit: cover; }
  .slot { display: flex; align-items: center; justify-content: center;
          color: var(--muted); font-size: .85rem; border: 1px dashed var(--line);
          border-radius: .7rem; background: var(--panel); }
  .slot.hero-banner { aspect-ratio: 16 / 9; }
  .hero-sleeve, .slot.hero-sleeve {
    position: absolute; left: 1.2rem; bottom: -2.4rem;
    width: 8.5rem; aspect-ratio: 1; border-radius: .5rem;
    border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(0,0,0,.55);
    object-fit: cover; background: var(--panel-2);
  }
  h1 { font-size: 2.6rem; margin: 3.2rem 0 .2rem; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0 0 1.2rem; }
  .bar {
    display: flex; flex-wrap: wrap; gap: .75rem; align-items: center;
    border: 1px solid var(--line); background: var(--panel);
    border-radius: .6rem; padding: .75rem 1rem; color: var(--muted); font-size: .92rem;
  }
  .bar strong { color: var(--ink); }
  button {
    background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: .45rem; padding: .35rem .7rem; cursor: pointer; font-size: .9rem;
  }
  button:hover { border-color: var(--accent); }

  /* side */
  .side { margin: 2.6rem 0 0; }
  .side-head { position: relative; margin-bottom: 2.6rem; }
  .side-banner, .slot.side-banner {
    width: 100%; display: block; border-radius: .8rem;
    border: 1px solid var(--line); background: var(--panel);
  }
  /* Natural proportions, deliberately. These were pinned to 21:9 with object-fit: cover,
     which cropped the top and bottom off images that are actually 1664 by 928 — and on
     Side B that crop took the top of the frame with it while a hard fold ran through the
     cook's head, so the picture read as broken. A banner should be shown at the shape it
     was rendered at; `cover` only belongs where a crop is intended. */
  .side-banner { opacity: .95; height: auto; }
  .slot.side-banner { aspect-ratio: 21 / 9; }
  .side-sleeve, .slot.side-sleeve {
    position: absolute; right: 1.1rem; bottom: -2.1rem;
    width: 6.5rem; aspect-ratio: 1; border-radius: .45rem;
    border: 1px solid var(--line); box-shadow: 0 10px 26px rgba(0,0,0,.55);
    object-fit: cover; background: var(--panel-2);
  }
  .side-title {
    position: absolute; left: 1.2rem; bottom: 1rem; right: 8rem;
    text-shadow: 0 2px 12px rgba(0,0,0,.8);
  }
  .side-title span {
    font-size: .74rem; text-transform: uppercase; letter-spacing: .14em;
    color: var(--accent);
  }
  .side-title h2 { margin: .1rem 0 0; font-size: 1.7rem; }

  /* track */
  article.track {
    position: relative; overflow: hidden;
    display: grid; grid-template-columns: 15rem 1fr; gap: 1.4rem;
    border: 1px solid var(--line); background: var(--panel);
    border-radius: .8rem; padding: 1.2rem 1.4rem; margin: 1.1rem 0;
  }
  /* The song's own wide banner, held far down so it reads as texture rather than as a
     picture behind the words. Cover, so it fills the card at whatever shape it takes. */
  .track-bg {
    position: absolute; inset: 0; z-index: 0;
    background-size: cover; background-position: center;
    opacity: .15; pointer-events: none;

  article.track > div:not(.track-bg) { position: relative; z-index: 1; }
  article.track.waiting { opacity: .8; }
  .track-cover, .slot.track-cover {
    width: 100%; aspect-ratio: 1; border-radius: .5rem;

  }
  .head { display: flex; flex-wrap: wrap; gap: .6rem; align-items: baseline; }
  .num { color: var(--muted); font-variant-numeric: tabular-nums; }

  .tag {

  .tag.done { color: var(--accent); border-color: var(--accent); }

  p { margin: 0 0 .8rem; }

  .versions {

  }

  .version { border-top: 1px solid var(--line); padding: .8rem 0 .4rem; }
  .version-head {

  }
  .version-head .when { font-variant-numeric: tabular-nums; }
  .version-head .len { color: var(--ink); font-variant-numeric: tabular-nums; }
  .version-head .seed {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .78rem;
  }
  .version .label { color: var(--ink); font-size: .95rem; margin: .35rem 0 0; }
  .version .note { color: var(--muted); font-size: .88rem; margin: .2rem 0 0; }
  .version audio { margin: .4rem 0 .3rem; }
  footer { color: var(--muted); font-size: .85rem; margin-top: 2.5rem; }
  @media (max-width: 720px) {

  /* Cover typography. The type is placed over the rendered artwork to make a
     finished sleeve. Sizes are in cqw, one per cent of the cover's own width,

  .cover-type {

  .cover[data-place="bottom"] .cover-type {

  }
  .cover[data-place="top"] .cover-type {
    top: 0;
    background: linear-gradient(to bottom,
      rgba(var(--scrim-rgb), var(--scrim)) 0%,

 yard. The drawings were kept ashore. They were versioned, and every plank of the original is described in them, and a shipwright who has never seen the lost ship builds it again from the description alone.\n\nThe ship is the same ship because the description survived, not because the timber did. There are three planks in the new hull that are older than the rest, salvaged from the wreck, and the song has to be honest about them: they are the part that is genuinely continuous, and they are also the part most likely to fail. The description is the ship. The wood is an implementation detail, and the three old planks are the drift that no drawing mentions.\n\nThen the mythological note, lightly, in the bridge. The project takes its name from the Argo. That is the usual reading and the documentation never states it, so the song says it the way you would say a family story: this is what we call it. The Argo's problem was never the ship. It was a crew who all wanted to go and disagreed about where, which is also the story of every platform team.\n\nTheseus had a different ship and a different problem. His was about identity. This one is about whether you wrote it down.\n\nThe song ends in the yard at night, with the drawings rolled up and the ship floating, and the destination not yet chosen.","teaches":"Disaster recovery and the claim underneath it. `argocd admin export` and `import` move an installation whole, and `--strip-status` produces a clean copy that can be re-applied from scratch. The wider point is the album's thesis in its most literal form: a system described well enough can be rebuilt from the description, and the description is the asset.","style":"English, maritime work shanty into a post-rock crescendo, lone low male voice answered by a ragged unison crew, harmonium, low D whistle, fiddle, upright bass, brushed snare and low toms, stomps and claps, tremolo electric guitar with volume swells, bowed metal drone and a distant foghorn, creaking timber as a pe ll-someone","title":"Somebody Should Tell Someone","role":"short","duration_target":"0:35","target_seconds":145,"story":"The message that should have been sent, and then the machine's last word.\n\nThe first half is the failure. Smoke from a window, and a neighbour who sees it and assumes someone else has already called. A group chat where everybody thought everybody knew. Four hundred messages nobody read, and one that would have mattered, buried in the middle of them by volume alone. The song does not blame anyone, which is what makes it land: the neighbour was being reasonable, and the reasonableness is the problem.\n\nThen the inversion, and it is the album's closing move. The machine gets the last word. It is brief and polite and specific. It agrees that somebody should tell someone. It says it will not shout at everyone, and then it asks a question. Who should hear this one?\n\nThat is the ending the record has been walking towards since the first song: not a machine that acts, and not a machine that refuses, but a machine that asks a human a question and waits for the answer. It is 35 seconds long because it is a note, not a speech.","teaches":"Notifications as a routing problem rather than a sending problem: triggers, templates, per-application subscriptions, and the services that carry them. The deeper subject is alert fatigue, which is what happens when the system decides that everyone should hear everything.","style":"English, austere close-miked chamber folk that breaks without warning into frantic double-time art-punk, lone male voice flat and conversational and almost spoken in the verses and ragged shouted unison in the chorus, no falsetto, words forward and clear in the mix, dry nylon-string guitar fingerpicked in fast triplets, upright bass one root per bar, no drums at all in the verses, then a live drum kit crashing in at double time with hard clipped snare and floor toms, distorted overdriven electric guitar power chords entering only in the chor   if (entry.seed !== undefined && entry.seed !== null) bits.push("seed " + entry.seed);

    : `Target ${song.duration_target || "?"}`;
  const times = done
    ? `${song.audio_human} · ${song.rendered_at} · ${how}` +
      `${song.duration_target ? " · " + song.duration_target + " target" : ""} · ${files}`
    : files;

  const multi = all.length > 1
    ? `<span class="tag multi">${plural(all.length, "take")} kept</span>`
    : "";
  const banner = bannerSet(song);
  /* The card carries its own banner as a background, held down to a texture by the
     stylesheet. The default banner is preferred, and a song whose banner is still
     rendering simply has no background rather than an empty frame. */
  const backdrop = song.cover_banner || (song.banner_variants || [])[0];
  const cardBg = backdrop
    ? `<div class="track-bg" style="background-image:url('${esc(backdrop.src)}` +
      `?v=${encodeURIComponent(backdrop.at || "")}')"></div>`
    : "";
  return `
  <article class="track ${done ? "" : "waiting"}">
    ${cardBg}
    <div>${cover(song)}</div>
    <div>
      <div class="head">
        <span class="num">${esc(song.number)}</span>
        <h3>${esc(song.title)}</h3>
        ${song.role ? `<span class="tag">${esc(song.role)}</span>` : ""}
        <span class="tag ${done ? "done" : "pending"}">${done ? "rendered" : "waiting"}</span>
        ${multi}
      </div>
      <div class="meta">${esc(times)}</div>
      ${audio}
      ${otherTakes(song, main)}
      ${song.story ? `<details><summary>The story</summary><p>${esc(song.story)}</p></details>` : ""}
      ${song.teaches ? `<h4>What it teaches</h4><p>${esc(song.teaches)}</p>` : ""}
      ${song.style ? `<details><summary>Style sent to the model</summary><div class="style">${esc(song.style)}</div></details>` : ""}
      ${song.lyrics ? `<details><summary>Lyrics</summary><pre class="lyrics">${esc(song.lyrics)}</pre></details>` : ""}
      ${banner}
    </div>
  </article>`;
}

function side(section, byNumber) {
  const tracks = section.numbers.map((n) => byNumber[n]).filter(Boolean);
  return `
  <section class="side">
    <div class="side-head">
      ${image(section.cover_banner, "side-banner", altFor(section.cover_banner, "Side " + section.letter + " banner"))}
      ${image(section.cover_cd, "side-sleeve", altFor(section.cover_cd, "Side " + section.letter + " cover"))}
      <div class="side-title">
        <span>Side ${esc(section.letter)}</span>
        <h2>${esc(section.title)}</h2>
      </div>
    </div>
    ${tracks.map(track).join("")}
  </section>`;
}

async function load() {
  try {
    /* The data is baked into this page, so there is no fetch and nothing to fail at load
       time. This is what makes the page static: no server, no cache-busting, no request. */
    const baked = document.getElementById("album-data");
    if (!baked) throw new Error("this page has no baked data");
    const data = JSON.parse(baked.textContent);
    const byNumber = {};
    data.songs.forEach((song) => { byNumber[song.number] = song; });

    document.getElementById("hero-media").innerHTML =
      image(data.album_cover_banner, "hero-banner", altFor(data.album_cover_banner, "Desired State banner")) +
      image(data.album_cover_cd, "hero-sleeve", altFor(data.album_cover_cd, "Desired State cover"));
    document.getElementById("sub").textContent = data.subtitle;
    /* A half-written manifest, of which this directory has one, carries songs
       but no sides. Paint the songs rather than the error: the audio is the
       part that must stay reachable. */
    const sections = Array.isArray(data.sides) ? data.sides : [];
    document.getElementById("sides").innerHTML =
      sections.map((section) => side(section, byNumber)).join("");
    if (!sections.length) {
      document.getElementById("sides").innerHTML =
        (data.songs || []).map(track).join("");
    }

    /* Counts come from the manifest where it provides them, and from the takes
       themselves otherwise, so an older manifest still renders correctly. */
    const total = data.songs.reduce((n, s) => n + takes(s).length, 0);
    const many = data.songs.filter((s) => takes(s).length > 1).length;
    const kept = data.takes_total === undefined ? total : data.takes_total;
    const withMany = data.multi_take === undefined ? many : data.multi_take;
    document.getElementById("progress").innerHTML =
      `<strong>${data.rendered}</strong> of <strong>${data.total}</strong> songs · ` +
      `<strong>${data.covers_done}</strong> of <strong>${data.total}</strong> covers · ` +
      `${esc(data.audio_total_human)} of audio · ` +
      `<strong>${kept}</strong> takes kept` +
      (withMany ? `, <strong>${withMany}</strong> with more than one` : "") +
      ` · manifest ${esc(data.generated)}`;
    document.getElementById("foot").textContent =
      "Rendered on the M3 and the M5. Every take is kept: a song with more than one " +
      "version stays on this page, with each earlier take playable and its note " +
      "attached. Reload to pick up new ones.";
  } catch (error) {
    document.getElementById("progress").textContent =
      "could not load songs.json: " + error.message;
  }
}

/* The wide banner in every treatment rendered for this song, with a switch between them.

   A banner gets re-rendered when the first attempt is refused by the model, and the
   successful treatment is worth keeping either way, so nothing is chosen on your behalf:
   one is shown and the rest are one click away. The count in the summary says how many
   there are, so a second treatment is not hidden. */
function bannerSet(song) {
  const variants = (song.banner_variants || []).filter((v) => v && v.src);
  if (!variants.length) {
    return song.cover_banner
      ? `<details><summary>Wide banner</summary>${image(song.cover_banner, "banner", altFor(song.cover_banner, song.title + " banner"))}</details>`
      : "";
  }
  const tabs = variants.map((v, i) =>
    `<button type="button" data-banner="${esc(song.number)}" data-i="${i}"` +
    ` class="${i ? "" : "on"}">${esc(v.label)}</button>`).join("");
  const images = variants.map((v, i) =>
    `<img class="banner${i ? "" : " on"}" data-banner="${esc(song.number)}" data-i="${i}"` +
    ` src="${esc(v.src)}?v=${encodeURIComponent(v.at)}"` +
    ` alt="${esc(altFor(v, song.title + " banner"))}" loading="lazy">`).join("");
  const heading = variants.length > 1
    ? `Wide banner (${variants.length} treatments)`
    : "Wide banner";
  return `<details><summary>${esc(heading)}</summary>` +
         `<div class="variant-set"><div class="variant-tabs">${tabs}</div>${images}</div>` +
         `</details>`;
}

/* Swap treatments. One delegated listener covers every song, and the panels are matched
   by the song number so two open songs cannot fight over the same index. */
document.addEventListener("click", (event) => {
  const button = event.target.closest("button[data-banner]");
  if (!button) return;
  const number = button.dataset.banner;
  const chosen = button.dataset.i;
  document.querySelectorAll(`button[data-banner="${number}"]`).forEach((other) =>
    other.classList.toggle("on", other.dataset.i === chosen));
  document.querySelectorAll(`img[data-banner="${number}"]`).forEach((img) =>
    img.classList.toggle("on", img.dataset.i === chosen));
});

document.getElementById("reload").addEventListener("click", load);
let timer = null;
document.getElementById("auto").addEventListener("change", (event) => {
  if (event.target.checked) timer = setInterval(load, 30000);
  else if (timer) clearInterval(timer);
});
load();
</script>
</body>
</html>
