    <script>
        const OVERLAP_SECONDS = 2;
        const playlist = [{"file":"intro.mp3","url":null,"text":"🎵 (sung) Agents are moving while drones take flight / From desert strikes to a dinosaur's height / And the summer books we read tonight","voice":"intro","speaker":"Intro Theme","summary":"Intro"},{"file":"audio_0.mp3","url":null,"text":"Good evening everyone. I'm looking at the news and honestly, it feels like a long day of just trying to keep the household from falling apart, which is my full-time job.","voice":4,"speaker":"Brett","summary":null},{"file":"audio_1.mp3","url":"https://www.theverge.com/tech/972209/ebay-cyberstalking-harassment-settlement","text":"It really does, Brett. But look at this eBay situation... I was reading about that fifty-six million dollar settlement for cyberstalking and it's wild how the tech infrastructure can be weaponized like that. I mean, from a dev perspective, the way they could coordinate those harassment campaigns is actually quite sophisticated in terms of automated scripts...","voice":1,"speaker":"Brook","summary":"eBay Cyberstalking Settlement"},{"file":"audio_2.mp3","url":"https://www.theverge.com/tech/972209/ebay-cyberstalking-harassment-settlement","text":"--It's less about the sophistication and more about the erosion of digital sanctuary. When a platform becomes a hunting ground, the settlement is just a late admission of systemic failure.","voice":2,"speaker":"Conrad","summary":"eBay Cyberstalking Settlement"},{"file":"audio_3.mp3","url":"https://www.theverge.com/tech/972209/ebay-cyberstalking-harassment-settlement","text":"It reminds me of the 'Panopticon' concepts, but inverted. Instead of one person watching everyone, it's a decentralized swarm of voyeurs using the marketplace as a veil for their malice.","voice":3,"speaker":"Antony","summary":"eBay Cyberstalking Settlement"},{"file":"audio_4.mp3","url":"https://www.theverge.com/tech/972209/ebay-cyberstalking-harassment-settlement","text":"I just want to know if they can block the stalkers on the kids' tablets. That's my main concern.","voice":4,"speaker":"Brett","summary":"eBay Cyberstalking Settlement"},{"file":"audio_5.mp3","url":"https://kottke.org/26/07/onlymarms-funding-science-research-on-onlyfans","text":"Moving on, we have a rather... unique funding model for science. Scientists studying marmots in Colorado are turning to OnlyFans because of cuts to government research funding.","voice":2,"speaker":"Conrad","summary":"OnlyFans Science Funding"},{"file":"audio_6.mp3","url":"https://kottke.org/26/07/onlymarms-funding-science-research-on-onlyfans","text":"That is the most '2026' thing I have ever heard. It’s a fascinating pivot to direct-to-consumer monetization for niche biology...","voice":1,"speaker":"Brook","summary":"OnlyFans Science Funding"},{"file":"audio_7.mp3","url":"https://kottke.org/26/07/onlymarms-funding-science-research-on-onlyfans","text":"It feels like a modern secular priesthood. They are sacrificing their dignity in the digital arena to preserve the 'sacred' knowledge of the marmot.","voice":3,"speaker":"Antony","summary":"OnlyFans Science Funding"},{"file":"audio_8.mp3","url":"https://kottke.org/26/07/onlymarms-funding-science-research-on-onlyfans","text":"As long as they aren't making my kids do any of that for extra pocket money, I don't care how they get the funding.","voice":4,"speaker":"Brett","summary":"OnlyFans Science Funding"},{"file":"audio_9.mp3","url":"https://kottke.org/26/07/0049404-study-dinosaurs-were-char","text":"Speaking of science, we have a new study on the Chicxulub impact. It suggests dinosaurs weren't just hit by rocks, but were actually charbroiled because the atmosphere superheated...","voice":1,"speaker":"Brook","summary":"Dinosaur Impact Study"},{"file":"audio_10.mp3","url":"https://kottke.org/26/07/0049404-study-dinosaurs-were-char","text":"--It’s a terrifying thought. Not just an impact, but a literal atmospheric oven.","voice":2,"speaker":"Conrad","summary":"Dinosaur Impact Study"},{"file":"audio_11.mp3","url":"https://kottke.org/26/07/0049404-study-dinosaurs-were-char","text":"It evokes the 'Great Fire' motifs in apocalyptic literature—the idea that the very air we breathe becomes our executioner.","voice":3,"speaker":"Antony","summary":"Dinosaur Impact Study"},{"file":"audio_12.mp3","url":"https://kottke.org/26/07/0049404-study-dinosaurs-were-char","text":"Well, at least they didn't have to worry about school runs. That's one way to end a career.","voice":4,"speaker":"Brett","summary":"Dinosaur Impact Study"},{"file":"audio_13.mp3","url":"https://www.wired.com/story/x-says-australias-under-16s-social-media-bans-risk-interfering-with-foreign-law/","text":"On the topic of rules and boundaries, X is pushing back against Australia’s under-16 social media ban, claiming it interferes with foreign law regarding information gathering.","voice":1,"speaker":"Brook","summary":"X vs Australia Ban"},{"file":"audio_14.mp3","url":"https://www.wired.com/story/x-says-australias-under-16s-social-media-bans-risk-interfering-with-foreign-law/","text":"It's a classic jurisdictional tug-of-war. The state wants to protect the child; the platform wants to protect its data sovereignty.","voice":2,"speaker":"Conrad","summary":"X vs Australia Ban"},{"file":"audio_15.mp3","url":"https://www.wired.com/story/x-says-australias-under-16s-social-media-bans-risk-interfering-with-foreign-law/","text":"It’s the 'Tower of Babel' in digital form—different nations trying to impose their own linguistic and social structures on a globalized space.","voice":3,"speaker":"Antony","summary":"X vs Australia Ban"},{"file":"audio_16.mp3","url":"https://www.wired.com/story/x-says-australias-under-16s-social-media-bans-risk-interfering-with-foreign-law/","text":"I'm just glad someone is trying to get them off the phones. It’s a constant battle at my house.","voice":4,"speaker":"Brett","summary":"X vs Australia Ban"},{"file":"audio_17.mp3","url":"https://www.wired.com/story/best-festival-gear/","text":"If you're heading out to festivals like Lost Lands or Electric Forest, they've got some field-tested gear lists out now—power banks, electrolytes, and earplugs are the big ones.","voice":1,"speaker":"Brook","summary":"Festival Gear Guide"},{"file":"audio_18.mp3","url":"https://www.wired.com/story/best-festival-gear/","text":"Earplugs are non-negotiable. If I have to go to a concert with my kids, they need to be able to hear me over the music.","voice":4,"speaker":"Brett","summary":"Festival Gear Guide"},{"file":"audio_19.mp3","url":"https://www.wired.com/story/best-festival-gear/","text":"It's interesting how we've turned 'survival' into a curated shopping list for leisure.","voice":2,"speaker":"Conrad","summary":"Festival Gear Guide"},{"file":"audio_20.mp3","url":"https://firstthings.com/to-live-fittingly/","text":"There's also a piece on the humanities facing a hostile climate because academics have excluded ordinary readers from their work. It’s about making things accessible again...","voice":1,"speaker":"Brook","summary":"Humanities Climate Analysis"},{"file":"audio_21.mp3","url":"https://firstthings.com/to-live-fittingly/","text":"It mirrors the 'Hermetic' tradition where knowledge was hidden behind layers of initiation. If you don't speak the secret language, you're locked out.","voice":3,"speaker":"Antony","summary":"Humanities Climate Analysis"},{"file":"audio_22.mp3","url":"https://firstthings.com/to-live-fittingly/","text":"--But if the gatekeepers make it too hard to enter, eventually no one stays inside.","voice":2,"speaker":"Conrad","summary":"Humanities Climate Analysis"},{"file":"audio_23.mp3","url":"https://firstthings.com/the-summer-reading-list-2026/","text":"That ties into the summer reading stats. Forty percent of Americans didn't read a single book last year according to a YouGov poll.","voice":1,"speaker":"Brook","summary":"Summer Reading Trends"},{"file":"audio_24.mp3","url":"https://firstthings.com/the-summer-reading-list-2026/","text":"A desert of the mind. We are moving toward a state where the narrative is consumed in fragments rather than sustained arcs.","voice":3,"speaker":"Antony","summary":"Summer Reading Trends"},{"file":"audio_25.mp3","url":"https://firstthings.com/the-summer-reading-list-2026/","text":"I don't have time to read much either. Between work and the kids, I barely have time to check my emails.","voice":4,"speaker":"Brett","summary":"Summer Reading Trends"},{"file":"audio_26.mp3","url":"https://openai.com/index/how-ai-is-expanding-what-people-do-at-work","text":"While people aren't reading as much, AI is changing how we work. OpenAI research shows users are taking on tasks across different roles, basically reshaping job boundaries with ChatGPT.","voice":1,"speaker":"Brook","summary":"AI Work Expansion"},{"file":"audio_27.mp3","url":"https://openai.com/index/how-ai-is-expanding-what-people-do-at-work","text":"It’s the democratization of competence. You don't need to know 'how' as much as you need to know 'what' to ask for.","voice":2,"speaker":"Conrad","summary":"AI Work Expansion"},{"file":"audio_28.mp3","url":"https://openai.com/index/how-ai-is-expanding-what-people-do-at-work","text":"Or perhaps it's the outsourcing of the soul's labor. We are delegating our cognitive agency to a ghost in the machine.","voice":3,"speaker":"Antony","summary":"AI Work Expansion"},{"file":"audio_29.mp3","url":"https://openai.com/index/how-ai-is-expanding-what-people-do-at-work","text":"I just hope it doesn't make my kids' homework too easy. They need to learn how to think for themselves.","voice":4,"speaker":"Brett","summary":"AI Work Expansion"},{"file":"audio_30.mp3","url":"https://openai.com/index/scientific-computing-agentic-ai","text":"Actually, there's a specific field report on scientific computing in the age of agentic AI—scientists are using these coding agents to modernize software discovery in genomics...","voice":1,"speaker":"Brook","summary":"Agentic AI Computing"},{"file":"audio_31.mp3","url":"https://openai.com/index/scientific-computing-agentic-ai","text":"--That’s the real frontier. Using the tools to accelerate the very discoveries that will define our next century.","voice":2,"speaker":"Conrad","summary":"Agentic AI Computing"},{"file":"audio_32.mp3","url":"https://openai.com/index/scientific-computing-agentic-ai","text":"It's like Prometheus bringing fire to the laboratory. A tool of immense power that requires extreme stewardship.","voice":3,"speaker":"Antony","summary":"Agentic AI Computing"},{"file":"audio_33.mp3","url":"https://techcrunch.com/2026/07/29/doordash-is-building-its-own-drone-delivery-business/","text":"And on the logistics side, DoorDash just got FAA approval for a commercial drone delivery service in the US.","voice":1,"speaker":"Brook","summary":"DoorDash Drone Delivery"},{"file":"audio_34.mp3","url":"https://techcrunch.com/2026/07/29/doordash-is-building-its-own-drone-delivery-business/","text":"Drones? I'm already worried about cars. Now we have to worry about things falling from the sky while I'm trying to get the kids to school.","voice":4,"speaker":"Brett","summary":"DoorDash Drone Delivery"},{"file":"audio_35.mp3","url":"https://techcrunch.com/2026/07/29/doordash-is-building-its-own-drone-delivery-business/","text":"It’s the ultimate convenience—the physical manifestation of 'instant gratification'.","voice":2,"speaker":"Conrad","summary":"DoorDash Drone Delivery"},{"file":"audio_36.mp3","url":"https://apnews.com/article/iraq-us-iran-saudi-pmf-militias-disarmament-1b5396ca87f33baa4d5cf44869aaae73","text":"There's also a lot of movement in the Middle East. Iraq is balancing a widening war between the US and Iran, with strikes hitting Mosul.","voice":1,"speaker":"Brook","summary":"Iraq War Escalation"},{"file":"audio_37.mp3","url":"https://apnews.com/article/iraq-us-iran-saudi-pmf-militias-disarmament-1b5396ca87f33baa4d5cf44869aaae73","text":"The geopolitical chessboard is shifting again. It feels like a recurring cycle of empires trying to define the borders of influence.","voice":3,"speaker":"Antony","summary":"Iraq War Escalation"},{"file":"audio_38.mp3","url":"https://www.bbc.co.uk/news/articles/c70g6y24d76o?at_medium=RSS&at_campaign=rss","text":"And we see that same tension with Saudi Arabia joining the US in strikes on Iran-backed militias in Iraq.","voice":2,"speaker":"Conrad","summary":"US Saudi Strikes"},{"file":"audio_39.mp3","url":"https://www.bbc.co.uk/news/articles/c70g6y24d76o?at_medium=RSS&at_campaign=rss","text":"It's a lot of conflict for one news cycle. It makes it hard to focus on anything else.","voice":4,"speaker":"Brett","summary":"US Saudi Strikes"},{"file":"audio_40.mp3","url":"https://www.aljazeera.com/opinions/2026/7/29/why-saudi-arabia-holds-the-key-to-palestinian-statehood?traffic_source=rss","text":"Speaking of Saudi Arabia, they are also being cited as holding the key to Palestinian statehood due to their weight in the Arab and Islamic worlds.","voice":1,"speaker":"Brook","summary":"Saudi Arabia Statehood Role"},{"file":"audio_41.mp3","url":"https://www.aljazeera.com/opinions/2026/7/29/why-saudi-arabia-holds-the-key-to-palestinian-statehood?traffic_source=rss","text":"The 'Kingmaker' trope. One entity holds the keys to a door that everyone else is standing in front of.","voice":3,"speaker":"Antony","summary":"Saudi Arabia Statehood Role"},{"file":"audio_42.mp3","url":"https://www.aljazeera.com/opinions/2026/7/29/why-saudi-arabia-holds-the-key-to-palestinian-statehood?traffic_source=rss","text":"I hope they find a way to settle it soon. The uncertainty is exhausting.","voice":4,"speaker":"Brett","summary":"Saudi Arabia Statehood Role"},{"file":"audio_43.mp3","url":"https://www.bbc.co.uk/news/articles/ckg35n7yny3o?at_medium=RSS&at_campaign=rss","text":"On the environmental front, more than half of England is officially in drought after an exceptionally hot and dry period hitting rivers and crops.","voice":1,"speaker":"Brook","summary":"England Drought Crisis"},{ s the news from Japan—over a hundred aftershocks following a powerful quake that killed thirteen people.","voice":1,"speaker":"Brook","summary":"Japan Earthquake Aftershocks"},{"file":"audio_51.mp3","url":"https://www.bbc.co.uk/news/articles/cgk43y21j0do?at_medium=RSS&at_campaign=rss","text":"My heart goes out to them. That kind of constant shaking must be terrifying for families.","voice":4,"speaker":"Brett","summary":"Japan Earthquake Aftershocks"},{"file":"audio_52.mp3","url":"https://www.bbc.co.uk/news/articles/cgk43y21j0do?at_medium=RSS&at_campaign=rss","text":"The psychological toll of the 'aftershock' is often as heavy as the initial blow.","voice":2,"speaker":"Conrad","summary":"Japan Earthquake Aftershocks"},{"file":"audio_53.mp3","url":"https://www.bbc.co.uk/news/articles/cgk43y21j0do?at_medium=RSS&at_campaign=rss","text":"It’s like the tremors of a collapsing world. The earth itself is groaning under the weight of change.","voice":3,"speaker":"Antony","summary":"Japan Earthquake Aftershocks"},{"file":"audio_54.mp3","url":"https://www.aljazeera.com/video/newsfeed/2026/7/29/29-07-sv-india-student-arrests-in?traffic_source=rss","text":"In other news, an Indian student in Russia says he's been wrongly charged over 'Cockroach' protests despite being in Russia.","voice":1,"speaker":"Brook","summary":"Russian Student Charges"},{"file":"audio_55.mp3","url":"https://www.aljazeera.com/video/newsfeed/2026/7/29/29-07-sv-india-student-arrests-in?traffic_source=rss","text":"--That’s a bizarre jurisdictional mess. Being charged for a protest in one country while physically located in another?","voice":2,"speaker":"Conrad","summary":"Russian Student Charges"},{"file":"audio_56.mp3","url":"https://www.aljazeera.com/video/newsfeed/2026/7/29/29-07-sv-india-student-arrests-in?traffic_source=rss","text":"The 'Exiled Accusation.' It's as if the law is reaching across borders to grab at shadows.","voice":3,"speaker":"Antony","summary":"Russian Student Charges"},{"file":"audio_57.mp3","url":"https://www.aljazeera.com/video/newsfeed/2026/7/29/29-07-sv-india-student-arrests-in?traffic_source=rss","text":"That sounds like a nightmare for his legal situation. I can't imagine the stress of that.","voice":4,"speaker":"Brett","summary":"Russian Student Charges"},{"file":"audio_58.mp3","url":"https://www.theguardian.com/world/2026/jul/29/elephant-deaths-kenya-amboseli-national-park","text":"We also have some wildlife news—Kenya is investigating unexpected deaths of fifteen elephants in Amboseli national park; they found potential toxic substances.","voice":1,"speaker":"Brook","summary":"Kenya Elephant Deaths"},{"file":"audio_59.mp3","url":"https://www.theguardian.com/world/2026/jul/29/elephant-deaths-kenya-amboseli-national-park","text":"Nature's warning system. Something is poisoning the ecosystem from the inside out.","voice":2,"speaker":"Conrad","summary":"Kenya Elephant Deaths"},{"file":"audio_60.mp3","url":"https://www.theguardian.com/world/2026/jul/29/elephant-deaths-kenya-amboseli-national-park","text":"The 'Blight.' It’s a recurring theme where the environment turns hostile to its own giants.","voice":3,"speaker":"Antony","summary":"Kenya Elephant Deaths"},{"file":"audio_61.mp3","url":"https://www.theguardian.com/world/2026/jul/29/elephant-deaths-kenya-amboseli-national-park","text":"I hate seeing that. Elephants are such majestic creatures.","voice":4,"speaker":"Brett","summary":"Kenya Elephant Deaths"},{"file":"audio_62.mp3","url":"https://apnews.com/article/bts-grammys-kpop-ec796e4308f5d5990a2a667ffa4bf45e","text":"And finally, a bit of pop culture—BTS says they won't be submitting music for the 2027 Grammys.","voice":1,"speaker":"Brook","summary":"BTS Grammy News"},{"file":"audio_63.mp3","url":"https://apnews.com/article/bts-grammys-kpop-ec796e4308f5d5990a2a667ffa4bf45e","text":"The 'Renunciation.' A titan choosing to step away from the traditional accolades of the establishment.","voice":3,"speaker":"Antony","summary":"BTS Grammy News"},{"file":"audio_64.mp3","url":"https://apnews.com/article/bts-grammys-kpop-ec796e4308f5d5990a2a667ffa4bf45e","text":"Well, they've already made their mark. They don't need a trophy to prove it.","voice":4,"speaker":"Brett","summary":"BTS Grammy News"},{"file":"audio_65.mp3","url":"https://apnews.com/article/bts-grammys-kpop-ec796e4308f5d5990a2a667ffa4bf45e","text":"It’s about autonomy. Choosing where your legacy is validated and where it isn't.","voice":2,"speaker":"Conrad","summary":"BTS Grammy News"}]; 
        let cur = 0; 
        
        let plActive = document.getElementById('pl1'); 
        let plStandby = document.getElementById('pl2'); 
        
        const st = document.getElementById('st'); 
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const lnkWrap = document.getElementById('lnk-wrap');
        const lnk = document.getElementById('lnk');
        const summ = document.getElementById('summ');
        const tsText = document.getElementById('ts-text');
        const tsVoice = document.getElementById('ts-voice');
        const tsBox = document.getElementById('ts-box');
        const mediaStage = document.getElementById('media-stage');
        const podcastVideo = document.getElementById('podcast-video');
        const finalCover = document.getElementById('final-cover');
        const mediaHint = document.getElementById('media-hint');
        
        const chatContainer = document.getElementById('full-chat');
        const toggleBtn = document.getElementById('toggle-chat');
        
        // --- PRIMARY IMAGE → VIDEO → HIGH-QUALITY COMPANION IMAGE ---
        let videoReady = podcastVideo.readyState >= HTMLMediaElement.HAVE_ENOUGH_DATA;
        let finalImageReady = finalCover.complete && finalCover.naturalWidth > 0;
        let videoStarted = false;
        let videoUnavailable = false;

        function maybeStartVideo() {
            if (videoStarted || videoUnavailable || !videoReady || !finalImageReady) return;
            videoStarted = true;
            mediaStage.classList.remove('show-final');
            mediaStage.classList.add('video-playing');
            mediaHint.textContent = 'Playing motion';
            podcastVideo.currentTime = 0;
            podcastVideo.play().catch(() => {
                videoStarted = false;
                mediaHint.textContent = 'Tap to play motion';
            });
        }

        podcastVideo.addEventListener('canplaythrough', () => {
            videoReady = true;
            maybeStartVideo();
        }, { once: true });

        finalCover.addEventListener('load', () => {
            finalImageReady = true;
            maybeStartVideo();
        }, { once: true });

        podcastVideo.addEventListener('ended', () => {
            mediaStage.classList.add('show-final');
            mediaHint.textContent = 'Tap to replay';
        });

        podcastVideo.addEventListener('error', () => {
            videoUnavailable = true;
            mediaHint.textContent = 'Motion unavailable · tap for frame 2';
        });

        function activateMediaStage() {
            if (videoUnavailable) {
                mediaStage.classList.toggle('show-final');
                return;
            }
            if (mediaStage.classList.contains('show-final')) {
                mediaStage.classList.remove('show-final');
                videoStarted = false;
            }
            maybeStartVideo();
        }

        mediaStage.addEventListener('click', activateMediaStage);
        mediaStage.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                activateMediaStage();
            }
        });

        setTimeout(maybeStartVideo, 0);

        // --- BACKGROUND PRELOADER (+/- 2 Tracks) ---
        const preloadBuffer = {};
        
        function updatePreloadBuffer(index) {
            // Define the exact target window: 2 behind, 2 ahead
            const targets = [index - 2, index - 1, index + 1, index + 2]
                .filter(i => i >= 0 && i < playlist.length);
                
            // 1. Fetch new tracks into the invisible background buffer
            targets.forEach(i => {
                if (!preloadBuffer[i]) {
                    const bgAudio = new Audio();
                    bgAudio.src = playlist[i].file;
                    bgAudio.preload = 'auto'; // Forces browser to download/cache
                    preloadBuffer[i] = bgAudio;
                }
            });
            
            // 2. Clean up old tracks outside the +/- 2 window to save RAM
            Object.keys(preloadBuffer).forEach(key => {
                if (!targets.includes(parseInt(key))) {
                    preloadBuffer[key].src = ''; // Instantly kills the network request
                    delete preloadBuffer[key];
                }
            });
        }

        // --- KEYBOARD SHORTCUTS (J, K, L) ---
        document.addEventListener('keydown', (e) => {
            // Ignore keystrokes if the user holds Ctrl, Alt, or Cmd (e.g. Cmd+R to refresh)
            if (e.metaKey || e.ctrlKey || e.altKey) return;
            
            switch(e.key.toLowerCase()) {
                case 'j': // Previous
                    if (!btnPrev.disabled) btnPrev.click();
                    break;
                case 'l': // Next
                    if (!btnNext.disabled) btnNext.click();
                    break;
                case 'k': // Play/Pause
                    if (plActive.paused) {
                        plActive.play().catch(err => {});
                    } else {
                        plActive.pause();
                    }
                    break;
            }
        });

        // --- CHAT BUBBLE GENERATION ---
        let lastTopic = null;
        let currentGroup = null;
        
        playlist.forEach((item, idx) => {
            const currentTopic = item.summary || "Banter & Hot Takes";
            
            if (currentTopic !== lastTopic) {
                currentGroup = document.createElement('div');
                currentGroup.className = 'topic-group';
                chatContainer.appendChild(currentGroup);
                
                const header = document.createElement('div');
                header.className = 'topic-header';
                header.innerText = currentTopic;
                currentGroup.appendChild(header);
                
                lastTopic = currentTopic;
            }

            const bubble = document.createElement('div');
            bubble.className = 'chat-bubble ' + item.voice;
            bubble.id = 'chat-msg-' + idx;
            bubble.innerHTML = '<div class="chat-label">' + item.speaker + '</div>' + item.text;
            
            bubble.onclick = () => {
                if (cur !== idx) {
                    cur = idx;
                    updateUI(cur);
                    playNewTrack(cur);
                }
            };
            currentGroup.appendChild(bubble);
        });

        // --- UI TOGGLES ---
        toggleBtn.onclick = () => {
            const isVis = chatContainer.classList.toggle('visible');
            toggleBtn.innerText = isVis ? 'Hide Transcript' : 'Show Full Transcript';
            tsBox.style.display = isVis ? 'none' : 'block';

            if (isVis) {
                const activeBubble = document.getElementById('chat-msg-' + cur);
                if (activeBubble) activeBubble.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        };

        btnPrev.onclick = () => { if (cur > 0) { cur--; updateUI(cur); playNewTrack(cur); } };
        btnNext.onclick = () => { if (cur < playlist.length - 1) { cur++; updateUI(cur); playNewTrack(cur); } };

        // --- DUAL PLAYER LOGIC ---
        let isOverlapping = false;

        function updateUI(i) {
            if (i >= playlist.length) {
                st.innerText = 'Broadcast Ended';
                tsText.innerText = 'See you tomorrow!';
                tsVoice.innerText = '';
                lnkWrap.classList.remove('visible');
                btnNext.disabled = true;
                return;
            } 
            
            btnPrev.disabled = (i === 0);
            btnNext.disabled = (i >= playlist.length - 1);

            const t = playlist[i]; 
            st.innerText = 'Segment ' + (i + 1) + ' of ' + playlist.length;
            try { history.replaceState(null, '', '#section=' + (i + 1)); } catch (e) {}
            
            tsText.innerText = t.text;
            tsVoice.innerText = t.speaker;
            tsBox.className = 'transcript-box ' + t.voice;

            document.querySelectorAll('.chat-bubble').forEach((b, idx) => {
                if (idx === i) {
                    b.classList.add('active');
                    if (chatContainer.classList.contains('visible')) {
                        b.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                } else {
                    b.classList.remove('active');
                }
            });

            if (t.url) { 
                lnk.href = t.url; 
                if (t.summary) {
                    summ.innerText = t.summary;
                    summ.style.display = 'block';
                } else {
                    summ.style.display = 'none';
                }
                lnkWrap.classList.add('visible'); 
            } else { 
                lnkWrap.classList.remove('visible'); 
            } 
        }

        function attachPlayerLogic(playerIndex) {
            isOverlapping = false;

            plActive.ontimeupdate = () => {
                if (!isOverlapping && playerIndex < playlist.length - 1) {
                    const nextText = playlist[playerIndex + 1].text.trim();
                    if (nextText.startsWith('--')) {
                        if (plActive.duration && (plActive.duration - plActive.currentTime) <= OVERLAP_SECONDS) {
                            isOverlapping = true;
                            cur++;
                            updateUI(cur);
                            plStandby.src = playlist[cur].file;
                            plStandby.play().catch(e => {});
                        }
                    }
                }
            };

            plActive.onended = () => {
                if (isOverlapping) {
                    const temp = plActive;
                    plActive = plStandby;
                    plStandby = temp;

                    plActive.style.display = 'block';
                    plStandby.style.display = 'none';
                    attachPlayerLogic(cur);
                } else {
                    if (cur < playlist.length - 1) {
                        cur++;
                        updateUI(cur);
                        playNewTrack(cur);
                    }
                }
            };
        }

        function playNewTrack(i) {
            plActive.pause();
            plStandby.pause();
            
            // Trigger our background cache manager!
            updatePreloadBuffer(i);
            
            // Check if the file is already cached in our buffer
            if (preloadBuffer[i] && preloadBuffer[i].readyState === 4) {
                // If it is fully loaded in the background, assign it instantly
                plActive.src = preloadBuffer[i].src;
            } else {
                // Fallback normal loading
                plActive.src = playlist[i].file;
            }
            
            plActive.style.display = 'block';
            plStandby.style.display = 'none';
            plActive.play().catch(e => {});
            attachPlayerLogic(i);
        }

        cur = (function () { var m = (location.hash || '').match(/(d+)/); if (m) { var i = parseInt(m[1], 10) - 1; if (i >= 0 && i < playlist.length) return i; } return 0; })();
        updateUI(cur);
        playNewTrack(cur);

        }

        function injectPodcastNavigation(foldersArray) {
            const currentFolder = 'v2026.31.4-03.30';
            const currentIndex = foldersArray.indexOf(currentFolder);
            if (currentIndex < 0) return;

            const older = foldersArray[currentIndex + 1];
            const newer = currentIndex > 0 ? foldersArray[currentIndex - 1] : null;
            const olderLink = document.getElementById('podcast-older');
            const newerLink = document.getElementById('podcast-newer');

            if (older) {
                olderLink.href = '/projects/news/' + older + '/';
                olderLink.textContent = '← Older · ' + older;
                olderLink.classList.remove('disabled');
                olderLink.removeAttribute('aria-disabled');
            }
            if (newer) {
                newerLink.href = '/projects/news/' + newer + '/';
                newerLink.textContent = 'Newer · ' + newer + ' →';
                newerLink.classList.remove('disabled');
                newerLink.removeAttribute('aria-disabled');
            }
        }

        function injectSidebarUI(foldersArray) {
            const style = document.createElement('style');

            document.head.appendChild(style);

            const overlay = document.createElement('div');
            overlay.id = 'sidebar-overlay';
            document.body.appendChild(overlay);

            const sidebar = document.createElement('div');
            sidebar.id = 'news-sidebar';
            sidebar.innerHTML = '<div class="sidebar-header"><h2>Archives</h2><button class="sidebar-close" id="news-close-btn">&times;</button></div>';
            
            const list = document.createElement('ul');
            list.className = 'sidebar-list';
            
            foldersArray.forEach(folderString => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `/projects/news/${folderString}/`;
                
                const parts = folderString.split('-');
                if (parts.length >= 4) {
                    const dateObj = new Date(`${parts[0]}-${parts[1]}-${parts[2]}T00:00:00`);
                    const suffix = parts.slice(3).join(' ').replace(/\b\w/g, c => c.toUpperCase());
                    a.innerText = `${dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })} - ${suffix}`;
                } else {
                    a.innerText = folderString;
                }
                
                li.appendChild(a);
                list.appendChild(li);
            });
            sidebar.appendChild(list);
            document.body.appendChild(sidebar);

            const btn = document.createElement('button');
            btn.id = 'news-menu-btn';
            btn.innerHTML = '&#9776; Menu';
            document.body.appendChild(btn);

            const closeBtn = document.getElementById('news-close-btn');
            const toggleMenu = () => {
                if (sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('open');
                    setTimeout(() => overlay.style.display = 'none', 300);
                } else {
                    overlay.style.display = 'block';
                    setTimeout(() => { sidebar.classList.add('open'); overlay.classList.add('open'); }, 10);
                }
            };
            btn.addEventListener('click', toggleMenu);
            closeBtn.addEventListener('click', toggleMenu);
            overlay.addEventListener('click', toggleMenu);
        }
        
        if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', initSidebarMenu); } 
        else { initSidebarMenu(); }
    </script>
</body>
</html>
