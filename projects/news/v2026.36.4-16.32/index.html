const EP = {"folder":"v2026.36.4-16.32","songTitle":"The Weight of the Tide","hasLegacy":true,"credits":"Song \"The Weight of the Tide\" sung by YuE2 (take 812709). Picture: an animatic of Qwen Image 2512 stills cut to the song; no motion clips were rendered for this day yet.","sources":[],"playlist":[{"kind":"video","file":null,"url":null,"text":"[Verse 1]\nThe fog sits on the desolate shore.\nDawn light hits the cold water.\nSmuggling gangs use the mega-dinghies.\nThey use the Channel Smuggling Mega-Dinghies.\n\n[Chorus]\nThe tide carries the weight.\nLarge vessels move through the grey.\nSmall boats are no longer here.\nThe water feels very deep.\n\n[Verse 2]\nCrackdowns made the small boats disappear.\nThese gangs must work together now.\nThey lash the massive vessels together.\nThey carry people across the sea.\n\n[Chorus]\nThe tide carries the weight.\nLarge vessels move through the grey.\nSmall boats are no longer here.\nThe water feels very deep.\n\n[Bridge]\nThe salt water feels like lead.\nThe morning feels very quiet.\n\n[Chorus]\nThe tide carries the weight.\nLarge vessels move through the grey.\nSmall boats are no longer here.\nThe water feels very deep.","voice":"song","speaker":"Music video","summary":"The Weight of the Tide"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_0.mp3","url":"https://www.wired.com/story/2026-supersized-el-nino-impacts-worsen/","text":"I was looking at the WMO warnings this morning... it sounds like we're moving into a 'supersized' El Niño situation.","voice":1,"speaker":"Brook","summary":"Supersized El Niño Warning"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_1.mp3","url":"https://www.wired.com/story/2026-supersized-el-nino-impacts-worsen/","text":"Supersized? That’s an ominous bit of branding for a weather pattern. It suggests the usual disruptions are going to be... well, significantly more chaotic than we're used to.","voice":2,"speaker":"Conrad","summary":"Supersized El Niño Warning"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_2.mp3","url":"https://www.wired.com/story/2026-supersized-el-nino-impacts-worsen/","text":"Exactly. When you see 'dire consequences' in a global forecast like that, it usually means the infrastructure just isn't built for these extremes anymore.","voice":1,"speaker":"Brook","summary":"Supersized El Niño Warning"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_3.mp3","url":"https://www.wired.com/story/2026-supersized-el-nino-impacts-worsen/","text":"It’s the classic engineering problem—designing for the average when the outliers are becoming the new normal.","voice":2,"speaker":"Conrad","summary":"Supersized El Niño Warning"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_4.mp3","url":"https://www.wired.com/story/2026-supersized-el-nino-impacts-worsen/","text":"Right. It's not just a 'hot summer' anymore; it's a systemic stress test on global economies.","voice":1,"speaker":"Brook","summary":"Supersized El Niño Warning"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_5.mp3","url":"https://www.wired.com/story/2026-supersized-el-nino-impacts-worsen/","text":"Which is why the warning is so critical. We need to move from reactive fixes to proactive resilience.","voice":2,"speaker":"Conrad","summary":"Supersized El Niño Warning"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_6.mp3","url":null,"text":"I'm Brook.","voice":1,"speaker":"Brook","summary":null},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_7.mp3","url":null,"text":"And I'm Conrad, and on today's episode of Patch Notes, we're looking at the scale of global climate shifts, some heavy-hitting human rights issues, and a few oddities from the tech and sports worlds.","voice":2,"speaker":"Conrad","summary":null},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_8.mp3","url":"https://www.bbc.co.uk/news/articles/c17jqp0xzpzo?at_medium=RSS&at_campaign=rss","text":"So, back to that El Niño situation—the WMO is saying it could last until at least February. That's a long window for 'dire consequences.'","voice":1,"speaker":"Brook","summary":"UN El Niño Warning"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_9.mp3","url":"https://www.bbc.co.uk/news/articles/c17jqp0xzpzo?at_medium=RSS&at_campaign=rss","text":"It really highlights how interconnected everything is. A weather pattern in the Pacific doesn't stay in the Pacific; it ripples through global trade and food security.","voice":2,"speaker":"Conrad","summary":"UN El Niño Warning"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_10.mp3","url":"https://www.aljazeera.com/video/newsfeed/2026/9/3/floodwaters-sweep-cars-away-in-eastern-china?traffic_source=rss","text":"And then you have the immediate physical impact we're seeing elsewhere, like those floodwaters in eastern China sweeping cars away. It’s a visceral reminder of what 'disruption' actually looks like on the ground.","voice":1,"speaker":"Brook","summary":"China Floods Sweep Cars"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_11.mp3","url":"https://www.aljazeera.com/video/newsfeed/2026/9/3/floodwaters-sweep-cars-away-in-eastern-china?traffic_source=rss","text":"It's terrifying footage. When water moves that fast, it doesn't matter how sturdy your vehicle is; it just becomes debris.","voice":2,"speaker":"Conrad","summary":"China Floods Sweep Cars"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_12.mp3","url":"https://firstthings.com/governments-sex-abuse-hypocrisy-comes-due/","text":"Moving on to something much more somber—there’s a report about the hypocrisy of government sex abuse cases coming due, specifically involving someone who spent nearly three decades in senior roles within Catholic dioceses.","voice":1,"speaker":"Brook","summary":"Government Sex Abuse Hypocrisy"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_13.mp3","url":"https://firstthings.com/governments-sex-abuse-hypocrisy-comes-due/","text":"That's a heavy one. It speaks to that long-term systemic failure where the people tasked with oversight are often the ones facilitating the cover-up.","voice":2,"speaker":"Conrad","summary":"Government Sex Abuse Hypocrisy"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_14.mp3","url":"https://firstthings.com/governments-sex-abuse-hypocrisy-comes-due/","text":"Twenty-seven years in those positions... it suggests a level of institutional inertia that's incredibly hard to break from the inside.","voice":1,"speaker":"Brook","summary":"Government Sex Abuse Hypocrisy"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_15.mp3","url":"https://firstthings.com/governments-sex-abuse-hypocrisy-comes-due/","text":"It really does. It’s about how power structures protect themselves over decades, even when the human cost is so clear.","voice":2,"speaker":"Conrad","summary":"Government Sex Abuse Hypocrisy"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_16.mp3","url":"https://www.bbc.co.uk/news/articles/ce3rn93de9eo?at_medium=RSS&at_campaign=rss","text":"On a different note of systemic issues, there's a report on channel smuggling gangs. They're actually being forced to work together because they've run out of small boats due to crackdowns.","voice":1,"speaker":"Brook","summary":"Channel Smuggling Mega-Dinghies"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_17.mp3","url":"https://www.bbc.co.uk/news/articles/ce3rn93de9eo?at_medium=RSS&at_campaign=rss","text":"That’s a fascinating—if not alarming—bit of criminal logistics. It shows how much pressure the authorities are putting on their traditional methods.","voice":2,"speaker":"Conrad","summary":"Channel Smuggling Mega-Dinghies"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_18.mp3","url":"https://www.bbc.co.uk/news/articles/ce3rn93de9eo?at_medium=RSS&at_campaign=rss","text":"They're moving to 'mega-dinghies.' It’s a classic example of an adversary adapting to a new constraint by scaling up.","voice":1,"speaker":"Brook","summary":"Channel Smuggling Mega-Dinghies"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_19.mp3","url":"https://www.bbc.co.uk/news/articles/ce3rn93de9eo?at_medium=RSS&at_campaign=rss","text":"Exactly. When you close the small door, they just build a bigger one.","voice":2,"speaker":"Conrad","summary":"Channel Smuggling Mega-Dinghies"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_20.mp3","url":"https://apnews.com/article/us-open-carlos-alcaraz-feccb0ff7cd05ebb4dffb3913e90280d","text":"And in sports, we've got Carlos Alcaraz making his way through the US Open. He dropped the first set but managed to recover for the third round.","voice":1,"speaker":"Brook","summary":"Alcaraz US Open Progress"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_21.mp3","url":"https://apnews.com/article/us-open-carlos-alcaraz-feccb0ff7cd05ebb4dffb3913e90280d","text":"He’s shown some real grit there. Recovering from a lost set in a tournament like that is where you see who has the mental stamina.","voice":2,"speaker":"Conrad","summary":"Alcaraz US Open Progress"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_22.mp3","url":"https://openai.com/index/atv-big-air-tour","text":"True. And on the tech side, it's interesting to see how companies like ATV Big Air Tour are using ChatGPT to turn three days of marketing work into just three hours.","voice":1,"speaker":"Brook","summary":"ChatGPT Speeds Up Marketing"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_23.mp3","url":"https://openai.com/index/atv-big-air-tour","text":"That’s a massive leap in efficiency for merchandising and inventory. It's the practical application of AI we keep hearing about.","voice":2,"speaker":"Conrad","summary":"ChatGPT Speeds Up Marketing"},{"file":"https://assets.brook.dev/podcasts/v2026.36.4-16.32/audio_24.mp3","url":"https://openai.com/index/atv-big-air-tour","text":"It's definitely changing the 'how' of small business operations.","voice":1,"speaker":"Brook","summary":"ChatGPT Speeds Up Marketing"}]};
const playlist = EP.playlist;

// Lyrics show on the video only while the music video is the current segment.
function setLyrics(on) { if (lyricsTrack) lyricsTrack.mode = on ? 'showing' : 'hidden'; }

let cur = 0;
let isOverlapping = false;

function colourFor(item) {
  if (item.kind === 'video') return COLOURS[0];
  const v = typeof item.voice === 'number' ? item.voice : String(item.voice).length;
  return COLOURS[(v % (COLOURS.length - 1)) + 1];
}

function refreshSoundButton() {
  mvSound.textContent = mv.muted ? 'Sound: off' : 'Sound: on';
  mvSound.setAttribute('aria-pressed', String(!mv.muted));
}

function refreshNote() {
  if (cur === 0) {
    mvNote.textContent = playlist.length > 1 ? 'The music video opens the episode; the news follows when it ends.' : '';
  } else {
    mvNote.textContent = mv.paused ? 'The news is playing. You can play the video alongside it, with or without its sound.' : (mv.muted ? 'Video playing without sound.' : 'Video playing with its sound.');
  }
}

function currentLyric() {
  if (!lyricsTrack || !lyricsTrack.activeCues || !lyricsTrack.activeCues.length) return '';
  return Array.from(lyricsTrack.activeCues).map((c) => c.text).join('\n');
}

function updateUI(i) {
  btnPrev.disabled = i === 0;
  btnNext.disabled = i >= playlist.length - 1;
  const t = playlist[i];
  st.textContent = 'Segment ' + (i + 1) + ' of ' + playlist.length + (i === 0 ? ' · music video' : '');
  try { history.replaceState(null, '', '#section=' + (i + 1)); } catch (e) {}
  tsVoice.textContent = t.speaker;
  tsText.textContent = i === 0 ? (currentLyric() || '♪ ' + EP.songTitle) : t.text;
  tsBox.style.borderLeftColor = colourFor(t);
  document.querySelectorAll('.chat-bubble').forEach((b, idx) => {
    b.classList.toggle('active', idx === i);
    if (idx === i && chatContainer.classList.contains('visible')) b.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  if (t.url) {
    lnk.href = t.url;
    summ.textContent = t.summary || '';
    lnkWrap.classList.add('visible');
  } else {
    lnkWrap.classList.remove('visible');
  }
  refreshNote();
}

const preload = {};
function preloadAround(i) {
  const targets = [i + 1, i + 2].filter((n) => n > 0 && n < playlist.length);
  targets.forEach((n) => { if (!preload[n]) { const a = new Audio(); a.preload = 'auto'; a.src = playlist[n].file; preload[n] = a; } });
  Object.keys(preload).forEach((k) => { if (!targets.includes(+k)) { preload[k].src = ''; delete preload[k]; } });
}

function stopAudio() { plActive.pause(); plStandby.pause(); }

function attachPlayerLogic(idx) {
  isOverlapping = false;
  plActive.ontimeupdate = () => {
    if (isOverlapping || idx >= playlist.length - 1) return;
    if (playlist[idx + 1].text.trim().startsWith('--') && plActive.duration && plActive.duration - plActive.currentTime <= 2) {
      isOverlapping = true;
      cur++;
      updateUI(cur);
      plStandby.src = playlist[cur].file;
      plStandby.play().catch(() => {});
    }
  };
  plActive.onended = () => {
    if (isOverlapping) {
      const tmp = plActive; plActive = plStandby; plStandby = tmp;
      plActive.style.display = 'block'; plStandby.style.display = 'none';
      attachPlayerLogic(cur);
    } else if (cur < playlist.length - 1) {
      go(cur + 1);
    } else {
      st.textContent = 'Broadcast ended';
    }
  };
}

function go(i, opts) {
  const autoplay = !opts || opts.autoplay !== false;
  cur = i;
  updateUI(i);
  if (i === 0) {
    stopAudio();
    plActive.style.display = 'none';
    plStandby.style.display = 'none';
    setLyrics(true);
    mv.muted = false;
    if (!mv.paused || mv.ended || mv.currentTime > 0) mv.currentTime = 0;
    if (autoplay) mv.play().catch(() => { mvNote.textContent = 'Press play on the video to start.'; });
    refreshSoundButton();
    return;
  }
  // Leaving the song for the news: stop the song, hide its lyrics, and mute the video so it can be
  // played alongside the news without the two soundtracks clashing until the listener asks.
  setLyrics(false);
  if (!mv.paused) mv.pause();
  mv.muted = true;
  refreshSoundButton();
  stopAudio();
  preloadAround(i);
  plActive.src = playlist[i].file;
  plActive.style.display = 'block';
  plStandby.style.display = 'none';
  if (autoplay) plActive.play().catch(() => {});
  attachPlayerLogic(i);
}

mv.addEventListener('ended', () => {
  if (cur === 0 && playlist.length > 1) go(1);
  refreshNote();
});
mv.addEventListener('play', () => {
  if (cur === 0) stopAudio();
  refreshNote();
});
mv.addEventListener('pause', refreshNote);
mv.addEventListener('volumechange', () => { refreshSoundButton(); refreshNote(); });
mvSound.addEventListener('click', () => { mv.muted = !mv.muted; });
if (lyricsTrack) lyricsTrack.addEventListener('cuechange', () => { if (cur === 0) tsText.textContent = currentLyric() || '♪ ' + EP.songTitle; });

btnPrev.onclick = () => { if (cur > 0) go(cur - 1); };
btnNext.onclick = () => { if (cur < playlist.length - 1) go(cur + 1); };

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && /^(INPUT|TEXTAREA|BUTTON|VIDEO|AUDIO)$/.test(e.target.tagName) && e.key === ' ') return;
  const k = e.key.toLowerCase();
  if (k === 'j' && !btnPrev.disabled) btnPrev.click();
  if (k === 'l' && !btnNext.disabled) btnNext.click();
  if (k === 'k') {
    const p = cur === 0 ? mv : plActive;
    if (p.paused) p.play().catch(() => {}); else p.pause();
  }
});

let lastTopic = null;
let group = null;
playlist.forEach((item, idx) => {
  const topic = item.summary || 'Banter and hot takes';
  if (topic !== lastTopic) {
    group = document.createElement('div');
    const h = document.createElement('div');
    h.className = 'topic-header'; h.textContent = topic;
    group.appendChild(h);
    chatContainer.appendChild(group);
    lastTopic = topic;
  }
  const b = document.createElement('div');
  b.className = 'chat-bubble';
  b.style.setProperty('--c', colourFor(item));
  const label = document.createElement('div');
  label.className = 'chat-label'; label.textContent = item.speaker;
  b.appendChild(label);
  b.appendChild(document.createTextNode(item.text));
  b.onclick = () => go(idx);
  group.appendChild(b);
});

toggleBtn.onclick = () => {
  const vis = chatContainer.classList.toggle('visible');
  toggleBtn.textContent = vis ? 'Hide transcript' : 'Show full transcript';
  tsBox.style.display = vis ? 'none' : 'block';
};

const startAt = (() => { const m = (location.hash || '').match(/section=(\d+)/); const n = m ? parseInt(m[1], 10) - 1 : 0; return n >= 0 && n < playlist.length ? n : 0; })();
setLyrics(startAt === 0);
go(startAt);
refreshSoundButton();

async function initMenu() {
  try {
    const r = await fetch('/projects/news/menu-data.json');
    if (!r.ok) return;
    const folders = await r.json();
    const at = folders.indexOf(FOLDER);
    if (at >= 0) {
      const older = folders[at + 1];
      const newer = at > 0 ? folders[at - 1] : null;
      const o = document.getElementById('podcast-older');
      const n = document.getElementById('podcast-newer');
      if (older) { o.href = '/projects/news/' + older + '/'; o.textContent = '← Older · ' + older; o.classList.remove('disabled'); o.removeAttribute('aria-disabled'); }
      if (newer) { n.href = '/projects/news/' + newer + '/'; n.textContent = 'Newer · ' + newer + ' →'; n.classList.remove('disabled'); n.removeAttribute('aria-disabled'); }
    }
    const overlay = document.createElement('div'); overlay.id = 'sidebar-overlay'; document.body.appendChild(overlay);
    const sidebar = document.createElement('div'); sidebar.id = 'news-sidebar';
    sidebar.innerHTML = '<div class="sidebar-header"><h2>Archives</h2><button class="sidebar-close" id="news-close-btn" aria-label="Close">&times;</button></div>';
    const list = document.createElement('ul'); list.className = 'sidebar-list';
    folders.forEach((f) => { const li = document.createElement('li'); const a = document.createElement('a'); a.href = '/projects/news/' + f + '/'; a.textContent = f; li.appendChild(a); list.appendChild(li); });
    sidebar.appendChild(list); document.body.appendChild(sidebar);
    const btn = document.createElement('button'); btn.id = 'news-menu-btn'; btn.innerHTML = '&#9776; Menu'; document.body.appendChild(btn);
    const toggle = () => { const open = !sidebar.classList.contains('open'); sidebar.classList.toggle('open', open); overlay.classList.toggle('open', open); };
    btn.addEventListener('click', toggle);
    overlay.addEventListener('click', toggle);
    document.getElementById('news-close-btn').addEventListener('click', toggle);
  } catch (e) { console.error('Menu failed:', e); }
}
initMenu();
</script>
</body>
