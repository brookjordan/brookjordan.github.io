    <script>
        const OVERLAP_SECONDS = 2;
        const playlist = [{"file":"intro.mp3","url":null,"text":"🎵 (sung) Oil is climbing and AI's lying / Taiwan's tense while the Reds are flying / Don't forget to watch for falling lettuce","voice":"intro","speaker":"Intro Theme","summary":"Intro"},{"file":"audio_0.mp3","url":null,"text":"Good afternoon, everyone. I'm looking at the weather and it looks like we're in for another scorcher today.","voice":4,"speaker":"Brett","summary":null},{"file":"audio_1.mp3","url":"https://www.bbc.co.uk/weather/articles/c36dr3r3ny0o?at_medium=RSS&at_campaign=rss","text":"It is actually fascinating how the atmospheric pressure shifts when we hit these heat spikes... I was looking at some telemetry data from our fleet sensors and the way the cooling systems have to compensate for ambient temperatures over thirty degrees is basically a massive optimization problem involving fluid dynamics and...","voice":1,"speaker":"Brook","summary":"UK Heat Records"},{"file":"audio_2.mp3","url":"https://www.bbc.co.uk/weather/articles/c36dr3r3ny0o?at_medium=RSS&at_campaign=rss","text":"--It's a physical manifestation of our changing environment, Brook. But let's look at the human cost; we're seeing record-breaking heat across the UK again.","voice":2,"speaker":"Conrad","summary":"UK Heat Records"},{"file":"audio_3.mp3","url":"https://www.bbc.co.uk/weather/articles/c36dr3r3ny0o?at_medium=RSS&at_campaign=rss","text":"It reminds me of the 'Great Heat' described in some obscure 17th-century mystical texts where the sun was seen as a purifying fire... though I suspect our current situation is less spiritual and more geological.","voice":3,"speaker":"Antony","summary":"UK Heat Records"},{"file":"audio_4.mp3","url":"https://www.bbc.co.uk/weather/articles/c36dr3r3ny0o?at_medium=RSS&at_campaign=rss","text":"Just make sure you're drinking enough water. My kids are already complaining about the heat in the house.","voice":4,"speaker":"Brett","summary":"UK Heat Records"},{"file":"audio_5.mp3","url":"https://kottke.org/26/08/0049478-the-most-complicated-boar","text":"Moving on to something a bit more... complex. We have news about 'The Campaign for North Africa,' which is apparently the most complicated board game ever made.","voice":2,"speaker":"Conrad","summary":"Complex War Board Game"},{"file":"audio_6.mp3","url":"https://kottke.org/26/08/0049478-the-most-complicated-boar","text":"That sounds like a nightmare of state management! If you're trying to simulate granular WW2 logistics, you need a massive amount of variables for supply lines, fuel consumption, and unit degradation... I actually tried building a simplified logic gate for a similar simulation once but the branching paths became...","voice":1,"speaker":"Brook","summary":"Complex War Board Game"},{"file":"audio_7.mp3","url":"https://kottke.org/26/08/0049478-the-most-complicated-boar","text":"--It's a ludic representation of total war. It echoes the 'War Games' trope where the complexity of the system eventually overwhelms the agency of the player.","voice":3,"speaker":"Antony","summary":"Complex War Board Game"},{"file":"audio_8.mp3","url":"https://kottke.org/26/08/0049478-the-most-complicated-boar","text":"As long as it doesn't take longer than a dinner to play, I don't see why people are obsessed with it.","voice":4,"speaker":"Brett","summary":"Complex War Board Game"},{"file":"audio_9.mp3","url":"https://www.aljazeera.com/video/newsfeed/2026/8/12/russia-frees-ex-us-marine-gilman-jailed-since-2022?traffic_source=rss","text":"Russia has released former US marine Robert Gilman, who had been jailed since 2022 for attacking a police officer. It's a significant diplomatic move.","voice":2,"speaker":"Conrad","summary":"Russia Frees US Marine"},{"file":"audio_10.mp3","url":"https://www.aljazeera.com/video/newsfeed/2026/8/12/russia-frees-ex-us-marine-gilman-jailed-since-2022?traffic_source=rss","text":"The release of a prisoner often mirrors the shifting tides of geopolitical favor... it's like a chess move in a much larger, invisible game.","voice":3,"speaker":"Antony","summary":"Russia Frees US Marine"},{"file":"audio_11.mp3","url":"https://www.aljazeera.com/economy/2026/8/12/oil-prices-rise-as-attacks-dent-hopes-for-strait-of-hormuz-reopening?traffic_source=rss","text":"And speaking of global shifts, oil prices are climbing again because attacks are denting hopes for the Strait of Hormuz reopening. That's a huge bottleneck for energy markets.","voice":1,"speaker":"Brook","summary":"Oil Prices Rise"},{"file":"audio_12.mp3","url":"https://www.aljazeera.com/economy/2026/8/12/oil-prices-rise-as-attacks-dent-hopes-for-strait-of-hormuz-reopening?traffic_source=rss","text":"It shows how fragile our global infrastructure is. One point of friction in a waterway can ripple through every gas station in the country.","voice":2,"speaker":"Conrad","summary":"Oil Prices Rise"},{"file":"audio_13.mp3","url":"https://www.aljazeera.com/economy/2026/8/12/oil-prices-rise-as-attacks-dent-hopes-for-strait-of-hormuz-reopening?traffic_source=rss","text":"I just want to make sure my commute doesn't get more expensive because of it.","voice":4,"speaker":"Brett","summary":"Oil Prices Rise"},{"file":"audio_14.mp3","url":"https://apnews.com/article/mainland-spouses-taiwan-china-discrimination-b507abdeeab2e33ff727583b157e0f07","text":"In Taiwan, Chinese-born spouses are facing some really tough questions about loyalty and discrimination. It's a complex social dynamic with Li Chen-hsiu being sworn in as a member of the legislature.","voice":1,"speaker":"Brook","summary":"Taiwan Loyalty Questions"},{"file":"audio_15.mp3","url":"https://apnews.com/article/mainland-spouses-taiwan-china-discrimination-b507abdeeab2e33ff727583b157e0f07","text":"It brings to mind the 'dual identity' trope found in various esoteric allegories... the struggle of belonging to two worlds that are increasingly at odds with one another.","voice":3,"speaker":"Antony","summary":"Taiwan Loyalty Questions"},{"file":"audio_16.mp3","url":"https://apnews.com/article/mainland-spouses-taiwan-china-discrimination-b507abdeeab2e33ff727583b157e0f07","text":"It's a very real, very human tension regarding where your primary allegiance lies when your heritage and your home are in conflict.","voice":2,"speaker":"Conrad","summary":"Taiwan Loyalty Questions"},{"file":"audio_17.mp3","url":"https://apnews.com/article/reds-white-sox-score-0e9e6b644c1e5053ad268c26d7e4efbe","text":"On a lighter note, the Reds rallied late to beat the White Sox 5-4 in the 10th. They actually spoiled a pope hat giveaway night in Chicago.","voice":1,"speaker":"Brook","summary":"Reds Beat White Sox"},{"file":"audio_18.mp3","url":"https://apnews.com/article/reds-white-sox-score-0e9e6b644c1e5053ad268c26d7e4efbe","text":"I don't know much about baseball, but a mascot in a pope outfit sounds like something my kids would find hilarious.","voice":4,"speaker":"Brett","summary":"Reds Beat White Sox"},{"file":"audio_19.mp3","url":"https://apnews.com/article/reds-white-sox-score-0e9e6b644c1e5053ad268c26d7e4efbe","text":"There's something inherently absurd about the juxtaposition of religious iconography and sports mascots.","voice":2,"speaker":"Conrad","summary":"Reds Beat White Sox"},{"file":"audio_20.mp3","url":"https://www.economist.com/culture/2026/07/30/how-to-spot-ai-writing?giftId=NzBlNTc2OGItMDgxNS00N2EzLWE4NmUtZDgzZmE4Y2FkM2Mw","text":"The Economist just put out a guide on how to spot AI writing. They want us to look for specific hallmarks by comparing different styles.","voice":1,"speaker":"Brook","summary":"Spotting AI Writing"},{"file":"audio_21.mp3","url":"https://www.economist.com/culture/2026/07/30/how-to-spot-ai-writing?giftId=NzBlNTc2OGItMDgxNS00N2EzLWE4NmUtZDgzZmE4Y2FkM2Mw","text":"It's the modern 'Turing Test.' We are looking for the ghost in the machine, or rather, the lack of a soul in the syntax.","voice":3,"speaker":"Antony","summary":"Spotting AI Writing"},{"file":"audio_22.mp3","url":"https://www.economist.com/culture/2026/07/30/how-to-spot-ai-writing?giftId=NzBlNTc2OGItMDgxNS00N2EzLWE4NmUtZDgzZmE4Y2FkM2Mw","text":"--Actually, it's more about identifying patterns. AI follows rules; humans follow whims. That's the distinction we need to find.","voice":2,"speaker":"Conrad","summary":"Spotting AI Writing"},{"file":"audio_23.mp3","url":"https://tumbledry.org/2026/08/07/idrive_ads","text":"Speaking of tech and cars, Alex Micek is talking about BMW’s iDrive 'Special Surprises.' He says he'd be angry if his car stranded him or if the motor brushes failed unexpectedly.","voice":1,"speaker":"Brook","summary":"BMW iDrive Surprises"},{"file":"audio_24.mp3","url":"https://tumbledry.org/2026/08/07/idrive_ads","text":"I agree with him. If my car stops working on a Tuesday morning when I have three kids to get to school, I'm going to be more than just 'angry.'","voice":4,"speaker":"Brett","summary":"BMW iDrive Surprises"},{"file":"audio_25.mp3","url":"https://tumbledry.org/2026/08/07/idrive_ads","text":"Reliability is the ultimate luxury in autonomous and semi-autonomous systems.","voice":2,"speaker":"Conrad","summary":"BMW iDrive Surprises"},{"file":"audio_26.mp3","url":"https://kottke.org/26/08/0049477-soft-secession","text":"We're seeing a new vocabulary term emerge: 'soft secession.' It describes a situation where a group remains technically part of a larger entity but functions independently.","voice":3,"speaker":"Antony","summary":"Soft Secession Term"},{"file":"audio_27.mp3","url":"https://kottke.org/26/08/0049477-soft-secession","text":"It’s a fascinating linguistic evolution. It captures the nuance of modern political and social fragmentation perfectly.","voice":2,"speaker":"Conrad","summary":"Soft Secession Term"},{"file":"audio_28.mp3","url":"https://www.wired.com/story/is-it-safe-to-eat-lettuce-yet/","text":"Is it safe to eat lettuce yet? A food safety professor says that since the specific product is off the market, there's a lower risk for cyclospora.","voice":1,"speaker":"Brook","sum         podcastVideo.addEventListener('canplaythrough', () => {

            maybeStartVideo();

            finalImageReady = true;

        podcastVideo.addEventListener('ended', () => {
            mediaStage.classList.add('show-final');
            mediaHint.textContent = 'Tap to replay';

            videoUnavailable = true;

        // --- BACKGROUND PRELOADER (+/- 2 Tracks) ---
        const preloadBuffer = {};
        
        function updatePreloadBuffer(index) {
            // Define the exact target window: 2 behind, 2 ahead
            const targets = [index - 2, index - 1, index + 1, index + 2]
                .filter(i => i >= 0 && i < playlist.length);
                
            // 1. Fetch new tracks into the invisible background buffer
            targets.forEach(i => {
                if (!preloadBuffer[i]) {
                    const bgAudio = new Audio();
                    bgAudio.src = playlist[i].file;
                    bgAudio.preload = 'auto'; // Forces browser to download/cache
                    preloadBuffer[i] = bgAudio;
                }
            });
            
            // 2. Clean up old tracks outside the +/- 2 window to save RAM
            Object.keys(preloadBuffer).forEach(key => {
                if (!targets.includes(parseInt(key))) {
                    preloadBuffer[key].src = ''; // Instantly kills the network request
                    delete preloadBuffer[key];
                }
            });
        }

                case 'j': // Previous

                lnkWrap.classList.remove('visible');
                btnNext.disabled = true;

            btnPrev.disabled = (i === 0);

            const sidebar = document.createElement('div');
            sidebar.id = 'news-sidebar';
            sidebar.innerHTML = '<div class="sidebar-header"><h2>Archives</h2><button class="sidebar-close" id="news-close-btn">&times;</button></div>';
            
            const list = document.createElement('ul');
            list.className = 'sidebar-list';
            
            foldersArray.forEach(folderString => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `/projects/news/${folderString}/`;
                
                const parts = folderString.split('-');
                if (parts.length >= 4) {
                    const dateObj = new Date(`${parts[0]}-${parts[1]}-${parts[2]}T00:00:00`);
                    const suffix = parts.slice(3).join(' ').replace(/\b\w/g, c => c.toUpperCase());
                    a.innerText = `${dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })} - ${suffix}`;
                } else {
                    a.innerText = folderString;
                }
                
                li.appendChild(a);
                list.appendChild(li);
            });
            sidebar.appendChild(list);
            document.body.appendChild(sidebar);

            const btn = document.createElement('button');
            btn.id = 'news-menu-btn';
            btn.innerHTML = '&#9776; Menu';
            document.body.appendChild(btn);

            const closeBtn = document.getElementById('news-close-btn');
            const toggleMenu = () => {
                if (sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('open');
                    setTimeout(() => overlay.style.display = 'none', 300);
                } else {
                    overlay.style.display = 'block';
                    setTimeout(() => { sidebar.classList.add('open'); overlay.classList.add('open'); }, 10);
                }
            };
            btn.addEventListener('click', toggleMenu);
            closeBtn.addEventListener('click', toggleMenu);
            overlay.addEventListener('click', toggleMenu);
        }
        
        if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', initSidebarMenu); } 
        else { initSidebarMenu(); }
    </script>
</body>
</html>
