        // --- ATTEMPT AUDITION HELPERS (PCB-023) ---
        function critState(value, passValue, lowerIsBetter) {
            if (value === null || value === undefined) return 'na';
            const ok = lowerIsBetter ? value <= passValue : value >= passValue;
            return ok ? 'pass' : 'fail';
        }
        function critDot(cls, label, tooltip) {
            return '<span class="crit-dot ' + cls + '" role="img" aria-label="' + label + ': ' + tooltip + '" title="' + label + ': ' + tooltip + '"></span>';
        }
        function criterionDots(a) {
            const t = critState(a.technicalSafe === true ? 1 : (a.technicalSafe === false ? 0 : null), 1, false);
            const w = critState(a.wer, 0, true);
            const p = critState(a.protectedTermFailures, 0, true);
            const v = critState(a.voiceTargetScore, 0.35, false);
            const m = critState(a.voiceMargin, 0.15, false);
            const werTxt = a.wer == null ? 'unavailable' : (Math.round(a.wer * 1000) / 10) + '% word error (pass: 0%)';
            const sdi = (a.substitutions ?? '-') + ' substituted, ' + (a.deletions ?? '-') + ' missing, ' + (a.insertions ?? '-') + ' extra';
            const ptTxt = a.protectedTermFailures == null ? 'unavailable' : a.protectedTermFailures + ' protected term(s) wrong';
            const vtTxt = a.voiceTargetScore == null ? 'unavailable' : 'voice match ' + Math.round(a.voiceTargetScore * 100) + '% (pass: 35%)';
            const vmTxt = a.voiceMargin == null ? 'unavailable' : 'voice margin ' + Math.round(a.voiceMargin * 100) + '% (pass: 15%)';
            return critDot(t, 'Technical', a.technicalSafe == null ? 'unavailable' : (a.technicalSafe ? 'healthy audio' : 'audio defects')) +
                   critDot(w, 'Transcript', werTxt + ' — ' + sdi) +
                   critDot(p, 'Protected terms', ptTxt) +
                   critDot(v, 'Voice identity', vtTxt) +
                   critDot(m, 'Voice margin', vmTxt);
        }
                function critValue(a, key) {
            if (key === 'V') return a.voiceTargetScore == null ? null : Math.round(a.voiceTargetScore * 100);
            if (key === 'T') return a.wer == null ? null : Math.round(a.wer * 100);
            if (key === 'P') return a.protectedTermFailures == null ? null : a.protectedTermFailures;
            return null;
        }
        function critFailed(a, key) {
            if (key === 'V') return !(a.voiceTargetScore != null && a.voiceTargetScore >= 0.35);
            if (key === 'T') return !(a.wer != null && a.wer === 0);
            if (key === 'P') return !(a.protectedTermFailures != null && a.protectedTermFailures === 0);
            if (key === 'A') return a.technicalSafe !== true;
            return false;
        }
        function attemptIcon(key) {
            // sounds-like, mistakes, protected terms, audio defects
            return { V: '🗣', T: '✏️', P: '🔑', A: '🔈' }[key];
        }
        function attemptTooltip(a) {
            const lines = ['Attempt ' + a.n + (a.selected ? ' — published selection' : (a.passed === false ? ' — rejected' : ''))];
            lines.push(a.voiceTargetScore == null ? 'Voice match unavailable' : 'Voice match ' + Math.round(a.voiceTargetScore * 100) + '% (margin ' + (a.voiceMargin == null ? 'n/a' : Math.round(a.voiceMargin * 100) + '%') + ')');
            if (a.wer == null) lines.push('Transcript unavailable');
            else {
                const pct = Math.round(a.wer * 100);
                lines.push('Transcript ' + (pct === 0 ? 'exact' : pct + '% word errors (' + (a.substitutions ?? 0) + ' wrong, ' + (a.deletions ?? 0) + ' missing, ' + (a.insertions ?? 0) + ' extra)'));
                if (a.asrText) lines.push('Heard: "' + a.asrText + '"');
            }
            lines.push(a.protectedTermFailures == null ? 'Protected terms unavailable' : (a.protectedTermFailures === 0 ? 'Protected terms correct' : a.protectedTermFailures + ' protected term(s) wrong'));
            lines.push(a.technicalSafe == null ? 'Technical check unavailable' : (a.technicalSafe ? 'Audio technically clean' : 'Audio defects'));
            if ((a.reasons || []).length) lines.push('Rejected for: ' + a.reasons.join(', '));
            return lines.join(String.fromCharCode(10));
        }
        function segmentFailedKeys(item) {
            const keys = ['V', 'T', 'P', 'A'];
            const failed = keys.filter(k => (item.attempts || []).some(a => critFailed(a, k)));
            // If every attempt failed something, the winner was chosen on voice — add the
            // sounds-like key so the numbers explain what decided it.
            if (failed.length && !(item.attempts || []).some(a => a.passed === true)) {
                if (failed.indexOf('V') === -1) failed.push('V');
            }
            return failed;
        }
        function attemptButton(a, segIdx, ai, failedKeys) {
            const cls = a.passed === true ? ' pass' : (a.selected || a.passed === false ? ' fail' : '');
            const stateTxt = a.selected ? 'published selection' : (a.passed === false ? 'rejected — ' + (a.reasons || []).join(', ') : 'not published');
            const nums = failedKeys.filter(k => k !== 'A').map(k => {
                const v = critValue(a, k);
                const val = v == null ? '?' : v;
                return '<span class="attempt-num ' + (critFailed(a, k) ? 'num-fail' : 'num-pass') + '">' + val + '</span>';

            return '<button type="button" class="attempt-btn' + cls + '" data-seg="' + segIdx + '" data-ai="' + ai + '" aria-pressed="' + (a.selected ? 'true' : 'false') + '" aria-label="Audition attempt ' + a.n + ', ' + stateTxt + ' for segment ' + (segIdx + 1) + '" title="' + attemptTooltip(a).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;') + '">' + nums + '</button>';

                }
                
                li.appendChild(a);
                list.appendChild(li);
            });
            sidebar.appendChild(list);
            document.body.appendChild(sidebar);

            const btn = document.createElement('button');
            btn.id = 'news-menu-btn';
            btn.innerHTML = '&#9776; Menu';
            document.body.appendChild(btn);

            const closeBtn = document.getElementById('news-close-btn');
            const toggleMenu = () => {
                if (sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('open');
                    setTimeout(() => overlay.style.display = 'none', 300);
                } else {
                    overlay.style.display = 'block';
                    setTimeout(() => { sidebar.classList.add('open'); overlay.classList.add('open'); }, 10);
                }
            };
            btn.addEventListener('click', toggleMenu);
            closeBtn.addEventListener('click', toggleMenu);
            overlay.addEventListener('click', toggleMenu);
        }
        
        if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', initSidebarMenu); } 
        else { initSidebarMenu(); }
    </script>
</body>
</html>
