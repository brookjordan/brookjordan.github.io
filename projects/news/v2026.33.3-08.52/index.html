        const playlist = [{"file":"intro.mp3","url":null,"text":"🎵 (sung) AI's hiring and heatwaves are rising / Trump's on a ruse while the borders are sizing / Bye-bye to those vape clouds.","voice":"intro","speaker":"Intro Theme","summary":"Intro"},{"file":"audio_0.mp3","url":null,"text":"Good afternoon, everyone. I'm looking at the weather and it looks like we're in for a bit of a scorcher, which is just great when you're trying to keep the kids from melting into the upholstery.","voice":4,"speaker":"Brett","summary":null},{"file":"audio_1.mp3","url":"https://www.bbc.co.uk/weather/articles/ce8ljn1ngg2o?at_medium=RSS&at_campaign=rss","text":"Oh, I saw those alerts! We've got amber heat health warnings across almost all of England starting now. It’s going to be extreme through Friday evening... and honestly, from a hardware perspective, it's fascinating how we have to manage thermal throttling in high-density compute clusters when the ambient temp hits these levels because if the cooling systems aren't perfectly calibrated for--","voice":1,"speaker":"Brook","summary":"England Heatwave Alerts"},{"file":"audio_2.mp3","url":"https://www.bbc.co.uk/weather/articles/ce8ljn1ngg2o?at_medium=RSS&at_campaign=rss","text":"--It’s a matter of infrastructure resilience, Brook. When the environment becomes hostile to basic human comfort, it exposes the fragility of our urban planning.","voice":2,"speaker":"Conrad","summary":"England Heatwave Alerts"},{"file":"audio_3.mp3","url":"https://www.bbc.co.uk/weather/articles/ce8ljn1ngg2o?at_medium=RSS&at_campaign=rss","text":"It reminds me of the 'Great Heat' descriptions in some of the more esoteric desert mysticism texts... a physical manifestation of spiritual dryness. It’s almost like the land is demanding a different kind of endurance.","voice":3,"speaker":"Antony","summary":"England Heatwave Alerts"},{"file":"audio_4.mp3","url":"https://www.bbc.co.uk/weather/articles/ce8ljn1ngg2o?at_medium=RSS&at_campaign=rss","text":"I just need to make sure the kids have enough water and that I don't have to leave them in the car for five minutes. That's my primary concern.","voice":4,"speaker":"Brett","summary":"England Heatwave Alerts"},{"file":"audio_5.mp3","url":"https://techcrunch.com/2026/08/10/openai-reportedly-completed-a-7-billion-employee-tender-offer/","text":"Speaking of infrastructure, did you see what OpenAI is doing? They reportedly completed a seven billion dollar employee tender offer... which is wild because it highlights how much the San Francisco housing market is struggling again. I was looking at some data on urban density and--","voice":1,"speaker":"Brook","summary":"OpenAI Employee Offer"},{"file":"audio_6.mp3","url":"https://techcrunch.com/2026/08/10/openai-reportedly-completed-a-7-billion-employee-tender-offer/","text":"--It's a classic economic paradox. The more valuable the human capital becomes in a specific hub, the less habitable that hub becomes for the people providing the support services.","voice":2,"speaker":"Conrad","summary":"OpenAI Employee Offer"},{"file":"audio_7.mp3","url":"https://techcrunch.com/2026/08/10/openai-reportedly-completed-a-7-billion-employee-tender-offer/","text":"It’s very reminiscent of the 'Gilded Cage' trope. The creators build a palace of intellect but find themselves priced out of the very ground they stand on. It’s almost like a modern-day monastic exile, but with higher rent.","voice":3,"speaker":"Antony","summary":"OpenAI Employee Offer"},{"file":"audio_8.mp3","url":"https://techcrunch.com/2026/08/10/openai-reportedly-completed-a-7-billion-employee-tender-offer/","text":"Seven billion dollars is a lot of money to move around. I'm just glad my kids don't have to worry about the San Francisco housing market yet; they're still in the 'messy bedroom' phase of life.","voice":4,"speaker":"Brett","summary":"OpenAI Employee Offer"},{"file":"audio_9.mp3","url":"https://www.aljazeera.com/video/newsfeed/2026/8/11/where-did-all-the-money-go-if-the-us-is-running-out-of-weapons?traffic_source=rss","text":"We should also look at the geopolitical friction. The US is reportedly running out of weapons for the war on Iran, which raises some massive questions about where all that defense spending actually went over the years.","voice":3,"speaker":"Antony","summary":"US Weapon Shortages"},{"file":"audio_10.mp3","url":"https://www.aljazeera.com/video/newsfeed/2026/8/11/where-did-all-the-money-go-if-the-us-is-running-out-of-weapons?traffic_source=rss","text":"It suggests a systemic failure in procurement or a massive miscalculation in long-term strategic stockpiling. It's a logistical nightmare on a global scale.","voice":2,"speaker":"Conrad","summary":"US Weapon Shortages"},{"file":"audio_11.mp3","url":"https://www.aljazeera.com/video/newsfeed/2026/8/11/where-did-all-the-money-go-if-the-us-is-running-out-of-weapons?traffic_source=rss","text":"From a systems engineering view, if you don't have a redundant supply chain for critical components, the whole system fails under sustained load...","voice":1,"speaker":"Brook","summary":"US Weapon Shortages"},{"file":"audio_12.mp3","url":"https://www.aljazeera.com/video/newsfeed/2026/8/11/where-did-all-the-money-go-if-the-us-is-running-out-of-weapons?traffic_source=rss","text":"--I just hope it doesn't affect the price of my groceries. That's the part that hits home.","voice":4,"speaker":"Brett","summary":"US Weapon Shortages"},{"file":"audio_13.mp3","url":"https://www.aljazeera.com/news/2026/8/11/colombias-far-right-government-recognises-israeli-claim-over-golan-heights?traffic_source=rss","text":"On a different note, Colombia’s far-right government is recognizing Israel's claim over the Golan Heights. They are only the second country to do so...","voice":1,"speaker":"Brook","summary":"Colombia Recognizes Golan"},{"file":"audio_14.mp3","url":"https://www.aljazeera.com/news/2026/8/11/colombias-far-right-government-recognises-israeli-claim-over-golan-heights?traffic_source=rss","text":"That's a significant shift in diplomatic alignment for South America.","voice":2,"speaker":"Conrad","summary":"Colombia Recognizes Golan"},{"file":"audio_15.mp3","url":"https://www.aljazeera.com/news/2026/8/11/colombias-far-right-government-recognises-israeli-claim-over-golan-heights?traffic_source=rss","text":"It feels like a realignment of old allegiances. It’s very much like the shifting borders in the late Byzantine era—sudden recognitions of territory that change the entire geopolitical map.","voice":3,"speaker":"Antony","summary":"Colombia Recognizes Golan"},{"file":"audio_16.mp3","url":"https://apnews.com/article/tate-brothers-united-kingdom-extradition-327c1a248ec7037fb6380f4c075f7e47","text":"And then there's the Tate brothers. US prosecutors want them to remain in custody while they fight extradition to the UK... it’s a mess of international legal protocols...","voice":1,"speaker":"Brook","summary":"Tate Extradition Fight"},{"file":"audio_17.mp3","url":"https://apnews.com/article/tate-brothers-united-kingdom-extradition-327c1a248ec7037fb6380f4c075f7e47","text":"I don't know who these guys are, but if they're causing enough trouble for an extradition fight, they probably aren't the most productive members of society.","voice":4,"speaker":"Brett","summary":"Tate Extradition Fight"},{"file":"audio_18.mp3","url":"https://apnews.com/article/tate-brothers-united-kingdom-extradition-327c1a248ec7037fb6380f4c075f7e47","text":"It’s a fascinating study in how public personas can create such complex legal hurdles across multiple jurisdictions.","voice":2,"speaker":"Conrad","summary":"Tate Extradition Fight"},{"file":"audio_19.mp3","url":"https://apnews.com/article/trump-air-force-one-iran-turkey-2c9400dc758641dfdcd1fd3ddd249158","text":"We also have to keep an eye on the Trump reports—apparently he used an elaborate ruse to fly out of Turkey following a summit because of an Iran threat...","voice":1,"speaker":"Brook","summary":"Trump Turkey Ruse"},{"file":"audio_20.mp3","url":"https://apnews.com/article/trump-air-force-one-iran-turkey-2c9400dc758641dfdcd1fd3ddd249158","text":"--That's a high-stakes move. It shows how much the perception of security dictates actual movement in these circles.","voice":2,"speaker":"Conrad","summary":"Trump Turkey Ruse"},{"file":"audio_21.mp3","url":"https://apnews.com/article/trump-air-force-one-iran-turkey-2c9400dc758641dfdcd1fd3ddd249158","text":"It’s the 'Secret Passage' archetype. The necessity of clandestine movement when the public eye becomes a liability.","voice":3,"speaker":"Antony","summary":"Trump Turkey Ruse"},{"file":"audio_22.mp3","url":"https://apnews.com/article/trump-air-force-one-iran-turkey-2c9400dc758641dfdcd1fd3ddd249158","text":"I just hope they have a good pilot. Flying out of a country under threat sounds like a lot of stress for anyone involved.","voice":4,"speaker":"Brett","summary":"Trump Turkey Ruse"},{"file":"audio_23.mp3","url":"https://www.bbc.co.uk/news/articles/cj6307x3wdgo?at_medium=RSS&at_campaign=rss","text":"Speaking of tech and safety, there was a Canada flight cancelled because a child refused to wear a seat belt. It sparked a huge debate over discipline on planes...","voice":1,"speaker":"Brook","summary":"Cancelled Flight Incident"},{"file":"audio_24.mp3","url":"https://www.bbc.co.uk/news/articles/cj6307x3wdgo?at_medium=RSS&at_campaign=rss","text":"I deal with this every day. Sometimes you just have to be firm. Safety isn't optional, especially when you're at thirty thousand feet.","voice":4,"speaker":"Brett","summary":"Cancelled Flight Incident"},{"file":"audio_25.mp3","url":"https://www.bbc.co.uk/news/articles/cj6307x3wdgo?at_medium=RSS&at_campaign=rss","text":"It’s a micro-conflict that highlights the tension between individual autonomy and collective safety in public spaces.","voice":2,"speaker":"Conrad","summary":"Cancelled Flight Incident"},{"file":"audio_26.mp3","url":"https://www.bbc.co.uk/news/articles/cj6307x3wdgo?at_medium=RSS&at_campaign=rss","text":"It's the classic struggle of the 'Willful Child' against the 'Order of the State.' A very old narrative found in many foundational texts regarding the domestication of the wild spirit.","voice":3,"speaker":"Antony","summary":"Cancelled Flight Incident"},{"file":"audio_27.mp3","url":"https://techcrunch.com/2026/08/10/as-ai-led-attacks-multiply-openai-launches-a-new-cyber-model/","text":"On the tech side, OpenAI is launching a new cyber model to fight AI-led attacks. They're expanding their Daybreak program...","voice":1,"speaker":"Brook","summary":"OpenAI Cyber Model"},{"file":"audio_28.mp3","url":"https://techcrunch.com/2026/08/10/as-ai-led-attacks-multiply-openai-launches-a-new-cyber-model/","text":"It’s an arms race. As the tools for attack become more sophisticated, the defensive models have to evolve at a similar velocity.","voice":2,"speaker":"Conrad","summary":"OpenAI Cyber Model"},{"file":"audio_29.mp3","url":"https://techcrunch.com/2026/08/10/as-ai-led-attacks-multiply-openai-launches-a-new-cyber-model/","text":"The 'Shield of the Watchman.' It's the eternal cycle of creating a tool and then immediately having to build a wall against its own potential for destruction.","voice":3,"speaker":"Antony","summary":"OpenAI Cyber Model"},{"file":"audio_30.mp3","url":"https://techcrunch.com/2026/08/10/as-ai-led-attacks-multiply-openai-launches-a-new-cyber-model/","text":"As long as it keeps people's data safe, I'm all for it. We have enough problems without cyber-attacks.","voice":4,"speaker":"Brett","summary":"OpenAI Cyber Model"},{"file":"audio_31.mp3","url":"https://www.bbc.co.uk/news/articles/cvg90el9236o?at_medium=RSS&at_campaign=rss","text":"And we can't forget the local news—councils are getting more powers to stop vape and betting shops because town centres have been 'hollowed out.' PM Andy Burnham is pushing this...","voice":1,"speaker":"Brook","summary":"Vape Shop Crackdown"},{"file":"audio_32.mp3","url":"https://www.bbc.co.uk/news/articles/cvg90el9236o? having to deal with an app notification popping up every two seconds.","voice":4,"speaker":"Brett","summary":"Avoiding Workplace AI"},{"file":"audio_39.mp3","url":"https://9to5mac.com/2026/08/10/heres-whats-new-with-ios-27-beta-5/","text":"Speaking of apps, iOS 27 Beta 5 is out. They've tweaked some icons, and the Siri app looks much cooler now...","voice":1,"speaker":"Brook","summary":"iOS 27 Beta"},{"file":"audio_40.mp3","url":"https://9to5mac.com/2026/08/10/heres-whats-new-with-ios-27-beta-5/","text":"Cooler? I just want it to work without crashing when I try to set a timer for my kids' dinner.","voice":4,"speaker":"Brett","summary":"iOS 27 Beta"},{"file":"audio_41.mp3","url":"https://9to5mac.com/2026/08/10/heres-whats-new-with-ios-27-beta-5/","text":"The aesthetic evolution of our primary interfaces is often more significant than the underlying code changes in terms of user adoption.","voice":2,"speaker":"Conrad","summary":"iOS 27 Beta"},{"file":"audio_42.mp3","url":"https://www.bbc.co.uk/news/articles/c20e360lx0vo?at_medium=RSS&at_campaign=rss","text":"And we have some heavy news from Colombia—at least 132 killed and over 480 injured in their largest earthquake in years...","voice":1,"speaker":"Brook","summary":"Colombia Earthquake Toll"},{"file":"audio_43.mp3","url":"https://www.bbc.co.uk/news/articles/c20e360lx0vo?at_medium=RSS&at_campaign=rss","text":"That's devastating. I hope the rescue efforts are getting enough resources to reach everyone trapped.","voice":4,"speaker":"Brett","summary":"Colombia Earthquake Toll"},{"file":"audio_44.mp3","url":"https://www.bbc.co.uk/news/articles/c20e360lx0vo?at_medium=RSS&at_campaign=rss","text":"It’s a stark reminder of our vulnerability to the natural world, regardless of how much technology we build.","voice":2,"speaker":"Conrad","summary":"Colombia Earthquake Toll"},{"file":"audio_45.mp3","url":"https://www.bbc.co.uk/news/articles/c20e360lx0vo?at_medium=RSS&at_campaign=rss","text":"The 'Trembling of the Earth.' It's a recurring motif in literature where the very foundation of human civilization is shown to be temporary and subject to the whims of the deep.","voice":3,"speaker":"Antony","summary":"Colombia Earthquake Toll"},{"file":"audio_46.mp3","url":"https://www.theguardian.com/world/2026/aug/07/spain-to-introduce-temporary-border-checks-on-visitors-from-italy","text":"On the international front, Spain is introducing temporary border checks on visitors from Italy due to mass migration issues...","voice":1,"speaker":"Brook","summary":"Spain Border Checks"},{"file":"audio_47.mp3","url":"https://www.theguardian.com/world/2026/aug/07/spain-to-introduce-temporary-border-checks-on-visitors-from-italy","text":"It's a reactive policy. One country's move forcing another to tighten its own borders.","voice":2,"speaker":"Conrad","summary":"Spain Border Checks"},{"file":"audio_48.mp3","url":"https://www.theguardian.com/world/2026/aug/07/spain-to-introduce-temporary-border-checks-on-visitors-from-italy","text":"The 'Closing of the Gates.' It’s a classic geopolitical response to perceived instability in neighboring territories.","voice":3,"speaker":"Antony","summary":"Spain Border Checks"},{"file":"audio_49.mp3","url":"https://www.theguardian.com/world/2026/aug/07/spain-to-introduce-temporary-border-checks-on-visitors-from-italy","text":"It's just complicated logistics. When one thing moves, everything else has to adjust.","voice":4,"speaker":"Brett","summary":"Spain Border Checks"},{"file":"audio_50.mp3","url":"https://www.theguardian.com/us-news/2026/aug/07/judge-trump-south-sudan-tps","text":"Lastly, we have the news on US prosecutors wanting to end South Sudan TPS protections... it follows a Supreme Court ruling that allowed stripping protections for Haitians and Syrians...","voice":1,"speaker":"Brook","summary":"Trump TPS Ruling"},{"file":"audio_51.mp3","url":"https://www.theguardian.com/us-news/2026/aug/07/judge-trump-south-sudan-tps","text":"It shows a significant shift in how temporary protected status is being handled at the federal level.","voice":2,"speaker":"Conrad","summary":"Trump TPS Ruling"},{"file":"audio_52.mp3","url":"https://www.theguardian.com/us-news/2026/aug/07/judge-trump-south-sudan-tps","text":"The 'Withdrawal of Sanctuary.' It’s a recurring theme where the protections offered to the displaced are subject to the shifting winds of political will.","voice":3,"speaker":"Antony","summary":"Trump TPS Ruling"},{"file":"audio_53.mp3","url":null,"text":"It's a lot of heavy stuff today. I think I need to go check on my kids and maybe have a quiet cup of tea.","voice":4,"speaker":"Brett","summary":null},{"file":"audio_54.mp3","url":null,"text":"Yeah, we're done for now. Catch you all tomorrow!","voice":1,"speaker":"Brook","summary":null}];

            mediaStage.classList.add('show-final');

        // --- BACKGROUND PRELOADER (+/- 2 Tracks) ---
        const preloadBuffer = {};
        
        function updatePreloadBuffer(index) {
            // Define the exact target window: 2 behind, 2 ahead
            const targets = [index - 2, index - 1, index + 1, index + 2]
                .filter(i => i >= 0 && i < playlist.length);
                
            // 1. Fetch new tracks into the invisible background buffer
            targets.forEach(i => {
                if (!preloadBuffer[i]) {
                    const bgAudio = new Audio();
                    bgAudio.src = playlist[i].file;
                    bgAudio.preload = 'auto'; // Forces browser to download/cache
                    preloadBuffer[i] = bgAudio;
                }
            });
            
            // 2. Clean up old tracks outside the +/- 2 window to save RAM
            Object.keys(preloadBuffer).forEach(key => {
                if (!targets.includes(parseInt(key))) {
                    preloadBuffer[key].src = ''; // Instantly kills the network request
                    delete preloadBuffer[key];

            `;
            document.head.appendChild(style);

            const overlay = document.createElement('div');
            overlay.id = 'sidebar-overlay';
            document.body.appendChild(overlay);

            const sidebar = document.createElement('div');
            sidebar.id = 'news-sidebar';
            sidebar.innerHTML = '<div class="sidebar-header"><h2>Archives</h2><button class="sidebar-close" id="news-close-btn">&times;</button></div>';
            
            const list = document.createElement('ul');
            list.className = 'sidebar-list';
            
            foldersArray.forEach(folderString => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `/projects/news/${folderString}/`;
                
                const parts = folderString.split('-');
                if (parts.length >= 4) {
                    const dateObj = new Date(`${parts[0]}-${parts[1]}-${parts[2]}T00:00:00`);
                    const suffix = parts.slice(3).join(' ').replace(/\b\w/g, c => c.toUpperCase());
                    a.innerText = `${dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })} - ${suffix}`;
                } else {
                    a.innerText = folderString;
                }
                
                li.appendChild(a);
                list.appendChild(li);
            });
            sidebar.appendChild(list);
            document.body.appendChild(sidebar);

            const btn = document.createElement('button');
            btn.id = 'news-menu-btn';
            btn.innerHTML = '&#9776; Menu';
            document.body.appendChild(btn);

            const closeBtn = document.getElementById('news-close-btn');
            const toggleMenu = () => {
                if (sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('open');
                    setTimeout(() => overlay.style.display = 'none', 300);
                } else {
                    overlay.style.display = 'block';
                    setTimeout(() => { sidebar.classList.add('open'); overlay.classList.add('open'); }, 10);
                }
            };
            btn.addEventListener('click', toggleMenu);
            closeBtn.addEventListener('click', toggleMenu);
            overlay.addEventListener('click', toggleMenu);
        }
        
        if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', initSidebarMenu); } 
        else { initSidebarMenu(); }
    </script>
</body>
</html>
