    <script>
        const OVERLAP_SECONDS = 2;
        const playlist = [{"file":"intro.mp3","url":null,"text":"🎵 (sung) From AI agents to the desert heat / Global drama on every single street / And drones are delivering your lunch.","voice":"intro","speaker":"Intro Theme","summary":"Intro"},{"file":"audio_0.mp3","url":null,"text":"Good evening everyone. I'm looking at the news and honestly, some of this just feels like a lot of noise for a Tuesday.","voice":4,"speaker":"Brett","summary":null},{"file":"audio_1.mp3","url":"https://www.theverge.com/tech/972209/ebay-cyberstalking-harassment-settlement","text":"It is definitely a lot, Brett! But look at this eBay situation... they're settling for fifty-six million dollars over a cyberstalking campaign. I was looking into the backend of how these types of automated harassment bots actually scale, and it's fascinating because you can essentially script a persistent presence that targets specific metadata tags, which is why the legal fallout is so massive now that we have better tracing... --","voice":1,"speaker":"Brook","summary":"eBay Cyberstalking Settlement"},{"file":"audio_2.mp3","url":"https://www.theverge.com/tech/972209/ebay-cyberstalking-harassment-settlement","text":"It's a classic case of technology outstripping our social contract. We built these platforms for commerce and ended up providing the infrastructure for high-tech harassment.","voice":2,"speaker":"Conrad","summary":"eBay Cyberstalking Settlement"},{"file":"audio_3.mp3","url":"https://www.theverge.com/tech/972209/ebay-cyberstalking-harassment-settlement","text":"It reminds me of the 'Panopticon' concepts in early surveillance theory, but inverted. Instead of a central authority watching everyone, it's individuals using the tools of the state to haunt one another in a digital wilderness.","voice":3,"speaker":"Antony","summary":"eBay Cyberstalking Settlement"},{"file":"audio_4.mp3","url":"https://kottke.org/26/07/onlymarms-funding-science-research-on-onlyfans","text":"I just think it's a mess. If you can't keep your kids off certain sites, you're asking for trouble. Speaking of weird internet stuff, did you see this marmot research being funded on OnlyFans?","voice":4,"speaker":"Brett","summary":"OnlyFans Science Funding"},{"file":"audio_5.mp3","url":"https://kottke.org/26/07/onlymarms-funding-science-research-on-onlyfans","text":"That is wild! I mean, the scientists have been studying these Colorado marmots since 1962, and now they're pivoting to... well, that platform because of the cuts in scientific funding. It's a bizarre monetization of biology.","voice":1,"speaker":"Brook","summary":"OnlyFans Science Funding"},{"file":"audio_6.mp3","url":"https://kottke.org/26/07/onlymarms-funding-science-research-on-onlyfans","text":"It’s a strange sort of modern alchemy. Turning the 'profane' into a means to preserve the 'sacred' knowledge of our natural world.","voice":3,"speaker":"Antony","summary":"OnlyFans Science Funding"},{"file":"audio_7.mp3","url":"https://kottke.org/26/07/onlymarms-funding-science-research-on-onlyfans","text":"It highlights a desperate reality: when traditional institutions fail to provide resources, people will turn to any available marketplace, no matter how unconventional.","voice":2,"speaker":"Conrad","summary":"OnlyFans Science Funding"},{"file":"audio_8.mp3","url":"https://kottke.org/26/07/0049404-study-dinosaurs-were-char","text":"And while we're talking about extinction and survival, this new study says dinosaurs were actually charbroiled by the Chicxulub impact. It wasn't just a dust cloud; it superheated the atmosphere so much that living organisms couldn't take the heat...","voice":1,"speaker":"Brook","summary":"Dinosaur Impact Study"},{"file":"audio_9.mp3","url":"https://kottke.org/26/07/0049404-study-dinosaurs-were-char","text":"So they weren't just crushed by rocks; they were essentially cooked in their own environment. A literal atmospheric oven.","voice":2,"speaker":"Conrad","summary":"Dinosaur Impact Study"},{"file":"audio_10.mp3","url":"https://kottke.org/26/07/0049404-study-dinosaurs-were-char","text":"Sounds like a bad day at the park. I'd rather deal with my kids' tantrums than being charbroiled by a meteor.","voice":4,"speaker":"Brett","summary":"Dinosaur Impact Study"},{"file":"audio_11.mp3","url":"https://www.wired.com/story/x-says-australias-under-16s-social-media-bans-risk-interfering-with-foreign-law/","text":"Speaking of things getting heated, X is pushing back against Australia’s under-16 social media ban. They're calling the government's information-gathering powers 'invasive'. It's a huge clash over data privacy and parental rights.","voice":1,"speaker":"Brook","summary":"X vs Australia Ban"},{"file":"audio_12.mp3","url":"https://www.wired.com/story/x-says-australias-under-16s-social-media-bans-risk-interfering-with-foreign-law/","text":"It echoes the tensions in the *Chronicles of Narnia* regarding the boundaries between the seen world and the hidden one—here, it's the boundary between a child's private digital life and the state's reach.","voice":3,"speaker":"Antony","summary":"X vs Australia Ban"},{"file":"audio_13.mp3","url":"https://www.wired.com/story/x-says-australias-under-16s-social-media-bans-risk-interfering-with-foreign-law/","text":"It’s the fundamental tension of the modern age: how much liberty are we willing to trade for perceived safety?","voice":2,"speaker":"Conrad","summary":"X vs Australia Ban"},{"file":"audio_14.mp3","url":"https://www.wired.com/story/x-says-australias-under-16s-social-media-bans-risk-interfering-with-foreign-law/","text":"I don't care what X says. If it keeps them off their phones and away from strangers, I'm all for it.","voice":4,"speaker":"Brett","summary":"X vs Australia Ban"},{"file":"audio_15.mp3","url":"https://www.wired.com/story/best-festival-gear/","text":"If you want to get away from the screens entirely, there's a list of festival must-haves out—power banks, electrolytes, and earplugs. They're testing these at places like Lost Lands.","voice":1,"speaker":"Brook","summary":"Festival Gear Guide"},{"file":"audio_16.mp3","url":"https://www.wired.com/story/best-festival-gear/","text":"Earplugs are the most important thing on that list. You don't want to be the dad who complains about the noise at a festival.","voice":4,"speaker":"Brett","summary":"Festival Gear Guide"},{"file":"audio_17.mp3","url":"https://firstthings.com/to-live-fittingly/","text":"Moving into some heavier stuff, there's an essay arguing why the humanities are facing such a hostile climate. It suggests academics have excluded ordinary readers from their work and made it too gatekept for anyone who isn't a professor.","voice":1,"speaker":"Brook","summary":"Humanities Climate Analysis"},{"file":"audio_18.mp3","url":"https://firstthings.com/to-live-fittingly/","text":"It’s the 'High Priest' syndrome. When knowledge becomes so esoteric that only those with the secret keys can enter the temple, it ceases to be a public good and becomes a private fortress.","voice":3,"speaker":"Antony","summary":"Humanities Climate Analysis"},{"file":"audio_19.mp3","url":"https://firstthings.com/to-live-fittingly/","text":"Exactly. It creates a barrier of entry that alienates the very people who should be engaging with these ideas most deeply.","voice":2,"speaker":"Conrad","summary":"Humanities Climate Analysis"},{"file":"audio_20.mp3","url":"https://firstthings.com/the-summer-reading-list-2026/","text":"That ties into the new summer reading list for 2026. A YouGov poll showed forty percent of Americans didn't read a single book last year. It seems like we're losing the habit of deep focus.","voice":1,"speaker":"Brook","summary":"2026 Summer Reading"},{"file":"audio_21.mp3","url":"https://firstthings.com/the-summer-reading-list-2026/","text":"It’s a retreat into the immediate. We are trading the long arc of literature for the short burst of the scroll.","voice":3,"speaker":"Antony","summary":"2026 Summer Reading"},{"file":"audio_22.mp3","url":"https://firstthings.com/the-summer-reading-list-2026/","text":"I'm just trying to get my kids to read anything at all. If they're reading a graphic novel, I count that as a win.","voice":4,"speaker":"Brett","summary":"2026 Summer Reading"},{"file":"audio_23.mp3","url":"https://techcrunch.com/2026/07/29/encore-ai-raises-30m-to-build-ai-agents-that-learn-from-customer-calls/","text":"On the tech side of things, Encore AI is raising thirty million dollars to build agents that learn from customer calls to create sales playbooks. It's basically using human interaction data to train automated behavior...","voice":1,"speaker":"Brook","summary":"Encore AI Funding"},{"file":"audio_24.mp3","url":"https://techcrunch.com/2026/07/29/encore-ai-raises-30m-to-build-ai-agents-that-learn-from-customer-calls/","text":"It’s the industrialization of empathy—taking a human conversation and distilling it into a repeatable script for a machine.","voice":2,"speaker":"Conrad","summary":"Encore AI Funding"},{"file":"audio_25.mp3","url":"https://techcrunch.com/2026/07/29/doordash-is-building-its-own-drone-delivery-business/","text":"And DoorDash is taking that automation further by getting FAA approval for their own commercial drone delivery service in the US. They're moving from ground to air.","voice":1,"speaker":"Brook","summary":"DoorDash Drone Delivery"},{"file":"audio_26.mp3","url":"https://techcrunch.com/2026/07/29/doordash-is-building-its-own-drone-delivery-business/","text":"Drones over my house? I don't know if I want my groceries flying past my bedroom window.","voice":4,"speaker":"Brett","summary":"DoorDash Drone Delivery"},{"file":"audio_27.mp3","url":"https://www.bbc.co.uk/news/articles/ckg35n7yny3o?at_medium=RSS&at_campaign=rss","text":"The environment is also changing. More than half of England is officially in drought right now. The Environment Agency says it’s hit rivers and crops hard because of the heat.","voice":1,"speaker":"Brook","summary":"England Drought Crisis"},{"file":"audio_28.mp3","url":"https://www.bbc.co.uk/news/articles/ckg35n7yny3o?at_medium=RSS&at_campaign=rss","text":"That's a disaster for farmers. I don't know how they're supposed to keep things running with no water.","voice":4,"speaker":"Brett","summary":"England Drought Crisis"},{"file":"audio_29.mp3","url":"https://www.bbc.co.uk/news/articles/ckg35n7yny3o?at_medium=RSS&at_campaign=rss","text":"It’s a stark reminder of our vulnerability to the basic elements. We think we've mastered nature, but one dry spell shows how fragile our systems are.","voice":2,"speaker":"Conrad","summary":"England Drought Crisis"},{"file":"audio_30.mp3","url":"https://www.bbc.co.uk/news/articles/ckg6d21zdyro?at_medium=RSS&at_campaign=rss","text":"While England deals with water, Burnham is looking at tax rises specifically to fix social care in the UK. It’s a cross-party talk to see how they can fund it.","voice":1,"speaker":"Brook","summary":"UK Social Care Tax"},{"file":"audio_31.mp3","url":"https://www.bbc.co.uk/news/articles/ckg6d21zdyro?at_medium=RSS&at_campaign=rss","text":"Tax rises are never popular, but if it fixes the care for our elderly parents, people might just have to swallow it.","voice":4,"speaker":"Brett","summary":"UK Social Care Tax"},{"file":"audio_32.mp3","url":"https://www.bbc.co.uk/news/articles/ckg6d21zdyro?at_medium=RSS&at_campaign=rss","text":"It’s the classic dilemma of the 'Common Good' versus individual sacrifice. A recurring theme in every theological debate about the duties of a society to its most vulnerable members.","voice":3,"speaker":"Antony","summary":"UK Social Care Tax"},{"file":"audio_33.mp3","url":"https://www.aljazeera.com/opinions/2026/7/29/why-saudi-arabia-holds-the-key-to-palestinian-statehood?traffic_source=rss","text":"On the international stage, Saudi Arabia is being seen as a key player for Palestinian statehood because of their weight in the Arab and Islamic worlds regarding normalization with Israel.","voice":1,"speaker":"Brook","summary"         // --- PRIMARY IMAGE → VIDEO → HIGH-QUALITY COMPANION IMAGE ---
        let videoReady = podcastVideo.readyState >= HTMLMediaElement.HAVE_ENOUGH_DATA;

        function maybeStartVideo() {
            if (videoStarted || videoUnavailable || !videoReady || !finalImageReady) return;
            videoStarted = true;
            mediaStage.classList.remove('show-final');
            mediaStage.classList.add('video-playing');
            mediaHint.textContent = 'Playing motion';

                videoStarted = false;
                mediaHint.textContent = 'Tap to play motion';
            });
        }

        podcastVideo.addEventListener('canplaythrough', () => {
            videoReady = true;
            maybeStartVideo();
        }, { once: true });

        finalCover.addEventListener('load', () => {
            finalImageReady = true;
            maybeStartVideo();
        }, { once: true });

        podcastVideo.addEventListener('ended', () => {
            mediaStage.classList.add('show-final');
            mediaHint.textContent = 'Tap to replay';
        });

        podcastVideo.addEventListener('error', () => {
            videoUnavailable = true;
            mediaHint.textContent = 'Motion unavailable · tap for frame 2';

        // --- BACKGROUND PRELOADER (+/- 2 Tracks) ---
        const preloadBuffer = {};
        
        function updatePreloadBuffer(index) {
            // Define the exact target window: 2 behind, 2 ahead
            const targets = [index - 2, index - 1, index + 1, index + 2]
                .filter(i => i >= 0 && i < playlist.length);
                
            // 1. Fetch new tracks into the invisible background buffer
            targets.forEach(i => {
                if (!preloadBuffer[i]) {
                    const bgAudio = new Audio();
                    bgAudio.src = playlist[i].file;
                    bgAudio.preload = 'auto'; // Forces browser to download/cache
                    preloadBuffer[i] = bgAudio;
                }
            });
            
            // 2. Clean up old tracks outside the +/- 2 window to save RAM
            Object.keys(preloadBuffer).forEach(key => {
                if (!targets.includes(parseInt(key))) {
                    preloadBuffer[key].src = ''; // Instantly kills the network request
                    delete preloadBuffer[key];
                }
            });
        }

        document.addEventListener('keydown', (e) => {
            // Ignore keystrokes if the user holds Ctrl, Alt, or Cmd (e.g. Cmd+R to refresh)
            if (e.metaKey || e.ctrlKey || e.altKey) return;
            
            switch(e.key.toLowerCase()) {
                case 'j': // Previous
                    if (!btnPrev.disabled) btnPrev.click();
                    break;
                case 'l': // Next

                lnkWrap.classList.remove('visible');
                btnNext.disabled = true;

            btnPrev.disabled = (i === 0);

                    b.classList.add('active');

                    b.classList.remove('active');

        function attachPlayerLogic(playerIndex) {
            isOverlapping = false;

            plActive.ontimeupdate = () => {
                if (!isOverlapping && playerIndex < playlist.length - 1) {
                    const nextText = playlist[playerIndex + 1].text.trim();
                    if (nextText.startsWith('--')) {
                        if (plActive.duration && (plActive.duration - plActive.currentTime) <= OVERLAP_SECONDS) {
                            isOverlapping = true;
                            cur++;

                            plStandby.play().catch(e => {});
                        }
                    }
                }
            };

            plActive.onended = () => {
                if (isOverlapping) {
                    const temp = plActive;
                    plActive = plStandby;
                    plStandby = temp;

                    plActive.style.display = 'block';
                    plStandby.style.display = 'none';
                    attachPlayerLogic(cur);
                } else {
                    if (cur < playlist.length - 1) {
                        cur++;
                        updateUI(cur);
                        playNewTrack(cur);
                    }
                }
            };
        }

        function playNewTrack(i) {

            // Trigger our background cache manager!

            // Check if the file is already cached in our buffer

            }
            
            plActive.style.display = 'block';
            plStandby.style.display = 'none';
            plActive.play().catch(e => {});

                }
            };
            btn.addEventListener('click', toggleMenu);
            closeBtn.addEventListener('click', toggleMenu);
            overlay.addEventListener('click', toggleMenu);
        }
        
        if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', initSidebarMenu); } 
        else { initSidebarMenu(); }
    </script>
</body>
</html>
