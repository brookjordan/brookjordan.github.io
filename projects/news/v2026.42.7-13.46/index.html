lleges-2026-10-14/","text":"It’s the ultimate test of internal trust, isn't it? You build these massive systems like ChatGPT, but the human element—the person with the keys to the kingdom—is always the most unpredictable variable.","voice":2,"speaker":"Conrad","summary":"OpenAI Employee Moves"},{"file":"https://assets.brook.dev/podcasts/v2026.42.7-13.46/audio_2.mp3","url":"https://www.reuters.com/business/retail-consumer/openai-employee-who-left-apple-took-files-about-unreleased-device-openai-alleges-2026-10-14/","text":"Exactly. It makes you wonder how many other 'leaks' are just people taking their work with them because they don't feel like the company owns their brain.","voice":1,"speaker":"Brook","summary":"OpenAI Employee Moves"},{"file":"https://assets.brook.dev/podcasts/v2026.42.7-13.46/audio_3.mp3","url":"https://www.reuters.com/business/retail-consumer/openai-employee-who-left-apple-took-files-about-unreleased-device-openai-alleges-2026-10-14/","text":"Or maybe they just want to see what happens when the lid comes off. It’s a fascinating, if messy, look at the friction between individual agency and corporate security.","voice":2,"speaker":"Conrad","summary":"OpenAI Employee Moves"},{"file":"https://assets.brook.dev/podcasts/v2026.42.7-13.46/audio_4.mp3","url":null,"text":"I'm Brook.","voice":1,"speaker":"Brook","summary":null},{"file":"https://assets.brook.dev/podcasts/v2026.42.7-13.46/audio_5.mp3","url":null,"text":"And I'm Conrad. On today's episode of Patch Notes, we're looking at the cracks in corporate security, some heavy-hitting protests in France, and a bit of a digital rights squeeze.","voice":2,"speaker":"Conrad","summary":null},{"file":"https://assets.brook.dev/podcasts/v2026.42.7-13.46/audio_6.mp3","url":"https://www.bbc.co.uk/news/videos/c6e3xjw37wn7o?at_medium=RSS&at_campaign=rss","text":"We have to talk about that situation in Limoges. A historic town hall spire literally collapsing in flames during the protests... that's some intense imagery.","voice":1,"speaker":"Brook","summary":"French Town Hall Fire"},{"file":"https://assets.brook.dev/podcasts/v2026.42.7-13.46/audio_7.mp3","url":"https://www.bbc.co.uk/news/videos/c6e3xjw37wn7o?at_medium=RSS&at_campaign=rss","text":"It’s a visceral symbol of how quickly things can escalate. When you see a piece of history like that go up in smoke, it moves past 'protest' and into something much more destructive.","voice":2,"speaker":"Conrad","summary":"French Town Hall Fire"},{"file":"https://assets.brook.dev/podcasts/v2026.42.7-13.46/audio_8.mp3","url":"https://www.bbc.co.uk/news/articles/c6d937wedj7jo?at_medium=RSS&at_campaign=rss","text":"And with over a thousand people arrested across France for the same thing... it shows just how deep the cost-of-living anger is running right now.","voice":1,"speaker":"Brook","summary":"French Protest Unrest"},{"file":"https://assets.brook.dev/podcasts/v2026.42.7-13.46/audio_9.mp3","url":"https://www.bbc.co.uk/news/articles/c6d937wedj7jo?at_medium=RSS&at_campaign=rss","text":"It's a massive scale of disorder. It’s not just a few people shouting; it’s systemic frustration boiling over into actual looting and fire.","voice":2,"speaker":"Conrad","summary":"French Protest Unrest"},{"file":"https://assets.brook.dev/podcasts/v2026.42.7-13.46/audio_10.mp3","url":"https://techcrunch.com/2026/10/17/meta-removes-language-that-raised-scraping-and-ai-training-concerns/","text":"On the tech side, we're seeing some interesting moves with Meta removing language that raised concerns about web scraping for AI training. They're trying to smooth out the edges of how they gather data.","voice":1,"speaker":"Brook","summary":"Meta AI Terms"},{"file":"https://assets.brook.dev/podcasts/v2026.42.7-13.46/audio_11.mp3","url":"https://techcrunch.com/2026/10/17/meta-removes-language-that-raised-scraping-and-ai-training-concerns/","text":"They say it doesn't change how they crawl the web, but in this climate, every word in those terms of service feels like a high-stakes negotiation between tech giants and the rest of the internet.","voice":2,"speaker":"Conrad","summary":"Meta AI Terms"},{"file":"https://assets.brook.dev/podcasts/v2026.42.7-13.46/audio_12.mp3","url":"https://www.wired.com/story/kernel-panic-encryption-is-getting-squeezed-from-all-sides/","text":"It’s all part of that bigger squeeze on encryption too. Canada's new surveillance law is another step in that global trend where privacy starts feeling like a shrinking territory.","voice":1,"speaker":"Brook","summary":"Encryption Under Threat"},{"file":"https://assets.brook.dev/podcasts/v2026.42.7-13.46/audio_13.mp3","url":"https://www.wired.com/story/kernel-panic-encryption-is-getting-squeezed-from-all-sides/","text":"It really is getting squeezed from all sides. It’s the classic tension between state security and individual anonymity, and right now, the state seems to be winning the argument.","voice":2,"speaker":"Conrad","summary":"Encryption Under Threat"},{"file":"https://assets.brook.dev/podcasts/v2026.42.7-13.46/audio_14.mp3","url":"https://www.theguardian.com/technology/2026/oct/14/zimbabwean-author-simbarashe-kundizeza-denies-ai-story","text":"We also saw a bit of a drama in the literary world—a Zimbabwean author is denying they used AI to write a prize-winning story. It’s that 'did a human actually do this?' question again.","voice":1,"speaker":"Brook","summary":"Author Denies AI"},{"file":"https://assets.brook.dev/podcasts/v2026.42.7-13.46/audio_15.mp3","url":"https://www.theguardian.com/technology/2026/oct/14/zimbabwean-author-simbarashe-kundizeza-denies-ai-story","text":"The Atlantic claimed it was artificial, but the author says otherwise. It's a perfect example of how hard it's becoming to verify 'human' creativity in the age of generative tools.","voice":2,"speaker":"Conrad","summary":"Author Denies AI"},{"file":"https://assets.brook.dev/podcasts/v2026.42.7-13.46/audio_16.mp3","url":"https://thebristolcable.org/2026/10/how-generation-soil-is-transforming-bristols-food-waste/","text":"And finally, just a quick one on the local level—Bristol’s 'Generation Soil' project is trying to build a circular food system from waste. It’s a nice bit of practical eco-engineering.","voice":1,"speaker":"Brook","summary":"Bristol Food Waste"},{"file":"https://assets.brook.dev/podcasts/v2026.42.7-13.46/audio_17.mp3","url":"https://thebristolcable.org/2026/10/how-generation-soil-is-transforming-bristols-food-waste/","text":"It’s about giving people a say in the food system again, which feels like a necessary antidote to all that industrial scale we've been discussing.","voice":2,"speaker":"Conrad","summary":"Bristol Food Waste"}]};
const playlist = EP.playlist;
const FOLDER = EP.folder;
const COLOURS = ['#bb86fc', '#00d2ff', '#ffb74d', '#81c784', '#f06292', '#90a4ae'];

const mv = document.getElementById('mv');
const lyricsTrack = mv.textTracks[0];
const mvSound = document.getElementById('mv-sound');
const mvNote = document.getElementById('mv-note');
const st = document.getElementById('st');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const lnkWrap = document.getElementById('lnk-wrap');
const lnk = document.getElementById('lnk');
const summ = document.getElementById('summ');
const tsText = document.getElementById('ts-text');
const tsVoice = document.getElementById('ts-voice');
const tsBox = document.getElementById('ts-box');
const chatContainer = document.getElementById('full-chat');
const toggleBtn = document.getElementById('toggle-chat');
let plActive = document.getElementById('pl1');
let plStandby = document.getElementById('pl2');

document.getElementById('song-title').textContent = EP.songTitle;
document.getElementById('credits').textContent = EP.credits;
if (EP.hasLegacy) document.getElementById('version-switch').hidden = false;
if (playlist.length < 2) document.getElementById('news-player').hidden = true;
if (EP.sources.length) {
  const list = document.getElementById('sources-list');
  EP.sources.forEach((s) => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = s.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = s.title;

}

// Lyrics show on the video only while the music video is the current segment.
function setLyrics(on) { if (lyricsTrack) lyricsTrack.mode = on ? 'showing' : 'hidden'; }

let cur = 0;
let isOverlapping = false;

function colourFor(item) {
  if (item.kind === 'video') return COLOURS[0];
  const v = typeof item.voice === 'number' ? item.voice : String(item.voice).length;
  return COLOURS[(v % (COLOURS.length - 1)) + 1];
}

function refreshSoundButton() {
  mvSound.textContent = mv.muted ? 'Sound: off' : 'Sound: on';
  mvSound.setAttribute('aria-pressed', String(!mv.muted));
}

function refreshNote() {
  if (cur === 0) {
    mvNote.textContent = playlist.length > 1 ? 'The music video opens the episode; the news follows when it ends.' : '';
  } else {
    mvNote.textContent = mv.paused ? 'The news is playing. You can play the video alongside it, with or without its sound.' : (mv.muted ? 'Video playing without sound.' : 'Video playing with its sound.');
  }
}

function currentLyric() {
  if (!lyricsTrack || !lyricsTrack.activeCues || !lyricsTrack.activeCues.length) return '';
  return Array.from(lyricsTrack.activeCues).map((c) => c.text).join('\n');
}

function updateUI(i) {
  btnPrev.disabled = i === 0;
  btnNext.disabled = i >= playlist.length - 1;
  const t = playlist[i];
  st.textContent = 'Segment ' + (i + 1) + ' of ' + playlist.length + (i === 0 ? ' · music video' : '');
  try { history.replaceState(null, '', '#section=' + (i + 1)); } catch (e) {}
  tsVoice.textContent = t.speaker;
  tsText.textContent = i === 0 ? (currentLyric() || '♪ ' + EP.songTitle) : t.text;
  tsBox.style.borderLeftColor = colourFor(t);
  document.querySelectorAll('.chat-bubble').forEach((b, idx) => {
    b.classList.toggle('active', idx === i);
    if (idx === i && chatContainer.classList.contains('visible')) b.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  if (t.url) {
    lnk.href = t.url;
    summ.textContent = t.summary || '';
    lnkWrap.classList.add('visible');
  } else {
    lnkWrap.classList.remove('visible');
  }
  refreshNote();
}

const preload = {};
function preloadAround(i) {
  const targets = [i + 1, i + 2].filter((n) => n > 0 && n < playlist.length);
  targets.forEach((n) => { if (!preload[n]) { const a = new Audio(); a.preload = 'auto'; a.src = playlist[n].file; preload[n] = a; } });
  Object.keys(preload).forEach((k) => { if (!targets.includes(+k)) { preload[k].src = ''; delete preload[k]; } });
}

function stopAudio() { plActive.pause(); plStandby.pause(); }

function attachPlayerLogic(idx) {
  isOverlapping = false;
  plActive.ontimeupdate = () => {
    if (isOverlapping || idx >= playlist.length - 1) return;
    if (playlist[idx + 1].text.trim().startsWith('--') && plActive.duration && plActive.duration - plActive.currentTime <= 2) {
      isOverlapping = true;
      cur++;
      updateUI(cur);
      plStandby.src = playlist[cur].file;
      plStandby.play().catch(() => {});
    }
  };
  plActive.onended = () => {
    if (isOverlapping) {
      const tmp = plActive; plActive = plStandby; plStandby = tmp;
      plActive.style.display = 'block'; plStandby.style.display = 'none';
      attachPlayerLogic(cur);
    } else if (cur < playlist.length - 1) {
      go(cur + 1);
    } else {
      st.textContent = 'Broadcast ended';
    }
  };
}

function go(i, opts) {
  const autoplay = !opts || opts.autoplay !== false;
  cur = i;
  updateUI(i);
  if (i === 0) {
    stopAudio();
    plActive.style.display = 'none';
    plStandby.style.display = 'none';
    setLyrics(true);
    mv.muted = false;
    if (!mv.paused || mv.ended || mv.currentTime > 0) mv.currentTime = 0;
    if (autoplay) mv.play().catch(() => { mvNote.textContent = 'Press play on the video to start.'; });
    refreshSoundButton();
    return;
  }
  // Leaving the song for the news: stop the song, hide its lyrics, and mute the video so it can be
  // played alongside the news without the two soundtracks clashing until the listener asks.
  setLyrics(false);
  if (!mv.paused) mv.pause();
  mv.muted = true;
  refreshSoundButton();
  stopAudio();
  preloadAround(i);
  plActive.src = playlist[i].file;
  plActive.style.display = 'block';
  plStandby.style.display = 'none';
  if (autoplay) plActive.play().catch(() => {});
  attachPlayerLogic(i);
}

mv.addEventListener('ended', () => {
  if (cur === 0 && playlist.length > 1) go(1);
  refreshNote();
});
mv.addEventListener('play', () => {
  if (cur === 0) stopAudio();
  refreshNote();
});
mv.addEventListener('pause', refreshNote);
mv.addEventListener('volumechange', () => { refreshSoundButton(); refreshNote(); });
mvSound.addEventListener('click', () => { mv.muted = !mv.muted; });
if (lyricsTrack) lyricsTrack.addEventListener('cuechange', () => { if (cur === 0) tsText.textContent = currentLyric() || '♪ ' + EP.songTitle; });

btnPrev.onclick = () => { if (cur > 0) go(cur - 1); };
btnNext.onclick = () => { if (cur < playlist.length - 1) go(cur + 1); };

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && /^(INPUT|TEXTAREA|BUTTON|VIDEO|AUDIO)$/.test(e.target.tagName) && e.key === ' ') return;
  const k = e.key.toLowerCase();
  if (k === 'j' && !btnPrev.disabled) btnPrev.click();
  if (k === 'l' && !btnNext.disabled) btnNext.click();
  if (k === 'k') {
    const p = cur === 0 ? mv : plActive;
    if (p.paused) p.play().catch(() => {}); else p.pause();
  }
});

let lastTopic = null;
let group = null;
playlist.forEach((item, idx) => {
  const topic = item.summary || 'Banter and hot takes';
  if (topic !== lastTopic) {
    group = document.createElement('div');
    const h = document.createElement('div');
    h.className = 'topic-header'; h.textContent = topic;
    group.appendChild(h);
    chatContainer.appendChild(group);
    lastTopic = topic;
  }
  const b = document.createElement('div');
  b.className = 'chat-bubble';
  b.style.setProperty('--c', colourFor(item));
  const label = document.createElement('div');
  label.className = 'chat-label'; label.textContent = item.speaker;
  b.appendChild(label);
  b.appendChild(document.createTextNode(item.text));
  b.onclick = () => go(idx);
  group.appendChild(b);
});

toggleBtn.onclick = () => {
  const vis = chatContainer.classList.toggle('visible');
  toggleBtn.textContent = vis ? 'Hide transcript' : 'Show full transcript';
  tsBox.style.display = vis ? 'none' : 'block';
};

const startAt = (() => { const m = (location.hash || '').match(/section=(\d+)/); const n = m ? parseInt(m[1], 10) - 1 : 0; return n >= 0 && n < playlist.length ? n : 0; })();
setLyrics(startAt === 0);
go(startAt);
refreshSoundButton();

async function initMenu() {
  try {
    const r = await fetch('/projects/news/menu-data.json');
    if (!r.ok) return;
    const folders = await r.json();
    const at = folders.indexOf(FOLDER);
    if (at >= 0) {
      const older = folders[at + 1];
      const newer = at > 0 ? folders[at - 1] : null;
      const o = document.getElementById('podcast-older');
      const n = document.getElementById('podcast-newer');
      if (older) { o.href = '/projects/news/' + older + '/'; o.textContent = '← Older · ' + older; o.classList.remove('disabled'); o.removeAttribute('aria-disabled'); }
      if (newer) { n.href = '/projects/news/' + newer + '/'; n.textContent = 'Newer · ' + newer + ' →'; n.classList.remove('disabled'); n.removeAttribute('aria-disabled'); }
    }
    const overlay = document.createElement('div'); overlay.id = 'sidebar-overlay'; document.body.appendChild(overlay);
    const sidebar = document.createElement('div'); sidebar.id = 'news-sidebar';
    sidebar.innerHTML = '<div class="sidebar-header"><h2>Archives</h2><button class="sidebar-close" id="news-close-btn" aria-label="Close">&times;</button></div>';
    const list = document.createElement('ul'); list.className = 'sidebar-list';
    folders.forEach((f) => { const li = document.createElement('li'); const a = document.createElement('a'); a.href = '/projects/news/' + f + '/'; a.textContent = f; li.appendChild(a); list.appendChild(li); });
    sidebar.appendChild(list); document.body.appendChild(sidebar);
    const btn = document.createElement('button'); btn.id = 'news-menu-btn'; btn.innerHTML = '&#9776; Menu'; document.body.appendChild(btn);
    const toggle = () => { const open = !sidebar.classList.contains('open'); sidebar.classList.toggle('open', open); overlay.classList.toggle('open', open); };
    btn.addEventListener('click', toggle);
    overlay.addEventListener('click', toggle);
    document.getElementById('news-close-btn').addEventListener('click', toggle);
  } catch (e) { console.error('Menu failed:', e); }
}
initMenu();
</script>
</body>
