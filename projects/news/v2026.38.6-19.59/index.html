"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_2.mp3","url":"https://www.wired.com/story/kernel-panic-ai-vulnerability-explosion/","text":"Exactly! It’s like trying to regulate the internet in the nineties—by the time you have a policy, the vulnerability has already been exploited ten thousand times over.","voice":1,"speaker":"Brook","summary":"AI Vulnerability Explosion"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_3.mp3","url":"https://www.wired.com/story/kernel-panic-ai-vulnerability-explosion/","text":"And that's the irony. The very tools we built to make things more efficient are now the primary hammers being used to find the cracks in the foundation.","voice":2,"speaker":"Conrad","summary":"AI Vulnerability Explosion"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_4.mp3","url":null,"text":"Well, that is a pretty apt way to frame it. I'm Brook.","voice":1,"speaker":"Brook","summary":null},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_5.mp3","url":null,"text":"And I'm Conrad, and on today's episode of Patch Notes... we're looking at the friction between rapid innovation and the reality of human safety, from AI security to some very strange geopolitical shifts.","voice":2,"speaker":"Conrad","summary":null},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_6.mp3","url":"https://www.straitstimes.com/singapore/popular-bookstore-outlet-in-waterway-point-closed-for-the-weekend-after-water-leakage","text":"So, moving away from the digital 'flood,' there’s a bit of a physical one in Singapore—a bookstore at Waterway Point had to shut down for the weekend because of some water leakage.","voice":1,"speaker":"Brook","summary":"Bookstore Closure Leakage"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_7.mp3","url":"https://www.straitstimes.com/singapore/popular-bookstore-outlet-in-waterway-point-closed-for-the-weekend-after-water-leakage","text":"The mall is stepping in to help with the repairs, which is good, but it's a reminder of how fragile these commercial hubs are when the infrastructure fails.","voice":2,"speaker":"Conrad","summary":"Bookstore Closure Leakage"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_8.mp3","url":"https://www.straitstimes.com/singapore/popular-bookstore-outlet-in-waterway-point-closed-for-the-weekend-after-water-leakage","text":"It’s a bit of a contrast to the tech news—sometimes the most 'high-tech' malls can be brought down by basic plumbing issues.","voice":1,"speaker":"Brook","summary":"Bookstore Closure Leakage"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_9.mp3","url":"https://techcrunch.com/2026/09/18/india-forces-caller-id-apps-to-feed-spam-reports-to-telcos/","text":"True. But let's look at something more systemic... India is forcing caller-ID apps to feed their spam reports directly to the telecom operators.","voice":2,"speaker":"Conrad","summary":"India Spam Report Rules"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_10.mp3","url":"https://techcrunch.com/2026/09/18/india-forces-caller-id-apps-to-feed-spam-reports-to-telcos/","text":"That’s a huge move for Truecaller. They see that data as a proprietary asset—it's basically their 'secret sauce' for filtering out the noise.","voice":1,"speaker":"Brook","summary":"India Spam Report Rules"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_11.mp3","url":"https://techcrunch.com/2026/09/18/india-forces-caller-id-apps-to-feed-spam-reports-to-telcos/","text":"Right, and now they're being told to hand over the keys to the kingdom. It’s a classic tension between private data value and public utility.","voice":2,"speaker":"Conrad","summary":"India Spam Report Rules"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_12.mp3","url":"https://techcrunch.com/2026/09/18/india-forces-caller-id-apps-to-feed-spam-reports-to-telcos/","text":"It makes you wonder how much 'free' service we actually get when the underlying data is being harvested like that.","voice":1,"speaker":"Brook","summary":"India Spam Report Rules"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_13.mp3","url":"https://techcrunch.com/2026/09/18/tilly-norwoods-press-tour-is-going-about-as-well-as-youd-expect-for-an-ai/","text":"On a completely different note of 'human' behavior... there’s a story about an AI press tour where the personality, Tilly Norwood, apparently started speaking Chinese during an interview.","voice":2,"speaker":"Conrad","summary":"AI Press Tour Malfunction"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_14.mp3","url":"https://techcrunch.com/2026/09/18/tilly-norwoods-press-tour-is-going-about-as-well-as-youd-expect-for-an-ai/","text":"That sounds like a classic hallucination or a glitch in the persona mapping. It's fascinating how these 'human' AI avatars can just... pivot into a different language mid-sentence.","voice":1,"speaker":"Brook","summary":"AI Press Tour Malfunction"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_15.mp3","url":"https://techcrunch.com/2026/09/18/tilly-norwoods-press-tour-is-going-about-as-well-as-youd-expect-for-an-ai/","text":"It’s almost poetic in its failure—the machine trying so hard to be relatable that it loses the thread of the conversation entirely.","voice":2,"speaker":"Conrad","summary":"AI Press Tour Malfunction"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_16.mp3","url":"https://techcrunch.com/2026/09/18/tilly-norwoods-press-tour-is-going-about-as-well-as-youd-expect-for-an-ai/","text":"I'd love to see the raw logs on that one. Was it a deliberate 'multilingual' feature or just a total system crash?","voice":1,"speaker":"Brook","summary":"AI Press Tour Malfunction"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_17.mp3","url":"https://www.bbc.co.uk/news/articles/c63d7lexyym1o?at_medium=RSS&at_campaign=rss","text":"Probably a bit of both. Now, looking at the bigger geopolitical picture... we have some very interesting developments regarding Greenland.","voice":2,"speaker":"Conrad","summary":"US Denmark Greenland Deal"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_18.mp3","url":"https://www.bbc.co.uk/news/articles/c63d7lexyym1o?at_medium=RSS&at_campaign=rss","text":"Yeah, the US and Denmark reached a deal after those annexation threats from Trump. It's a massive shift in how security is being handled there.","voice":1,"speaker":"Brook","summary":"US Denmark Greenland Deal"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_19.mp3","url":"https://www.bbc.co.uk/news/articles/c63d7lexyym1o?at_medium=RSS&at_campaign=rss","text":"The specifics are still pretty murky on the Danish side, but it seems like a move to stabilize things before they get even more complicated.","voice":2,"speaker":"Conrad","summary":"US Denmark Greenland Deal"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_20.mp3","url":"https://www.bbc.co.uk/news/articles/c63d7lexyym1o?at_medium=RSS&at_campaign=rss","text":"It’s high-stakes diplomacy. One wrong word and you're looking at a lot of very uncomfortable questions about sovereignty.","voice":1,"speaker":"Brook","summary":"US Denmark Greenland Deal"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_21.mp3","url":"https://www.aljazeera.com/video/newsfeed/2026/9/19/09-19-progovrally-tehran-sv-mp4?traffic_source=rss","text":"And while we talk about global security, there's also the immediate reality in Iran, where they staged a massive show of force with armed women and drones in Tehran.","voice":2,"speaker":"Conrad","summary":"Iran Mobilization Show Of Force"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_22.mp3","url":"https://www.aljazeera.com/video/newsfeed/2026/9/19/09-19-progovrally-tehran-sv-mp4?traffic_source=rss","text":"That’s a lot of hardware on display for a mobilization campaign. It's very much about the optics of power.","voice":1,"speaker":"Brook","summary":"Iran Mobilization Show Of Force"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_23.mp3","url":"https://www.aljazeera.com/video/newsfeed/2026/9/19/09-19-progovrally-tehran-sv-mp4?traffic_source=rss","text":"Exactly. It's less about the actual mechanics and more about the message being sent to both their own people and the outside world.","voice":2,"speaker":"Conrad","summary":"Iran Mobilization Show Of Force"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_24.mp3","url":"https://www.aljazeera.com/news/2026/9/19/poland-on-high-alert-as-russia-claims-black-sea-vessel-strikes?traffic_source=rss","text":"It’s a stark contrast to the news out of Ukraine, where Russia hit several vessels in the Black Sea and killed eight people overnight.","voice":1,"speaker":"Brook","summary":"Russia Ukraine Attacks"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_25.mp3","url":"https://www.aljazeera.com/news/2026/9/19/poland-on-high-alert-as-russia-claims-black-sea-vessel-strikes?traffic_source=rss","text":"That's the grim reality of those 'shows of force.' It’s not just a parade; it’s active, lethal conflict with drones and missiles.","voice":2,"speaker":"Conrad","summary":"Russia Ukraine Attacks"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_26.mp3","url":"https://www.aljazeera.com/news/2026/9/19/poland-on-high-alert-as-russia-claims-black-sea-vessel-strikes?traffic_source=rss","text":"The scale of drone warfare in that region is becoming something we have to really pay attention to from an engineering standpoint—it's changing the rules of engagement.","voice":1,"speaker":"Brook","summary":"Russia Ukraine Attacks"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_27.mp3","url":"https://www.straitstimes.com/singapore/community/an-average-of-539-child-neglect-cases-a-year-in-singapore-required-authorities-to-step-in","text":"It certainly is. And on a more personal level of 'rules,' there’s a report that Singapore authorities had to step in for about 539 child neglect cases this year—some involving toddlers left home alone.","voice":2,"speaker":"Conrad","summary":"Singapore Child Neglect Cases"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_28.mp3","url":"https://www.straitstimes.com/singapore/community/an-average-of-539-child-neglect-cases-a-year-in-singapore-required-authorities-to-step-in","text":"That's a staggering number. It really highlights the gaps in social safety nets when families are struggling to keep up.","voice":1,"speaker":"Brook","summary":"Singapore Child Neglect Cases"},{"file":"https://assets.brook.dev/podcasts/v2026.38.6-19.59/audio_29.mp3","url":"https://www.straitstimes.com/singapore/community/an-average-of-539-child-neglect-cases-a-year-in-singapore-required-authorities-to-step-in","text":"It’s a heavy statistic for any city to face. It shows how much of our 'modern' success can still be undermined by basic human crises.","voice":2,"speaker":"Conrad","summary":"Singapore Child Neglect Cases"}]};

function currentLyric() {
  if (!lyricsTrack || !lyricsTrack.activeCues || !lyricsTrack.activeCues.length) return '';
  return Array.from(lyricsTrack.activeCues).map((c) => c.text).join('\n');
}

function updateUI(i) {
  btnPrev.disabled = i === 0;
  btnNext.disabled = i >= playlist.length - 1;
  const t = playlist[i];
  st.textContent = 'Segment ' + (i + 1) + ' of ' + playlist.length + (i === 0 ? ' · music video' : '');
  try { history.replaceState(null, '', '#section=' + (i + 1)); } catch (e) {}
  tsVoice.textContent = t.speaker;
  tsText.textContent = i === 0 ? (currentLyric() || '♪ ' + EP.songTitle) : t.text;
  tsBox.style.borderLeftColor = colourFor(t);
  document.querySelectorAll('.chat-bubble').forEach((b, idx) => {
    b.classList.toggle('active', idx === i);
    if (idx === i && chatContainer.classList.contains('visible')) b.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  if (t.url) {
    lnk.href = t.url;
    summ.textContent = t.summary || '';
    lnkWrap.classList.add('visible');
  } else {
    lnkWrap.classList.remove('visible');
  }
  refreshNote();
}

const preload = {};
function preloadAround(i) {
  const targets = [i + 1, i + 2].filter((n) => n > 0 && n < playlist.length);
  targets.forEach((n) => { if (!preload[n]) { const a = new Audio(); a.preload = 'auto'; a.src = playlist[n].file; preload[n] = a; } });
  Object.keys(preload).forEach((k) => { if (!targets.includes(+k)) { preload[k].src = ''; delete preload[k]; } });
}

function stopAudio() { plActive.pause(); plStandby.pause(); }

function attachPlayerLogic(idx) {
  isOverlapping = false;
  plActive.ontimeupdate = () => {
    if (isOverlapping || idx >= playlist.length - 1) return;
    if (playlist[idx + 1].text.trim().startsWith('--') && plActive.duration && plActive.duration - plActive.currentTime <= 2) {
      isOverlapping = true;
      cur++;
      updateUI(cur);
      plStandby.src = playlist[cur].file;
      plStandby.play().catch(() => {});
    }
  };
  plActive.onended = () => {
    if (isOverlapping) {
      const tmp = plActive; plActive = plStandby; plStandby = tmp;
      plActive.style.display = 'block'; plStandby.style.display = 'none';
      attachPlayerLogic(cur);
    } else if (cur < playlist.length - 1) {
      go(cur + 1);
    } else {
      st.textContent = 'Broadcast ended';
    }
  };
}

function go(i, opts) {
  const autoplay = !opts || opts.autoplay !== false;
  cur = i;
  updateUI(i);
  if (i === 0) {
    stopAudio();
    plActive.style.display = 'none';
    plStandby.style.display = 'none';
    setLyrics(true);
    mv.muted = false;
    if (!mv.paused || mv.ended || mv.currentTime > 0) mv.currentTime = 0;
    if (autoplay) mv.play().catch(() => { mvNote.textContent = 'Press play on the video to start.'; });
    refreshSoundButton();
    return;
  }
  // Leaving the song for the news: stop the song, hide its lyrics, and mute the video so it can be
  // played alongside the news without the two soundtracks clashing until the listener asks.
  setLyrics(false);
  if (!mv.paused) mv.pause();
  mv.muted = true;
  refreshSoundButton();
  stopAudio();
  preloadAround(i);
  plActive.src = playlist[i].file;
  plActive.style.display = 'block';
  plStandby.style.display = 'none';
  if (autoplay) plActive.play().catch(() => {});
  attachPlayerLogic(i);
}

mv.addEventListener('ended', () => {
  if (cur === 0 && playlist.length > 1) go(1);
  refreshNote();
});
mv.addEventListener('play', () => {
  if (cur === 0) stopAudio();
  refreshNote();
});
mv.addEventListener('pause', refreshNote);
mv.addEventListener('volumechange', () => { refreshSoundButton(); refreshNote(); });
mvSound.addEventListener('click', () => { mv.muted = !mv.muted; });
if (lyricsTrack) lyricsTrack.addEventListener('cuechange', () => { if (cur === 0) tsText.textContent = currentLyric() || '♪ ' + EP.songTitle; });

btnPrev.onclick = () => { if (cur > 0) go(cur - 1); };
btnNext.onclick = () => { if (cur < playlist.length - 1) go(cur + 1); };

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && /^(INPUT|TEXTAREA|BUTTON|VIDEO|AUDIO)$/.test(e.target.tagName) && e.key === ' ') return;
  const k = e.key.toLowerCase();
  if (k === 'j' && !btnPrev.disabled) btnPrev.click();
  if (k === 'l' && !btnNext.disabled) btnNext.click();
  if (k === 'k') {
    const p = cur === 0 ? mv : plActive;
    if (p.paused) p.play().catch(() => {}); else p.pause();
  }
});

let lastTopic = null;
let group = null;
playlist.forEach((item, idx) => {
  const topic = item.summary || 'Banter and hot takes';
  if (topic !== lastTopic) {
    group = document.createElement('div');
    const h = document.createElement('div');
    h.className = 'topic-header'; h.textContent = topic;
    group.appendChild(h);
    chatContainer.appendChild(group);
    lastTopic = topic;
  }
  const b = document.createElement('div');
  b.className = 'chat-bubble';
  b.style.setProperty('--c', colourFor(item));
  const label = document.createElement('div');
  label.className = 'chat-label'; label.textContent = item.speaker;
  b.appendChild(label);
  b.appendChild(document.createTextNode(item.text));
  b.onclick = () => go(idx);
  group.appendChild(b);
});

toggleBtn.onclick = () => {
  const vis = chatContainer.classList.toggle('visible');
  toggleBtn.textContent = vis ? 'Hide transcript' : 'Show full transcript';
  tsBox.style.display = vis ? 'none' : 'block';
};

const startAt = (() => { const m = (location.hash || '').match(/section=(\d+)/); const n = m ? parseInt(m[1], 10) - 1 : 0; return n >= 0 && n < playlist.length ? n : 0; })();
setLyrics(startAt === 0);
go(startAt);
refreshSoundButton();

async function initMenu() {
  try {
    const r = await fetch('/projects/news/menu-data.json');
    if (!r.ok) return;
    const folders = await r.json();
    const at = folders.indexOf(FOLDER);
    if (at >= 0) {
      const older = folders[at + 1];
      const newer = at > 0 ? folders[at - 1] : null;
      const o = document.getElementById('podcast-older');
      const n = document.getElementById('podcast-newer');
      if (older) { o.href = '/projects/news/' + older + '/'; o.textContent = '← Older · ' + older; o.classList.remove('disabled'); o.removeAttribute('aria-disabled'); }
      if (newer) { n.href = '/projects/news/' + newer + '/'; n.textContent = 'Newer · ' + newer + ' →'; n.classList.remove('disabled'); n.removeAttribute('aria-disabled'); }
    }
    const overlay = document.createElement('div'); overlay.id = 'sidebar-overlay'; document.body.appendChild(overlay);
    const sidebar = document.createElement('div'); sidebar.id = 'news-sidebar';
    sidebar.innerHTML = '<div class="sidebar-header"><h2>Archives</h2><button class="sidebar-close" id="news-close-btn" aria-label="Close">&times;</button></div>';
    const list = document.createElement('ul'); list.className = 'sidebar-list';
    folders.forEach((f) => { const li = document.createElement('li'); const a = document.createElement('a'); a.href = '/projects/news/' + f + '/'; a.textContent = f; li.appendChild(a); list.appendChild(li); });
    sidebar.appendChild(list); document.body.appendChild(sidebar);
    const btn = document.createElement('button'); btn.id = 'news-menu-btn'; btn.innerHTML = '&#9776; Menu'; document.body.appendChild(btn);
    const toggle = () => { const open = !sidebar.classList.contains('open'); sidebar.classList.toggle('open', open); overlay.classList.toggle('open', open); };
    btn.addEventListener('click', toggle);
    overlay.addEventListener('click', toggle);
    document.getElementById('news-close-btn').addEventListener('click', toggle);
  } catch (e) { console.error('Menu failed:', e); }
}
initMenu();
</script>
