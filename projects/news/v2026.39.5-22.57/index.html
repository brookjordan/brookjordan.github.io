<script>
const EP = {"folder":"v2026.39.5-22.57","songTitle":"The Spirit of the Fence","hasLegacy":true,"credits":"Song \"The Spirit of the Fence\" sung by YuE2 (take 193565). Picture: an animatic of Qwen Image 2512 stills cut to the song; no motion clips were rendered for this day yet.","sources":[],"playlist":[{"kind":"video","file":null,"url":null,"text":"[Verse 1]\nThe playground sits in shadows at dusk.\nThe fence has a gap in the wire.\nNoah Woods slipped through the metal opening.\nHe was found submerged in the water.\n\n[Chorus]\nThe Spirit of the Fence is cold.\nThe Spirit of the Fence is a ghost.\n\n[Verse 2]\nA sex offender walked out on bail.\nA sex offender was bailed to a nearby flat.\nThe community feels a sense of deep fear.\nThis bail is a risk to the kids.\n\n[Chorus]\nThe Spirit of the Fence is cold.\nThe Spirit of the Fence is a ghost.\n\n[Bridge]\nThe heavy air feels like a weight.\nThe night holds a secret fear.\n\n[Chorus]\nThe Spirit of the Fence is cold.\nThe Spirit of the Fence is a ghost.","voice":"song","speaker":"Music video","summary":"The Spirit of the Fence"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_0.mp3","url":"https://kottke.org/26/09/0049680-what-if-we-just-stopped","text":"I was reading this piece about the 'Looney Tunes stage' of social media... it feels like we’re all just watching the cliff edge approach in slow motion now.","voice":1,"speaker":"Brook","summary":"Social Media Crisis"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_1.mp3","url":"https://kottke.org/26/09/0049680-what-if-we-just-stopped","text":"It’s that moment where the absurdity becomes so high that you can't tell if people are still trying to fix it or if they're just waiting for the inevitable crash.","voice":2,"speaker":"Conrad","summary":"Social Media Crisis"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_2.mp3","url":"https://kottke.org/26/09/0049680-what-if-we-just-stopped","text":"Exactly. It's like we've glided past the point of no return and now we're just... tumbling.","voice":1,"speaker":"Brook","summary":"Social Media Crisis"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_3.mp3","url":"https://kottke.org/26/09/0049680-what-if-we-just-stopped","text":"Right. The 'down' part is starting to dawn on everyone at once.","voice":2,"speaker":"Conrad","summary":"Social Media Crisis"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_4.mp3","url":null,"text":"I'm Brook.","voice":1,"speaker":"Brook","summary":null},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_5.mp3","url":null,"text":"And I'm Conrad, and on today's episode of Patch Notes... we're looking at the state of our digital world, some heavy legal shifts in the Philippines, and a bit of tech progress for the long haul.","voice":2,"speaker":"Conrad","summary":null},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_6.mp3","url":"https://catanduanestribune.net/2026/09/25/verba-legis-and-ratio-legis-the-letter-and-the-spirit-of-the-law/?utm_source=rss&utm_medium=rss&utm_campaign=verba-legis-and-ratio-legis-the-letter-and-the-spirit-of-the-law","text":"So, moving from the 'Looney Tunes' of social media to something more grounded... there's this fascinating look at how we interpret laws—specifically the difference between the letter and the spirit of the law.","voice":1,"speaker":"Brook","summary":"Legal Maxim Analysis"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_7.mp3","url":"https://catanduanestribune.net/2026/09/25/verba-legis-and-ratio-legis-the-letter-and-the-spirit-of-the-law/?utm_source=rss&utm_medium=rss&utm_campaign=verba-legis-and-ratio-legis-the-letter-and-the-spirit-of-the-law","text":"Verba legis versus ratio legis. It’s a classic legal tension, isn't it? The literal words on the page versus the actual intent behind them.","voice":2,"speaker":"Conrad","summary":"Legal Maxim Analysis"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_8.mp3","url":"https://catanduanestribune.net/2026/09/25/verba-legis-and-ratio-legis-the-letter-and-the-spirit-of-the-law/?utm_source=rss&utm_medium=rss&utm_campaign=verba-legis-and-ratio-legis-the-letter-and-the-spirit-of-the-law","text":"It's interesting because in software, we deal with that constantly—if you follow the 'letter' of a requirement too strictly without understanding the 'spirit,' you end up with a product that works but is totally useless for the user.","voice":1,"speaker":"Brook","summary":"Legal Maxim Analysis"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_9.mp3","url":"https://catanduanestribune.net/2026/09/25/verba-legis-and-ratio-legis-the-letter-and-the-spirit-of-the-law/?utm_source=rss&utm_medium=rss&utm_campaign=verba-legis-and-ratio-legis-the-letter-and-the-spirit-of-the-law","text":"That’s a great parallel. A law can be technically followed while completely undermining what it was supposed to achieve.","voice":2,"speaker":"Conrad","summary":"Legal Maxim Analysis"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_10.mp3","url":"https://catanduanestribune.net/2026/09/25/sara-duterte-on-trial-the-case-against-the-vice-president-of-the-philippines/?utm_source=rss&utm_medium=rss&utm_campaign=sara-duterte-on-trial-the-case-against-the-vice-president-of-the-philippines","text":"Speaking of legal consequences and high-stakes politics, we're seeing some serious developments in the Philippines with Sara Duterte facing trial.","voice":1,"speaker":"Brook","summary":"Sara Duterte Trial"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_11.mp3","url":"https://catanduanestribune.net/2026/09/25/sara-duterte-on-trial-the-case-against-the-vice-president-of-the-philippines/?utm_source=rss&utm_medium=rss&utm_campaign=sara-duterte-on-trial-the-case-against-the-vice-president-of-the-philippines","text":"It’s a heavy situation, especially with her father still in detention at the International Criminal Court on those crimes against humanity charges.","voice":2,"speaker":"Conrad","summary":"Sara Duterte Trial"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_12.mp3","url":"https://catanduanestribune.net/2026/09/25/sara-duterte-on-trial-the-case-against-the-vice-president-of-the-philippines/?utm_source=rss&utm_medium=rss&utm_campaign=sara-duterte-on-trial-the-case-against-the-vice-president-of-the-philippines","text":"Yeah, it puts a lot of pressure on the current administration while they're navigating that legacy.","voice":1,"speaker":"Brook","summary":"Sara Duterte Trial"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_13.mp3","url":"https://catanduanestribune.net/2026/09/25/sara-duterte-on-trial-the-case-against-the-vice-president-of-the-philippines/?utm_source=rss&utm_medium=rss&utm_campaign=sara-duterte-on-trial-the-case-against-the-vice-president-of-the-philippines","text":"It’s a complex web of accountability.","voice":2,"speaker":"Conrad","summary":"Sara Duterte Trial"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_14.mp3","url":"https://www.wired.com/story/tesla-semi/","text":"On the tech side of things, it's been nearly a decade, but the electric Tesla Semi is finally making its move for fleet managers.","voice":1,"speaker":"Brook","summary":"Tesla Semi Launch"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_15.mp3","url":"https://www.wired.com/story/tesla-semi/","text":"A long time to wait for a niche audience, but I suppose heavy-duty transport takes longer to get right than a passenger car.","voice":2,"speaker":"Conrad","summary":"Tesla Semi Launch"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_16.mp3","url":"https://www.wired.com/story/tesla-semi/","text":"True. It's about the engineering trade-offs of moving massive weight with clean energy.","voice":1,"speaker":"Brook","summary":"Tesla Semi Launch"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_17.mp3","url":"https://techcrunch.com/2026/09/24/lightspeed-targets-250m-for-new-india-fund-focusing-on-early-stage-ai/","text":"And while we wait for those trucks, Lightspeed is aiming for $250 million to focus on early-stage AI in India.","voice":2,"speaker":"Conrad","summary":"India AI Fund"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_18.mp3","url":"https://techcrunch.com/2026/09/24/lightspeed-targets-250m-for-new-india-fund-focusing-on-early-stage-ai/","text":"They're aligning their global funds with that cycle—it shows where the real investment heat is moving right now.","voice":1,"speaker":"Brook","summary":"India AI Fund"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_19.mp3","url":"https://techcrunch.com/2026/09/24/lightspeed-targets-250m-for-new-india-fund-focusing-on-early-stage-ai/","text":"It’s a massive shift toward shorter investment periods for AI.","voice":2,"speaker":"Conrad","summary":"India AI Fund"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_20.mp3","url":"https://www.straitstimes.com/singapore/85-year-old-in-bukit-batok-care-home-did-not-get-help-after-fall-due-to-technical-issues-with-alert","text":"We also have some sobering news regarding an 85-year-old in a care home who didn't get help after a fall because of 'technical issues' with her alert button.","voice":1,"speaker":"Brook","summary":"Care Home Alert Failure"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_21.mp3","url":"https://www.straitstimes.com/singapore/85-year-old-in-bukit-batok-care-home-did-not-get-help-after-fall-due-to-technical-issues-with-alert","text":"That’s devastating. The firm says they've checked the buttons, but for that resident, the failure was absolute.","voice":2,"speaker":"Conrad","summary":"Care Home Alert Failure"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_22.mp3","url":"https://www.straitstimes.com/singapore/85-year-old-in-bukit-batok-care-home-did-not-get-help-after-fall-due-to-technical-issues-with-alert","text":"It really highlights the danger of relying on tech without a human fail-safe in care settings.","voice":1,"speaker":"Brook","summary":"Care Home Alert Failure"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_23.mp3","url":"https://www.straitstimes.com/singapore/85-year-old-in-bukit-batok-care-home-did-not-get-help-after-fall-due-to-technical-issues-with-alert","text":"Exactly. Technology should augment care, not replace it.","voice":2,"speaker":"Conrad","summary":"Care Home Alert Failure"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_24.mp3","url":"https://www.straitstimes.com/singapore/courts-crime/13-months-jail-for-driver-who-ran-red-light-collided-with-pregnant-woman-along-upper-changi-road","text":"Moving to some tragic news in Singapore, a driver was sentenced to 13 months for running a red light and hitting a pregnant woman.","voice":1,"speaker":"Brook","summary":"Red Light Collision Sentence"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_25.mp3","url":"https://www.straitstimes.com/singapore/courts-crime/13-months-jail-for-driver-who-ran-red-light-collided-with-pregnant-woman-along-upper-changi-road","text":"A horrific accident. Thankfully the pedestrian didn't have pregnancy complications, but 59 days in the hospital is a long time to recover from that.","voice":2,"speaker":"Conrad","summary":"Red Light Collision Sentence"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_26.mp3","url":"https://www.straitstimes.com/singapore/courts-crime/13-months-jail-for-driver-who-ran-red-light-collided-with-pregnant-woman-along-upper-changi-road","text":"It’s a stark reminder of how quickly things can change on the road.","voice":1,"speaker":"Brook","summary":"Red Light Collision Sentence"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_27.mp3","url":"https://www.channelnewsasia.com/singapore/mandai-zoo-pathologist-vet-dr-hsu-chia-da-animal-death-post-mortem-care-6410536","text":"And then there's the work Dr. Hsu Chia-Da is doing at the Singapore Zoo—investigating every animal death to improve future care.","voice":2,"speaker":"Conrad","summary":"Zoo Post-Mortem Process"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_28.mp3","url":"https://www.channelnewsasia.com/singapore/mandai-zoo-pathologist-vet-dr-hsu-chia-da-animal-death-post-mortem-care-6410536","text":"It’s a grim but necessary role. Using those post-mortems as data points for the vets and zookeepers is vital for animal welfare.","voice":1,"speaker":"Brook","summary":"Zoo Post-Mortem Process"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_29.mp3","url":"https://www.channelnewsasia.com/singapore/mandai-zoo-pathologist-vet-dr-hsu-chia-da-animal-death-post-mortem-care-6410536","text":"A very different kind of investigation than the legal ones we discussed earlier.","voice":2,"speaker":"Conrad","summary":"Zoo Post-Mortem Process"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_30.mp3","url":"https://www.channelnewsasia.com/singapore/super-aged-society-births-population-growth-marriages-6410521","text":"Singapore is also becoming a 'super-aged' society, with more than one in five citizens over 65.","voice":1,"speaker":"Brook","summary":"Singapore Aging Population"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_31.mp3","url":"https://www.channelnewsasia.com/singapore/super-aged-society-births-population-growth-marriages-6410521","text":"The growth of the 80-plus demographic by 60 per cent in a decade is a massive shift for infrastructure and planning.","voice":2,"speaker":"Conrad","summary":"Singapore Aging Population"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_32.mp3","url":"https://www.channelnewsasia.com/singapore/super-aged-society-births-population-growth-marriages-6410521","text":"It definitely changes how we think about everything from healthcare to urban design.","voice":1,"speaker":"Brook","summary":"Singapore Aging Population"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_33.mp3","url":"https://www.bbc.co.uk/news/articles/cmwyzrrnn015o?at_medium=RSS&at_campaign=rss","text":"We're also seeing some really concerning reports about a sex offender being bailed out to a flat near a playground, which the victims commissioner says failed families.","voice":2,"speaker":"Conrad","summary":"Sex Offender Bail Controversy"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_34.mp3","url":"https://www.bbc.co.uk/news/articles/cmwyzrrnn015o?at_medium=RSS&at_campaign=rss","text":"That’s an appalling oversight in risk assessment. The proximity alone is terrifying for the community.","voice":1,"speaker":"Brook","summary":"Sex Offender Bail Controversy"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_35.mp3","url":"https://www.bbc.co.uk/news/articles/cmwyzrrnn015o?at_medium=RSS&at_campaign=rss","text":"It's a failure of the system to protect the most vulnerable.","voice":2,"speaker":"Conrad","summary":"Sex Offender Bail Controversy"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_36.mp3","url":"https://www.bbc.co.uk/news/articles/cqgk54vg053po?at_medium=RSS&at_campaign=rss","text":"And then there's the inquest regarding Noah Woods, who was found submerged after leaving a playground through a gap in the fence.","voice":1,"speaker":"Brook","summary":"Child Playground Inquest"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_37.mp3","url":"https://www.bbc.co.uk/news/articles/cqgk54vg053po?at_medium=RSS&at_campaign=rss","text":"A tragic reminder of how small gaps in safety can have such permanent consequences.","voice":2,"speaker":"Conrad","summary":"Child Playground Inquest"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_38.mp3","url":null,"text":"It's heartbreaking. We'll leave it there for today.","voice":1,"speaker":"Brook","summary":null}]};
const playlist = EP.playlist;
const FOLDER = EP.folder;
const COLOURS = ['#bb86fc', '#00d2ff', '#ffb74d', '#81c784', '#f06292', '#90a4ae'];

const mv = document.getElementById('mv');
const lyricsTrack = mv.textTracks[0];
const mvSound = document.getElementById('mv-sound');
const mvNote = document.getElementById('mv-note');
const st = document.getElementById('st');
const btnPrev = document.getElementById('btn-prev');
const btnNext = document.getElementById('btn-next');
const lnkWrap = document.getElementById('lnk-wrap');
const lnk = document.getElementById('lnk');
const summ = document.getElementById('summ');
const tsText = document.getElementById('ts-text');
const tsVoice = document.getElementById('ts-voice');
const tsBox = document.getElementById('ts-box');
const chatContainer = document.getElementById('full-chat');
const toggleBtn = document.getElementById('toggle-chat');
let plActive = document.getElementById('pl1');
let plStandby = document.getElementById('pl2');

document.getElementById('song-title').textContent = EP.songTitle;
document.getElementById('credits').textContent = EP.credits;
if (EP.hasLegacy) document.getElementById('version-switch').hidden = false;
if (playlist.length < 2) document.getElementById('news-player').hidden = true;
if (EP.sources.length) {
  const list = document.getElementById('sources-list');
  EP.sources.forEach((s) => {
    const li = document.createElement('li');
    const a = document.createElement('a');
    a.href = s.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = s.title;
    li.appendChild(a);
    if (s.where) li.appendChild(document.createTextNode(' · ' + s.where));
    list.appendChild(li);
  });
  document.getElementById('sources').hidden = false;
}

// Lyrics show on the video only while the music video is the current segment.
function setLyrics(on) { if (lyricsTrack) lyricsTrack.mode = on ? 'showing' : 'hidden'; }

let cur = 0;
let isOverlapping = false;

function colourFor(item) {
  if (item.kind === 'video') return COLOURS[0];
  const v = typeof item.voice === 'number' ? item.voice : String(item.voice).length;
  return COLOURS[(v % (COLOURS.length - 1)) + 1];
}

function refreshSoundButton() {
  mvSound.textContent = mv.muted ? 'Sound: off' : 'Sound: on';
  mvSound.setAttribute('aria-pressed', String(!mv.muted));
}

function refreshNote() {
  if (cur === 0) {
    mvNote.textContent = playlist.length > 1 ? 'The music video opens the episode; the news follows when it ends.' : '';
  } else {
    mvNote.textContent = mv.paused ? 'The news is playing. You can play the video alongside it, with or without its sound.' : (mv.muted ? 'Video playing without sound.' : 'Video playing with its sound.');
  }
}

function currentLyric() {
  if (!lyricsTrack || !lyricsTrack.activeCues || !lyricsTrack.activeCues.length) return '';
  return Array.from(lyricsTrack.activeCues).map((c) => c.text).join('\n');
}

function updateUI(i) {
  btnPrev.disabled = i === 0;
  btnNext.disabled = i >= playlist.length - 1;
  const t = playlist[i];
  st.textContent = 'Segment ' + (i + 1) + ' of ' + playlist.length + (i === 0 ? ' · music video' : '');
  try { history.replaceState(null, '', '#section=' + (i + 1)); } catch (e) {}
  tsVoice.textContent = t.speaker;
  tsText.textContent = i === 0 ? (currentLyric() || '♪ ' + EP.songTitle) : t.text;
  tsBox.style.borderLeftColor = colourFor(t);
  document.querySelectorAll('.chat-bubble').forEach((b, idx) => {
    b.classList.toggle('active', idx === i);
    if (idx === i && chatContainer.classList.contains('visible')) b.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  if (t.url) {
    lnk.href = t.url;
    summ.textContent = t.summary || '';
    lnkWrap.classList.add('visible');
  } else {
    lnkWrap.classList.remove('visible');
  }
  refreshNote();
}

const preload = {};
function preloadAround(i) {
  const targets = [i + 1, i + 2].filter((n) => n > 0 && n < playlist.length);
  targets.forEach((n) => { if (!preload[n]) { const a = new Audio(); a.preload = 'auto'; a.src = playlist[n].file; preload[n] = a; } });
  Object.keys(preload).forEach((k) => { if (!targets.includes(+k)) { preload[k].src = ''; delete preload[k]; } });
}

function stopAudio() { plActive.pause(); plStandby.pause(); }

function attachPlayerLogic(idx) {
  isOverlapping = false;
  plActive.ontimeupdate = () => {
    if (isOverlapping || idx >= playlist.length - 1) return;
    if (playlist[idx + 1].text.trim().startsWith('--') && plActive.duration && plActive.duration - plActive.currentTime <= 2) {
      isOverlapping = true;
      cur++;
      updateUI(cur);
      plStandby.src = playlist[cur].file;
      plStandby.play().catch(() => {});
    }
  };
  plActive.onended = () => {
    if (isOverlapping) {
      const tmp = plActive; plActive = plStandby; plStandby = tmp;
      plActive.style.display = 'block'; plStandby.style.display = 'none';
      attachPlayerLogic(cur);
    } else if (cur < playlist.length - 1) {
      go(cur + 1);
    } else {
      st.textContent = 'Broadcast ended';
    }
  };
}

function go(i, opts) {
  const autoplay = !opts || opts.autoplay !== false;
  cur = i;
  updateUI(i);
  if (i === 0) {
    stopAudio();
    plActive.style.display = 'none';
    plStandby.style.display = 'none';
    setLyrics(true);
    mv.muted = false;
    if (!mv.paused || mv.ended || mv.currentTime > 0) mv.currentTime = 0;
    if (autoplay) mv.play().catch(() => { mvNote.textContent = 'Press play on the video to start.'; });
    refreshSoundButton();
    return;
  }
  // Leaving the song for the news: stop the song, hide its lyrics, and mute the video so it can be
  // played alongside the news without the two soundtracks clashing until the listener asks.
  setLyrics(false);
  if (!mv.paused) mv.pause();
  mv.muted = true;
  refreshSoundButton();
  stopAudio();
  preloadAround(i);
  plActive.src = playlist[i].file;
  plActive.style.display = 'block';
  plStandby.style.display = 'none';
  if (autoplay) plActive.play().catch(() => {});
  attachPlayerLogic(i);
}

mv.addEventListener('ended', () => {
  if (cur === 0 && playlist.length > 1) go(1);
  refreshNote();
});
mv.addEventListener('play', () => {
  if (cur === 0) stopAudio();
  refreshNote();
});
mv.addEventListener('pause', refreshNote);
mv.addEventListener('volumechange', () => { refreshSoundButton(); refreshNote(); });
mvSound.addEventListener('click', () => { mv.muted = !mv.muted; });
if (lyricsTrack) lyricsTrack.addEventListener('cuechange', () => { if (cur === 0) tsText.textContent = currentLyric() || '♪ ' + EP.songTitle; });

btnPrev.onclick = () => { if (cur > 0) go(cur - 1); };
btnNext.onclick = () => { if (cur < playlist.length - 1) go(cur + 1); };

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && /^(INPUT|TEXTAREA|BUTTON|VIDEO|AUDIO)$/.test(e.target.tagName) && e.key === ' ') return;
  const k = e.key.toLowerCase();
  if (k === 'j' && !btnPrev.disabled) btnPrev.click();
  if (k === 'l' && !btnNext.disabled) btnNext.click();
  if (k === 'k') {
    const p = cur === 0 ? mv : plActive;
    if (p.paused) p.play().catch(() => {}); else p.pause();
  }
});

let lastTopic = null;
let group = null;
playlist.forEach((item, idx) => {
  const topic = item.summary || 'Banter and hot takes';
  if (topic !== lastTopic) {
    group = document.createElement('div');
    const h = document.createElement('div');
    h.className = 'topic-header'; h.textContent = topic;
    group.appendChild(h);
    chatContainer.appendChild(group);
    lastTopic = topic;
  }
  const b = document.createElement('div');
  b.className = 'chat-bubble';
  b.style.setProperty('--c', colourFor(item));
  const label = document.createElement('div');
  label.className = 'chat-label'; label.textContent = item.speaker;
  b.appendChild(label);
  b.appendChild(document.createTextNode(item.text));
  b.onclick = () => go(idx);
  group.appendChild(b);
});

toggleBtn.onclick = () => {
  const vis = chatContainer.classList.toggle('visible');
  toggleBtn.textContent = vis ? 'Hide transcript' : 'Show full transcript';
  tsBox.style.display = vis ? 'none' : 'block';
};

const startAt = (() => { const m = (location.hash || '').match(/section=(\d+)/); const n = m ? parseInt(m[1], 10) - 1 : 0; return n >= 0 && n < playlist.length ? n : 0; })();
setLyrics(startAt === 0);
go(startAt);
refreshSoundButton();

async function initMenu() {
  try {
    const r = await fetch('/projects/news/menu-data.json');
    if (!r.ok) return;
    const folders = await r.json();
    const at = folders.indexOf(FOLDER);
    if (at >= 0) {
      const older = folders[at + 1];
      const newer = at > 0 ? folders[at - 1] : null;
      const o = document.getElementById('podcast-older');
      const n = document.getElementById('podcast-newer');
      if (older) { o.href = '/projects/news/' + older + '/'; o.textContent = '← Older · ' + older; o.classList.remove('disabled'); o.removeAttribute('aria-disabled'); }
      if (newer) { n.href = '/projects/news/' + newer + '/'; n.textContent = 'Newer · ' + newer + ' →'; n.classList.remove('disabled'); n.removeAttribute('aria-disabled'); }
    }
    const overlay = document.createElement('div'); overlay.id = 'sidebar-overlay'; document.body.appendChild(overlay);
    const sidebar = document.createElement('div'); sidebar.id = 'news-sidebar';
    sidebar.innerHTML = '<div class="sidebar-header"><h2>Archives</h2><button class="sidebar-close" id="news-close-btn" aria-label="Close">&times;</button></div>';
    const list = document.createElement('ul'); list.className = 'sidebar-list';
    folders.forEach((f) => { const li = document.createElement('li'); const a = document.createElement('a'); a.href = '/projects/news/' + f + '/'; a.textContent = f; li.appendChild(a); list.appendChild(li); });
    sidebar.appendChild(list); document.body.appendChild(sidebar);
    const btn = document.createElement('button'); btn.id = 'news-menu-btn'; btn.innerHTML = '&#9776; Menu'; document.body.appendChild(btn);
    const toggle = () => { const open = !sidebar.classList.contains('open'); sidebar.classList.toggle('open', open); overlay.classList.toggle('open', open); };
    btn.addEventListener('click', toggle);
    overlay.addEventListener('click', toggle);
    document.getElementById('news-close-btn').addEventListener('click', toggle);
  } catch (e) { console.error('Menu failed:', e); }
}
initMenu();
</script>
</body>
</html>
