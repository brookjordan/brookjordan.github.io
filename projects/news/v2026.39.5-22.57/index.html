        const OVERLAP_SECONDS = 2;
        const playlist = [{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/intro.wav","url":null,"text":"Intro song\n\n[Intro: Jazzy electric piano chords with a steady kick drum]\n\n[Verse]\nThe algorithm is screaming in a social media storm\nWhile the courts are dissecting every legal norm.\nFrom the heavy weight of justice for a red light crash,\nTo the silent care home alerts fading into ash.\n\n[Chorus]\nWe're navigating the friction, the old and the new,\nBetween the AI gold rush and the trials coming through.\nIt’s the pulse of the public, the tension in the wire,\nTurning today’s chaos into a shared desire.","voice":"intro","speaker":"Intro Theme","summary":"Intro"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_0.mp3","url":"https://kottke.org/26/09/0049680-what-if-we-just-stopped","text":"I was reading this piece about the 'Looney Tunes stage' of social media... it feels like we’re all just watching the cliff edge approach in slow motion now.","voice":1,"speaker":"Brook","summary":"Social Media Crisis"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_1.mp3","url":"https://kottke.org/26/09/0049680-what-if-we-just-stopped","text":"It’s that moment where the absurdity becomes so high that you can't tell if people are still trying to fix it or if they're just waiting for the inevitable crash.","voice":2,"speaker":"Conrad","summary":"Social Media Crisis"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_2.mp3","url":"https://kottke.org/26/09/0049680-what-if-we-just-stopped","text":"Exactly. It's like we've glided past the point of no return and now we're just... tumbling.","voice":1,"speaker":"Brook","summary":"Social Media Crisis"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_3.mp3","url":"https://kottke.org/26/09/0049680-what-if-we-just-stopped","text":"Right. The 'down' part is starting to dawn on everyone at once.","voice":2,"speaker":"Conrad","summary":"Social Media Crisis"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_4.mp3","url":null,"text":"I'm Brook.","voice":1,"speaker":"Brook","summary":null},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_5.mp3","url":null,"text":"And I'm Conrad, and on today's episode of Patch Notes... we're looking at the state of our digital world, some heavy legal shifts in the Philippines, and a bit of tech progress for the long haul.","voice":2,"speaker":"Conrad","summary":null},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_6.mp3","url":"https://catanduanestribune.net/2026/09/25/verba-legis-and-ratio-legis-the-letter-and-the-spirit-of-the-law/?utm_source=rss&utm_medium=rss&utm_campaign=verba-legis-and-ratio-legis-the-letter-and-the-spirit-of-the-law","text":"So, moving from the 'Looney Tunes' of social media to something more grounded... there's this fascinating look at how we interpret laws—specifically the difference between the letter and the spirit of the law.","voice":1,"speaker":"Brook","summary":"Legal Maxim Analysis"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_7.mp3","url":"https://catanduanestribune.net/2026/09/25/verba-legis-and-ratio-legis-the-letter-and-the-spirit-of-the-law/?utm_source=rss&utm_medium=rss&utm_campaign=verba-legis-and-ratio-legis-the-letter-and-the-spirit-of-the-law","text":"Verba legis versus ratio legis. It’s a classic legal tension, isn't it? The literal words on the page versus the actual intent behind them.","voice":2,"speaker":"Conrad","summary":"Legal Maxim Analysis"},{"file":"https://assets.brook.dev/podcasts/v2026.39.5-22.57/audio_8.mp3","url":"https://catanduanestribune.net/2026/09/25/verba-legis-and-ratio-legis-the-letter-and-the-spirit-of-the-law/?utm_source=rss&utm_medium=rss&utm_campaign=verba-legis-and-ratio-legis-the-letter-and-the-spirit-of-the-law","text":"It's interesting because in software, we deal with that constantly—if you follow the 'letter' of a requirement too strictl         // --- PRIMARY KEYFRAME → FIRST/LAST-FRAME VIDEO → HIGH-QUALITY FINAL KEYFRAME ---
        let videoReady = podcastVideo.readyState >= HTMLMediaElement.HAVE_ENOUGH_DATA;
        let finalImageReady = finalCover.complete && finalCover.naturalWidth > 0;
        let videoStarted = false;
        let videoUnavailable = false;

        function maybeStartVideo() {
            if (videoStarted || videoUnavailable || !videoReady || !finalImageReady) return;
            videoStarted = true;
            mediaStage.classList.remove('show-final');
            mediaStage.classList.add('video-playing');
            mediaHint.textContent = 'Playing motion';
            podcastVideo.currentTime = 0;
            podcastVideo.play().catch(() => {
                videoStarted = false;
                mediaHint.textContent = 'Tap to play motion';
            });
        }

        podcastVideo.addEventListener('canplaythrough', () => {
            videoReady = true;
            maybeStartVideo();
        }, { once: true });

        finalCover.addEventListener('load', () => {
            finalImageReady = true;
            maybeStartVideo();
        }, { once: true });

        podcastVideo.addEventListener('ended', () => {
            mediaStage.classList.add('show-final');
            mediaHint.textContent = 'Tap to replay';
        });

        podcastVideo.addEventListener('error', () => {
            videoUnavailable = true;
            mediaHint.textContent = 'Motion unavailable · tap for frame 2';
        });

        function activateMediaStage() {
            if (videoUnavailable) {
                mediaStage.classList.toggle('show-final');
                return;
            }
            if (mediaStage.classList.contains('show-final')) {
                mediaStage.classList.remove('show-final');
                videoStarted = false;
            }
            maybeStartVideo();
        }

        mediaStage.addEventListener('click', activateMediaStage);
        mediaStage.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                activateMediaStage();
            }
        });

        setTimeout(maybeStartVideo, 0);

        // --- BACKGROUND PRELOADER (+/- 2 Tracks) ---
        const preloadBuffer = {};
        
        function updatePreloadBuffer(index) {
            // Define the exact target window: 2 behind, 2 ahead
            const targets = [index - 2, index - 1, index + 1, index + 2]
                .filter(i => i >= 0 && i < playlist.length);
                
            // 1. Fetch new tracks into the invisible background buffer
            targets.forEach(i => {
                if (!preloadBuffer[i]) {
                    const bgAudio = new Audio();
                    bgAudio.src = playlist[i].file;
                    bgAudio.preload = 'auto'; // Forces browser to download/cache
                    preloadBuffer[i] = bgAudio;
                }
            });
            
            // 2. Clean up old tracks outside the +/- 2 window to save RAM
            Object.keys(preloadBuffer).forEach(key => {
                if (!targets.includes(parseInt(key))) {
                    preloadBuffer[key].src = ''; // Instantly kills the network request
                    delete preloadBuffer[key];
                }
            });
        }

        // --- KEYBOARD SHORTCUTS (J, K, L) ---
        document.addEventListener('keydown', (e) => {
            // Ignore keystrokes if the user holds Ctrl, Alt, or Cmd (e.g. Cmd+R to refresh)
            if (e.metaKey || e.ctrlKey || e.altKey) return;
            
            switch(e.key.toLowerCase()) {
                case 'j': // Previous
                    if (!btnPrev.disabled) btnPrev.click();
                    break;
                case 'l': // Next
                    if (!btnNext.disabled) btnNext.click();
                    break;
                case 'k': // Play/Pause
                    if (plActive.paused) {
                        plActive.play().catch(err => {});
                    } else {
                        plActive.pause();

                    break;

        // --- DUAL PLAYER LOGIC ---
        let isOverlapping = false;

        function updateUI(i) {
            if (i >= playlist.length) {
                st.innerText = 'Broadcast Ended';
                tsText.innerText = 'See you tomorrow!';
                tsVoice.innerText = '';
                lnkWrap.classList.remove('visible');
                btnNext.disabled = true;
                return;
            } 
            
            btnPrev.disabled = (i === 0);
            btnNext.disabled = (i >= playlist.length - 1);

            const t = playlist[i]; 
            st.innerText = 'Segment ' + (i + 1) + ' of ' + playlist.length;
            try { history.replaceState(null, '', '#section=' + (i + 1)); } catch (e) {}
            
            tsText.innerText = t.text;
            tsVoice.innerText = t.speaker;
            tsBox.className = 'transcript-box ' + t.voice;

            document.querySelectorAll('.chat-bubble').forEach((b, idx) => {
                if (idx === i) {
                    b.classList.add('active');
                    if (chatContainer.classList.contains('visible')) {
                        b.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                } else {
                    b.classList.remove('active');
                }
            });

            if (t.url) { 
                lnk.href = t.url; 
                if (t.summary) {
                    summ.innerText = t.summary;
                    summ.style.display = 'block';
                } else {
                    summ.style.display = 'none';
                }
                lnkWrap.classList.add('visible'); 
            } else { 
                lnkWrap.classList.remove('visible'); 
            } 
        }

        function attachPlayerLogic(playerIndex) {
            isOverlapping = false;

            plActive.ontimeupdate = () => {
                if (!isOverlapping && playerIndex < playlist.length - 1) {
                    const nextText = playlist[playerIndex + 1].text.trim();
                    if (nextText.startsWith('--')) {
                        if (plActive.duration && (plActive.duration - plActive.currentTime) <= OVERLAP_SECONDS) {
                            isOverlapping = true;
                            cur++;
                            updateUI(cur);
                            plStandby.src = playlist[cur].file;
                            plStandby.play().catch(e => {});
                        }
                    }
                }
            };

            plActive.onended = () => {
                if (isOverlapping) {
                    const temp = plActive;
                    plActive = plStandby;
                    plStandby = temp;

                    plActive.style.display = 'block';
                    plStandby.style.display = 'none';
                    attachPlayerLogic(cur);
                } else {
                    if (cur < playlist.length - 1) {
                        cur++;
                        updateUI(cur);
                        playNewTrack(cur);
                    }
                }
            };
        }

        function playNewTrack(i) {
            plActive.pause();
            plStandby.pause();
            
            // Trigger our background cache manager!
            updatePreloadBuffer(i);
            
            // Check if the file is already cached in our buffer
            if (preloadBuffer[i] && preloadBuffer[i].readyState === 4) {
                // If it is fully loaded in the background, assign it instantly
                plActive.src = preloadBuffer[i].src;
            } else {
                // Fallback normal loading
                plActive.src = playlist[i].file;
            }
            
            plActive.style.display = 'block';
            plStandby.style.display = 'none';
            plActive.play().catch(e => {});
            attachPlayerLogic(i);
        }

            overlay.id = 'sidebar-overlay';
            document.body.appendChild(overlay);

            const sidebar = document.createElement('div');
            sidebar.id = 'news-sidebar';
            sidebar.innerHTML = '<div class="sidebar-header"><h2>Archives</h2><button class="sidebar-close" id="news-close-btn">&times;</button></div>';
            
            const list = document.createElement('ul');
            list.className = 'sidebar-list';
            
            foldersArray.forEach(folderString => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `/projects/news/${folderString}/`;
                
                const parts = folderString.split('-');
                if (parts.length >= 4) {
                    const dateObj = new Date(`${parts[0]}-${parts[1]}-${parts[2]}T00:00:00`);
                    const suffix = parts.slice(3).join(' ').replace(/\b\w/g, c => c.toUpperCase());
                    a.innerText = `${dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })} - ${suffix}`;
                } else {
                    a.innerText = folderString;
                }
                
                li.appendChild(a);
                list.appendChild(li);
            });
            sidebar.appendChild(list);
            document.body.appendChild(sidebar);

            const btn = document.createElement('button');
            btn.id = 'news-menu-btn';
            btn.innerHTML = '&#9776; Menu';
            document.body.appendChild(btn);

            const closeBtn = document.getElementById('news-close-btn');
            const toggleMenu = () => {
                if (sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('open');
                    setTimeout(() => overlay.style.display = 'none', 300);
                } else {
                    overlay.style.display = 'block';
                    setTimeout(() => { sidebar.classList.add('open'); overlay.classList.add('open'); }, 10);
                }
            };
            btn.addEventListener('click', toggleMenu);
            closeBtn.addEventListener('click', toggleMenu);
            overlay.addEventListener('click', toggleMenu);
        }
        
        if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', initSidebarMenu); } 
        else { initSidebarMenu(); }
    </script>
</body>
</html>
