                .sidebar-header h2 { margin: 0; font-size: 1.1rem; color: #bb86fc; text-transform: uppercase; letter-spacing: 1px; }
                .sidebar-close { background: none; border: none; color: #888; font-size: 1.8rem; cursor: pointer; transition: 0.2s; line-height: 1; padding: 0; }
                .sidebar-close:hover { color: #fff; transform: scale(1.1); }
                .sidebar-list { list-style: none; padding: 0; margin: 0; }
                .sidebar-list li a { display: block; padding: 16px 20px; color: #ccc; text-decoration: none; border-bottom: 1px solid #222; transition: 0.2s; font-size: 0.95rem; }
                .sidebar-list li a:hover { background: #1e1e1e; padding-left: 26px; color: #bb86fc; border-left: 4px solid #bb86fc; }
                #sidebar-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.7); z-index: 1000; display: none; backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); opacity: 0; transition: opacity 0.3s; }
                #sidebar-overlay.open { display: block; opacity: 1; }
            `;
            document.head.appendChild(style);

            const overlay = document.createElement('div');
            overlay.id = 'sidebar-overlay';
            document.body.appendChild(overlay);

            const sidebar = document.createElement('div');
            sidebar.id = 'news-sidebar';
            sidebar.innerHTML = '<div class="sidebar-header"><h2>Archives</h2><button class="sidebar-close" id="news-close-btn">&times;</button></div>';
            
            const list = document.createElement('ul');
            list.className = 'sidebar-list';
            
            foldersArray.forEach(folderString => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `/projects/news/${folderString}/`;
                
                const parts = folderString.split('-');
                if (parts.length >= 4) {
                    const dateObj = new Date(`${parts[0]}-${parts[1]}-${parts[2]}T00:00:00`);
                    const suffix = parts.slice(3).join(' ').replace(/\b\w/g, c => c.toUpperCase());
                    a.innerText = `${dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })} - ${suffix}`;
                } else {
                    a.innerText = folderString;
                }
                
                li.appendChild(a);
                list.appendChild(li);
            });
            sidebar.appendChild(list);
            document.body.appendChild(sidebar);

            const btn = document.createElement('button');
            btn.id = 'news-menu-btn';
            btn.innerHTML = '&#9776; Menu';
            document.body.appendChild(btn);

            const closeBtn = document.getElementById('news-close-btn');
            const toggleMenu = () => {
                if (sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('open');
                    setTimeout(() => overlay.style.display = 'none', 300);
                } else {
                    overlay.style.display = 'block';
                    setTimeout(() => { sidebar.classList.add('open'); overlay.classList.add('open'); }, 10);
                }
            };
            btn.addEventListener('click', toggleMenu);
            closeBtn.addEventListener('click', toggleMenu);
            overlay.addEventListener('click', toggleMenu);
        }
        
        if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', initSidebarMenu); } 
        else { initSidebarMenu(); }
    </script>
</body>
</html>
