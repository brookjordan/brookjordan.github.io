    <script>
        const OVERLAP_SECONDS = 2;
        const playlist = [{"file":"intro.mp3","url":null,"text":"🎵 (sung) Droughts and AI are shifting the tide / Climate crises with nowhere to hide / Grab a pool float for the ride","voice":"intro","speaker":"Intro Theme","summary":"Intro"},{"file":"audio_0.mp3","url":null,"text":"Good evening everyone. I'm looking at the weather and it's a dry one, which is just great for my lawn but not so much for the rest of the country.","voice":4,"speaker":"Brett","summary":null},{"file":"audio_1.mp3","url":"https://www.bbc.co.uk/news/articles/ckg35n7yny3o?at_medium=RSS&at_campaign=rss","text":"It's actually wild how we're seeing these environmental shifts. I was looking at some data on drought patterns and it's almost like a systemic failure in our local irrigation logic... if you think about the way water distribution networks are mapped out, they often lack the dynamic rerouting capabilities that my autonomous fleet software uses to navigate urban obstacles...","voice":1,"speaker":"Brook","summary":"England Drought Warning"},{"file":"audio_2.mp3","url":"https://www.bbc.co.uk/news/articles/ckg35n7yny3o?at_medium=RSS&at_campaign=rss","text":"--Actually, Brook, it's more of a failure of foresight. The Environment Agency is declaring over half of England in drought because we've treated water as an infinite resource until the tap literally runs dry.","voice":2,"speaker":"Conrad","summary":"England Drought Warning"},{"file":"audio_3.mp3","url":"https://www.bbc.co.uk/news/articles/ckg35n7yny3o?at_medium=RSS&at_campaign=rss","text":"It reminds me of the 'Great Droughts' described in some of the more esoteric medieval chronicles where the lack of water was seen as a spiritual thinning of the veil. It’s very much like the concept of 'The Dryness' in certain mystical texts—a physical manifestation of a metaphysical void.","voice":3,"speaker":"Antony","summary":"England Drought Warning"},{"file":"audio_4.mp3","url":"https://www.bbc.co.uk/news/articles/ckg35n7yny3o?at_medium=RSS&at_campaign=rss","text":"I just think it means we need to stop watering the grass at noon. It's common sense.","voice":4,"speaker":"Brett","summary":"England Drought Warning"},{"file":"audio_5.mp3","url":"https://www.wired.com/story/best-festival-gear/","text":"Speaking of things we need to manage, I saw this list for festival-goers at Lost Lands and Electric Forest. They're pushing power banks and electrolytes as essentials...","voice":1,"speaker":"Brook","summary":"Festival Gear Guide"},{"file":"audio_6.mp3","url":"https://www.wired.com/story/best-festival-gear/","text":"It’s the modern pilgrimage, isn't it? We trade our comfort for a temporary community in the dirt.","voice":2,"speaker":"Conrad","summary":"Festival Gear Guide"},{"file":"audio_7.mp3","url":"https://www.wired.com/story/best-festival-gear/","text":"Exactly. It's the 'Communitas' of Victor Turner, but with more earplugs and less actual ritual sacrifice.","voice":3,"speaker":"Antony","summary":"Festival Gear Guide"},{"file":"audio_8.mp3","url":"https://www.wired.com/story/best-festival-gear/","text":"As long as they have a good blanket, I don't care what they call it. My kids would just want to know where the nearest bathroom is.","voice":4,"speaker":"Brett","summary":"Festival Gear Guide"},{"file":"audio_9.mp3","url":"https://www.wired.com/story/the-best-pool-accessories/","text":"And if you're staying home instead of heading to a festival, there's a list out for pool accessories for 2026. Apparently, cleaning robots and water monitors are the big upgrades.","voice":2,"speaker":"Conrad","summary":"Best Pool Accessories"},{"file":"audio_10.mp3","url":"https://www.wired.com/story/the-best-pool-accessories/","text":"I love those cleaning robots. The pathfinding logic on some of them is actually quite sophisticated... they have to deal with dynamic obstacles like floating toys or people's feet...","voice":1,"speaker":"Brook","summary":"Best Pool Accessories"},{"file":"audio_11.mp3","url":"https://www.wired.com/story/the-best-pool-accessories/","text":"--Brook, just tell me if it keeps the pool clean so I don't have to do it. That's all I need to know.","voice":4,"speaker":"Brett","summary":"Best Pool Accessories"},{"file":"audio_12.mp3","url":"https://www.wired.com/story/the-best-pool-accessories/","text":"There is something deeply ironic about using a robot to maintain a space for human leisure. It’s like the automated gardens of the Hanging Gardens—perfection through mechanical intervention.","voice":3,"speaker":"Antony","summary":"Best Pool Accessories"},{"file":"audio_13.mp3","url":"https://firstthings.com/to-live-fittingly/","text":"Moving on to some heavy stuff... there's an article about why the humanities are facing a hostile climate because academics have excluded ordinary readers...","voice":1,"speaker":"Brook","summary":"Humanities Climate Crisis"},{"file":"audio_14.mp3","url":"https://firstthings.com/to-live-fittingly/","text":"It’s the 'Ivory Tower' trope taken to its logical extreme. It echoes the isolation of certain monastic scholars who wrote for only their own kind, eventually losing the ability to speak to the world outside.","voice":3,"speaker":"Antony","summary":"Humanities Climate Crisis"},{"file":"audio_15.mp3","url":"https://firstthings.com/to-live-fittingly/","text":"It’s a gatekeeping mechanism. If you make it too complex for an intelligent layperson to understand, you ensure that only those with specific credentials can hold the keys to the narrative.","voice":2,"speaker":"Conrad","summary":"Humanities Climate Crisis"},{"file":"audio_16.mp3","url":"https://firstthings.com/to-live-fittingly/","text":"I just want people to be able to read a book without needing a PhD in linguistics first. It sounds like a lot of extra work for no reason.","voice":4,"speaker":"Brett","summary":"Humanities Climate Crisis"},{"file":"audio_17.mp3","url":"https://firstthings.com/the-summer-reading-list-2026/","text":"Which is interesting because the YouGov poll shows that forty percent of Americans didn't read a single book last year...","voice":1,"speaker":"Brook","summary":"Summer Reading Trends"},{"file":"audio_18.mp3","url":"https://firstthings.com/the-summer-reading-list-2026/","text":"A staggering lack of engagement. It’s like a modern-day 'Great Silence.' When people stop reading, they lose the ability to inhabit other minds.","voice":3,"speaker":"Antony","summary":"Summer Reading Trends"},{"file":"audio_19.mp3","url":"https://firstthings.com/the-summer-reading-list-2026/","text":"It's not just a lack of time; it's a shift in how we consume information. We're trading deep immersion for surface-level stimulation.","voice":2,"speaker":"Conrad","summary":"Summer Reading Trends"},{"file":"audio_20.mp3","url":"https://techcrunch.com/2026/07/29/fast-metals-is-treating-waste-with-more-waste-to-extract-critical-minerals/","text":"I saw some news about Fast Metals too. They’re trying to extract critical minerals from aluminum waste by treating it with more waste...","voice":1,"speaker":"Brook","summary":"Waste Mineral Extraction"},{"file":"audio_21.mp3","url":"https://techcrunch.com/2026/07/29/fast-metals-is-treating-waste-with-more-waste-to-extract-critical-minerals/","text":"It's a circular economy approach. Using the byproduct of one process as the feedstock for another to solve a waste problem.","voice":2,"speaker":"Conrad","summary":"Waste Mineral Extraction"},{"file":"audio_22.mp3","url":"https://techcrunch.com/2026/07/29/fast-metals-is-treating-waste-with-more-waste-to-extract-critical-minerals/","text":"As long as it works and they turn a profit, I'm all for it. We need more ways to deal with trash.","voice":4,"speaker":"Brett","summary":"Waste Mineral Extraction"},{"file":"audio_23.mp3","url":"https://techcrunch.com/2026/07/29/as-ai-content-floods-the-internet-pangram-raises-9m-to-detect-it/","text":"And on the tech side, Pangram just raised nine million dollars to detect AI content. They have a new model called Pangram 4...","voice":1,"speaker":"Brook","summary":"AI Detection Funding"},{"file":"audio_24.mp3","url":"https://techcrunch.com/2026/07/29/as-ai-content-floods-the-internet-pangram-raises-9m-to-detect-it/","text":"The 'Arms Race' of authenticity. As AI becomes more seamless, the tools to detect it become our only remaining defense for truth.","voice":2,"speaker":"Conrad","summary":"AI Detection Funding"},{"file":"audio_25.mp3","url":"https://techcrunch.com/2026/07/29/as-ai-content-floods-the-internet-pangram-raises-9m-to-detect-it/","text":"It’s like the 'Uncanny Valley' but for prose. We are entering an era where we can no longer trust the 'ghost in the machine' to be human.","voice":3,"speaker":"Antony","summary":"AI Detection Funding"},{"file":"audio_26.mp3","url":"https://www.aljazeera.com/news/2026/7/29/iran-hits-us-in-jordan-us-saudi-strikes-on-iraq-is-war-spreading?traffic_source=rss","text":"I also saw that Iran hit US forces in Jordan and there were strikes on Iraq... people are asking if war is spreading...","voice":1,"speaker":"Brook","summary":"Middle East Tensions"},{"file":"audio_27.mp3","url":"https://www.aljazeera.com/news/2026/7/29/iran-hits-us-in-jordan-us-saudi-strikes-on-iraq-is-war-spreading?traffic_source=rss","text":"It's a classic escalation cycle. These 'surprise attacks' are often the opening gambits in a much larger geopolitical chess match.","voice":2,"speaker":"Conrad","summary":"Middle East Tensions"},{"file":"audio_28.mp3","url":"https://www.aljazeera.com/news/2026/7/29/iran-hits-us-in-jordan-us-saudi-strikes-on-iraq-is-war-spreading?traffic_source=rss","text":"That’s just worrying stuff for the kids to hear about. I hope it stays contained.","voice":4,"speaker":"Brett","summary":"Middle East Tensions"},{"file":"audio_29.mp3","url":"https://www.aljazeera.com/news/2026/7/29/iran-hits-us-in-jordan-us-saudi-strikes-on-iraq-is-war-spreading?traffic_source=rss","text":"It feels like a recurring cycle of 'The Great Conflict' found in ancient apocalyptic literature—the inevitable friction between expanding powers.","voice":3,"speaker":"Antony","summary":"Middle East Tensions"},{"file":"audio_30.mp3","url":"https://www.theguardian.com/world/2026/jul/29/elephant-deaths-kenya-amboseli-national-park","text":"There’s also some news about Kenya investigating the deaths of fifteen elephants. They think it might be a toxic substance...","voice":1,"speaker":"Brook","summary":"Kenya Elephant Deaths"},{"file":"audio_31.mp3","url":"https://www.theguardian.com/world/2026/jul/29/elephant-deaths-kenya-amboseli-national-park","text":"A tragic ecological mystery. It highlights how quickly environmental toxins can move through an ecosystem.","voice":2,"speaker":"Conrad","summary":"Kenya Elephant Deaths"},{"file":"audio_32.mp3","url":"https://www.theguardian.com/world/2026/jul/29/elephant-deaths-kenya-amboseli-national-park","text":"That's awful. Those animals deserve better than some unknown poison in their water.","voice":4,"speaker":"Brett","summary":"Kenya Elephant Deaths"},{"file":"audio_33.mp3","url":"https://www.theguardian.com/world/2026/jul/29/elephant-deaths-kenya-amboseli-national-park","text":"It’s a modern tragedy of the commons. The giants of the forest falling to an invisible hand of human-made chemistry.","voice":3,"speaker":"Antony","summary":"Kenya Elephant Deaths"},{"file":"audio_34.mp3","url":"https://apnews.com/article/france-composer-kavinsky-death-498bad677bfc680731cdcf825228b902","text":"And we have some music news... Kavinsky, the French DJ who did 'Nightcall', passed away at fifty...","voice":1,"speaker":"Brook","summary":"Kavinsky Death News"},{"file":"audio_35.mp3","url":"https://apnews.com/article/france-composer-kavinsky-death-498bad677bfc680731cdcf825228b902","text":"The death of a creator is always a somber note. His work had that specific nocturnal atmosphere, almost like a modern-day requiem for the lonely city.","voice":3,"speaker":"Antony","summary":"Kavinsky Death News"},{"file":"audio_36.mp cy"},{"file":"audio_56.mp3","url":"https://www.theguardian.com/global-development/2026/jul/27/uganda-begins-emergency-food-handouts-after-19-die-from-hunger","text":"That is absolutely devastating. Drought and crop failure shouldn't lead to that kind of loss.","voice":4,"speaker":"Brett","summary":"Uganda Food Emergency"},{"file":"audio_57.mp3","url":"https://www.theguardian.com/global-development/2026/jul/27/uganda-begins-emergency-food-handouts-after-19-die-from-hunger","text":"It’s a stark reminder of the 'Famine' narratives in history—how environmental collapse leads directly to human suffering. It's a tragedy on a massive scale.","voice":3,"speaker":"Antony","summary":"Uganda Food Emergency"},{"file":"audio_58.mp3","url":"https://www.theguardian.com/global-development/2026/jul/27/uganda-begins-emergency-food-handouts-after-19-die-from-hunger","text":"The government move is necessary, but it highlights how precarious the global food supply chain remains in the face of climate change.","voice":2,"speaker":"Conrad","summary":"Uganda Food Emergency"},{"file":"audio_59.mp3","url":"https://www.aljazeera.com/sports/2026/7/29/american-asian-confederations-blindsided-by-fifas-world-cup-plan?traffic_source=rss","text":"And finally, we have some sports news... American and Asian confederations are blindsided by FIFA's World Cup plan...","voice":1,"speaker":"Brook","summary":"FIFA Investment Backlash"},{"file":"audio_60.mp3","url":"https://www.aljazeera.com/sports/2026/7/29/american-asian-confederations-blindsided-by-fifas-world-cup-plan?traffic_source=rss","text":"The 'Great Game' of international sports. It’s a classic trope of the powerful moving the pieces without consulting the local players.","voice":3,"speaker":"Antony","summary":"FIFA Investment Backlash"},{"file":"audio_61.mp3","url":"https://www.aljazeera.com/sports/2026/7/29/american-asian-confederations-blindsided-by-fifas-world-cup-plan?traffic_source=rss","text":"It's about due process and private investment. When big money enters the mix, the traditional governing bodies often get left in the dust.","voice":2,"speaker":"Conrad","summary":"FIFA Investment Backlash"},{"file":"audio_62.mp3","url":"https://www.aljazeera.com/sports/2026/7/29/american-asian-confederations-blindsided-by-fifas-world-cup-plan?traffic_source=rss","text":"I just hope they can figure it out so people can still enjoy the game without all the drama behind the scenes.","voice":4,"speaker":"Brett","summary":"FIFA Investment Backlash"}]; 
        let cur = 0; 
        
        let plActive = document.getElementById('pl1'); 
        let plStandby = document.getElementById('pl2'); 
        
        const st = document.getElementById('st'); 
        const btnPrev = document.getElementById('btn-prev');
        const btnNext = document.getElementById('btn-next');
        const lnkWrap = document.getElementById('lnk-wrap');
        const lnk = document.getElementById('lnk');
        const summ = document.getElementById('summ');
        const tsText = document.getElementById('ts-text');
        const tsVoice = document.getElementById('ts-voice');
        const tsBox = document.getElementById('ts-box');
        const imageSwap = document.getElementById('image-swap');
        
        const chatContainer = document.getElementById('full-chat');
        const toggleBtn = document.getElementById('toggle-chat');
        
        // --- COMPANION FRAME TOGGLE ---
        imageSwap.addEventListener('click', () => imageSwap.classList.toggle('show-alt'));
        imageSwap.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                imageSwap.classList.toggle('show-alt');
            }
        });

        // --- BACKGROUND PRELOADER (+/- 2 Tracks) ---
        const preloadBuffer = {};
        
        function updatePreloadBuffer(index) {
            // Define the exact target window: 2 behind, 2 ahead
            const targets = [index - 2, index - 1, index + 1, index + 2]
                .filter(i => i >= 0 && i < playlist.length);
                
            // 1. Fetch new tracks into the invisible background buffer
            targets.forEach(i => {
                if (!preloadBuffer[i]) {
                    const bgAudio = new Audio();
                    bgAudio.src = playlist[i].file;
                    bgAudio.preload = 'auto'; // Forces browser to download/cache
                    preloadBuffer[i] = bgAudio;
                }
            });
            
            // 2. Clean up old tracks outside the +/- 2 window to save RAM
            Object.keys(preloadBuffer).forEach(key => {
                if (!targets.includes(parseInt(key))) {
                    preloadBuffer[key].src = ''; // Instantly kills the network request
                    delete preloadBuffer[key];
                }
            });
        }

        // --- KEYBOARD SHORTCUTS (J, K, L) ---
        document.addEventListener('keydown', (e) => {
            // Ignore keystrokes if the user holds Ctrl, Alt, or Cmd (e.g. Cmd+R to refresh)
            if (e.metaKey || e.ctrlKey || e.altKey) return;
            
            switch(e.key.toLowerCase()) {
                case 'j': // Previous
                    if (!btnPrev.disabled) btnPrev.click();
                    break;
                case 'l': // Next
                    if (!btnNext.disabled) btnNext.click();
                    break;
                case 'k': // Play/Pause
                    if (plActive.paused) {
                        plActive.play().catch(err => {});
                    } else {
                        plActive.pause();
                    }
                    break;
            }
        });

        // --- CHAT BUBBLE GENERATION ---
        let lastTopic = null;
        let currentGroup = null;
        
        playlist.forEach((item, idx) => {
            const currentTopic = item.summary || "Banter & Hot Takes";
            
            if (currentTopic !== lastTopic) {
                currentGroup = document.createElement('div');
                currentGroup.className = 'topic-group';
                chatContainer.appendChild(currentGroup);
                
                const header = document.createElement('div');
                header.className = 'topic-header';
                header.innerText = currentTopic;
                currentGroup.appendChild(header);
                
                lastTopic = currentTopic;
            }

            const bubble = document.createElement('div');
            bubble.className = 'chat-bubble ' + item.voice;
            bubble.id = 'chat-msg-' + idx;
            bubble.innerHTML = '<div class="chat-label">' + item.speaker + '</div>' + item.text;
            
            bubble.onclick = () => {
                if (cur !== idx) {
                    cur = idx;
                    updateUI(cur);
                    playNewTrack(cur);
                }
            };
            currentGroup.appendChild(bubble);
        });

        // --- UI TOGGLES ---
        toggleBtn.onclick = () => {
            const isVis = chatContainer.classList.toggle('visible');
            toggleBtn.innerText = isVis ? 'Hide Transcript' : 'Show Full Transcript';
            tsBox.style.display = isVis ? 'none' : 'block';

            if (isVis) {
                const activeBubble = document.getElementById('chat-msg-' + cur);
                if (activeBubble) activeBubble.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        };

        btnPrev.onclick = () => { if (cur > 0) { cur--; updateUI(cur); playNewTrack(cur); } };
        btnNext.onclick = () => { if (cur < playlist.length - 1) { cur++; updateUI(cur); playNewTrack(cur); } };

        // --- DUAL PLAYER LOGIC ---
        let isOverlapping = false;

        function updateUI(i) {
            if (i >= playlist.length) {
                st.innerText = 'Broadcast Ended';
                tsText.innerText = 'See you tomorrow!';
                tsVoice.innerText = '';
                lnkWrap.classList.remove('visible');
                btnNext.disabled = true;
                return;
            } 
            
            btnPrev.disabled = (i === 0);
            btnNext.disabled = (i >= playlist.length - 1);

            const t = playlist[i]; 
            st.innerText = 'Segment ' + (i + 1) + ' of ' + playlist.length;
            try { history.replaceState(null, '', '#section=' + (i + 1)); } catch (e) {}
            
            tsText.innerText = t.text;
            tsVoice.innerText = t.speaker;
            tsBox.className = 'transcript-box ' + t.voice;

            document.querySelectorAll('.chat-bubble').forEach((b, idx) => {
                if (idx === i) {
                    b.classList.add('active');
                    if (chatContainer.classList.contains('visible')) {
                        b.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                } else {
                    b.classList.remove('active');
                }
            });

            if (t.url) { 
                lnk.href = t.url; 
                if (t.summary) {
                    summ.innerText = t.summary;
                    summ.style.display = 'block';
                } else {
                    summ.style.display = 'none';
                }
                lnkWrap.classList.add('visible'); 
            } else { 
                lnkWrap.classList.remove('visible'); 
            } 
        }

        function attachPlayerLogic(playerIndex) {
            isOverlapping = false;

            plActive.ontimeupdate = () => {
                if (!isOverlapping && playerIndex < playlist.length - 1) {
                    const nextText = playlist[playerIndex + 1].text.trim();
                    if (nextText.startsWith('--')) {
                        if (plActive.duration && (plActive.duration - plActive.currentTime) <= OVERLAP_SECONDS) {
                            isOverlapping = true;
                            cur++;
                            updateUI(cur);
                            plStandby.src = playlist[cur].file;
                            plStandby.play().catch(e => {});
                        }
                    }
                }
            };

            plActive.onended = () => {
                if (isOverlapping) {
                    const temp = plActive;
                    plActive = plStandby;
                    plStandby = temp;

                    plActive.style.display = 'block';
                    plStandby.style.display = 'none';
                    attachPlayerLogic(cur);
                } else {
                    if (cur < playlist.length - 1) {
                        cur++;
                        updateUI(cur);
                        playNewTrack(cur);
                    }
                }
            };
        }

        function playNewTrack(i) {
            plActive.pause();
            plStandby.pause();
            
            // Trigger our background cache manager!
            updatePreloadBuffer(i);
            
            // Check if the file is already cached in our buffer
            if (preloadBuffer[i] && preloadBuffer[i].readyState === 4) {
                // If it is fully loaded in the background, assign it instantly
                plActive.src = preloadBuffer[i].src;
            } else {
                // Fallback normal loading
                plActive.src = playlist[i].file;
            }
            
            plActive.style.display = 'block';
            plStandby.style.display = 'none';
            plActive.play().catch(e => {});
            attachPlayerLogic(i);
        }

        cur = (function () { var m = (location.hash || '').match(/(d+)/); if (m) { var i = parseInt(m[1], 10) - 1; if (i >= 0 && i < playlist.length) return i; } return 0; })();
        updateUI(cur);
        playNewTrack(cur);

            };
            btn.addEventListener('click', toggleMenu);
            closeBtn.addEventListener('click', toggleMenu);
            overlay.addEventListener('click', toggleMenu);
        }
        
        if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', initSidebarMenu); } 
        else { initSidebarMenu(); }
    </script>
</body>
</html>
