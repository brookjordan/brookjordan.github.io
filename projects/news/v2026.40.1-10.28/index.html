        const playlist = [{"file":"https://assets.brook.dev/podcasts/v2026.40.1-10.28/intro.wav","url":null,"text":"Intro song\n\n[Intro - Pulsing synth bass with a steady kick drum]\n\n[Verse]\nShadows stretch across the Persian line\nA heavy weight in the gears of time.\nWhile in the halls of glass and code,\nWe build the minds that carry our load.\n\n[Chorus]\nWho owns the ghost? Who draws the bound?\nFrom the profit margins to the hollow ground.\nBuilding a nation, or just a brand?\nThe future is shifting like desert sand.","voice":"intro","speaker":"Intro Theme","summary":"Intro"},{"file":"https://assets.brook.dev/podcasts/v2026.40.1-10.28/audio_0.mp3","url":"https://www.aljazeera.com/news/liveblog/2026/9/28/iran-war-live-tehran-warns-its-fully-prepared-for-war-amid-hormuz-tensions?traffic_source=rss","text":"I was just looking at the tensions in the Strait of Hormuz... it feels like we're watching a very high-stakes game of 'who can blink first' with some incredibly dangerous hardware involved.","voice":1,"speaker":"Brook","summary":"Iran War Tensions"},{"file":"https://assets.brook.dev/podcasts/v2026.40.1-10.28/audio_1.mp3","url":"https://www.aljazeera.com/news/liveblog/2026/9/28/iran-war-live-tehran-warns-its-fully-prepared-for-war-amid-hormuz-tensions?traffic_source=rss","text":"It’s that classic geopolitical stalemate, isn't it? The rhetoric from Tehran about being 'fully prepared' is the standard move when a diplomatic roadmap—like that seven-day one Washington just tossed aside—gets rejected.","voice":3,"speaker":"Antony","summary":"Iran War Tensions"},{"file":"https://assets.brook.dev/podcasts/v2026.40.1-10.28/audio_2.mp3","url":"https://www.aljazeera.com/news/liveblog/2026/9/28/iran-war-live-tehran-warns-its-fully-prepared-for-war-amid-hormuz-tensions?traffic_source=rss","text":"Exactly. It’s the technical reality of maritime chokepoints... if you can block the flow, you hold the cards, but it puts everyone in a very precarious position.","voice":1,"speaker":"Brook","summary":"Iran War Tensions"},{"file":"https://assets.brook.dev/podcasts/v2026.40.1-10.28/audio_3.mp3","url":"https://www.aljazeera.com/news/liveblog/2026/9/28/iran-war-live-tehran-warns-its-fully-prepared-for-war-amid-hormuz-tensions?traffic_source=rss","text":"And now we're seeing that 'preparedness' move from words to actual posturing. It’s a tense start to the day.","voice":3,"speaker":"Antony","summary":"Iran War Tensions"},{"file":"https://assets.brook.dev/podcasts/v2026.40.1-10.28/audio_4.mp3","url":null,"text":"I'm Brook.","voice":1,"speaker":"Brook","summary":null},{"file":"https://assets.brook.dev/podcasts/v2026.40.1-10.28/audio_5.mp3","url":null,"text":"And I'm Antony. On today's episode of Patch Notes, we're looking at the friction between diplomacy and defense, some heavy-hitting tech news, and a few stories about how we navigate our world—from global politics to the literal boundaries of nations.","voice":3,"speaker":"Antony","summary":null},{"file":"https://assets.brook.dev/podcasts/v2026.40.1-10.28/audio_6.mp3","url":"https://www.aljazeera.com/news/liveblog/2026/9/28/iran-war-live-tehran-warns-its-fully-prepared-for-war-amid-hormuz-tensions?traffic_source=rss","text":"So, back to that Iran situation... Washington's rejection of that seven-day roadmap is what really seems to have triggered this 'fully prepared' stance from Tehran.","voice":3,"speaker":"Antony","summary":"Iran War Tensions"},{"file":"https://assets.brook.dev/podcasts/v2026.40.1-10.28/audio_7.mp3","url":"https://www.aljazeera.com/news/liveblog/2026/9/28/iran-war-live-tehran-warns-its-fully-prepared-for-war-amid-hormuz-tensions?traffic_source=rss","text":"Right, it’s a classic engineering problem in diplomacy—you try to find a stable state, but if the other side feels the proposed solution doesn't address their core constraints, they default back to the most aggressive posture possible.","voice":1,"speaker":"Brook","summary":"Iran War Tensions"},{"file":"https://assets.br             list.className = 'sidebar-list';
            
            foldersArray.forEach(folderString => {
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `/projects/news/${folderString}/`;
                
                const parts = folderString.split('-');
                if (parts.length >= 4) {
                    const dateObj = new Date(`${parts[0]}-${parts[1]}-${parts[2]}T00:00:00`);
                    const suffix = parts.slice(3).join(' ').replace(/\b\w/g, c => c.toUpperCase());
                    a.innerText = `${dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })} - ${suffix}`;
                } else {
                    a.innerText = folderString;
                }
                
                li.appendChild(a);
                list.appendChild(li);
            });
            sidebar.appendChild(list);
            document.body.appendChild(sidebar);

            const btn = document.createElement('button');
            btn.id = 'news-menu-btn';
            btn.innerHTML = '&#9776; Menu';
            document.body.appendChild(btn);

            const closeBtn = document.getElementById('news-close-btn');
            const toggleMenu = () => {
                if (sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                    overlay.classList.remove('open');
                    setTimeout(() => overlay.style.display = 'none', 300);
                } else {
                    overlay.style.display = 'block';
                    setTimeout(() => { sidebar.classList.add('open'); overlay.classList.add('open'); }, 10);
                }
            };
            btn.addEventListener('click', toggleMenu);
            closeBtn.addEventListener('click', toggleMenu);
            overlay.addEventListener('click', toggleMenu);
        }
        
        if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', initSidebarMenu); } 
        else { initSidebarMenu(); }
    </script>
</body>
</html>
