s the Volt Typhoon stuff... they're simulating cyberattacks on critical systems. It’s a massive shift from just stealing data to actually being able to disrupt physical reality.","voice":1,"speaker":"Brook","summary":"China Infrastructure Cyberattacks"},{"file":"https://assets.brook.dev/podcasts/v2026.34.5-05.14/audio_8.mp3","url":"https://www.wired.com/story/china-is-strapping-digital-bombs-to-civilian-infrastructure-is-the-us-ready/","text":"It makes you wonder if the West is actually ready for that level of persistence in the network.","voice":2,"speaker":"Conrad","summary":"China Infrastructure Cyberattacks"},{"file":"https://assets.brook.dev/podcasts/v2026.34.5-05.14/audio_9.mp3","url":"https://www.wired.com/story/silicon-valley-doesnt-get-why-you-hate-ai/","text":"The disconnect is huge. Silicon Valley leaders seem to be posting through the public's gripes about AI without really understanding why people are so uneasy with it.","voice":1,"speaker":"Brook","summary":"Silicon Valley AI Rift"},{"file":"https://assets.brook.dev/podcasts/v2026.34.5-05.14/audio_10.mp3","url":"https://openai.com/index/introducing-ai-futures","text":"They see the utility; the public sees the risk. OpenAI is trying to bridge that slightly by exploring 'AI Futures'—looking at how this reshapes power and individual freedom.","voice":2,"speaker":"Conrad","summary":"OpenAI AI Futures Blog"},{"file":"https://assets.brook.dev/podcasts/v2026.34.5-05.14/audio_11.mp3","url":"https://openai.com/index/stampli","text":"It’s a necessary conversation. On the practical side, companies like Stampli are already using ChatGPT Work to compress weeks of launch production into just days.","voice":1,"speaker":"Brook","summary":"Stampli Uses ChatGPT Work"},{"file":"https://assets.brook.dev/podcasts/v2026.34.5-05.14/audio_12.mp3","url":"https://openai.com/index/introducing-ai-futures","text":"Efficiency is the goal, but we have to watch the governance side too.","voice":2,"speaker":"Conrad","summary":"OpenAI o_23.mp3","url":"https://apnews.com/article/braves-white-sox-holmes-no-hitter-5831e1df8d6fedfb642c740861ffd7f1","text":"And for the sports fans, Grant Holmes lost his no-hit bid in the seventh inning against the White Sox yesterday.","voice":1,"speaker":"Brook","summary":"Braves No-Hit Bid Ends"},{"file":"https://assets.brook.dev/podcasts/v2026.34.5-05.14/audio_24.mp3","url":"https://apnews.com/article/new-york-capitol-terrorism-bomb-plot-9abab713194d0c6e6c1e693fd9088d42","text":"A bit of a letdown for the Braves. Then there's some heavy news from New York—a woman was charged in a plot to set off explosives at the state Capitol to kill lawmakers.","voice":2,"speaker":"Conrad","summary":"New York Capitol Plot"},{"file":"https://assets.brook.dev/podcasts/v2026.34.5-05.14/audio_25.mp3","url":"https://apnews.com/article/new-york-capitol-terrorism-bomb-plot-9abab713194d0c6e6c1e693fd9088d42","text":"That is terrifying. It’s a stark reminder of the security challenges facing government buildings.","voice":1,"speaker":"Brook","summary":"New York Capitol Plot"},{"file":"https://assets.brook.dev/podcasts/v2026.34.5-05.14/audio_26.mp3","url":"https://www.bbc.co.uk/news/articles/c87n90eg0p2o?at_medium=RSS&at_campaign=rss","text":"The US Treasury Secretary also said sanctions will 'squash' Iran's economy and 'collapse' its regime, basically telling allies they need to pick a side.","voice":2,"speaker":"Conrad","summary":"U.S. Iran Sanctions"},{"file":"https://assets.brook.dev/podcasts/v2026.34.5-05.14/audio_27.mp3","url":"https://www.bbc.co.uk/news/articles/c998evlgz8ko?at_medium=RSS&at_campaign=rss","text":"That’s some very direct rhetoric. Meanwhile, the UK, France, Germany, Italy, and Canada are all condemning Israel's West Bank settlement project together.","voice":1,"speaker":"Brook","summary":"West Bank Settlement Condemnation"},{"file":"https://assets.brook.dev/podcasts/v2026.34.5-05.14/audio_28.mp3","url":"https://firstthings.com/the-fourth-watch-2/","text":"It's a lot of international pressure on one issue. We also had 'The Fourth Watch' episode with James F. Keating recently.","voice":2,"speaker":"Conrad","summary":"The Fourth Watch"},{"file":"https://assets.brook.dev/podcasts/v2026.34.5-05.14/audio_29.mp3","url":"https://firstthings.com/the-douthat-decade/","text":"And the discussion on 'The Douthat Decade' for those following that niche.","voice":1,"speaker":"Brook","summary":"The Douthat Decade"},{"file":"https://assets.brook.dev/podcasts/v2026.34.5-05.14/audio_30.mp3","url":"https://www.theguardian.com/world/2026/aug/20/gold-mine-collapse-deadly-landslide-central-african-republic","text":"Tragically, over 100 people died after a goldmine collapse in the Central African Republic. The landslide caused it, and they expect the toll to rise.","voice":2,"speaker":"Conrad","summary":"CAR Goldmine Collapse"},{"file":"https://assets.brook.dev/podcasts/v2026.34.5-05.14/audio_31.mp3","url":"https://www.wsj.com/business/media/disneys-abc-sues-fcc-over-challenge-to-its-broadcast-licenses-64e8f794?st=XTL4tA","text":"That's devastating. To wrap up the tech legal stuff, Disney’s ABC is suing the FCC over broadcast license challenges, while Apple gave a bit of a 'middle finger' to the DOJ regarding their July discovery win.","voice":1,"speaker":"Brook","summary":"ABC Sues FCC"},{"file":"https://assets.brook.dev/podcasts/v2026.34.5-05.14/audio_32.mp3","url":"https://9to5mac.com/2026/08/17/apple-dojs-latest-challenge-in-antitrust-case-fails-at-every-level/","text":"It seems like the legal battles are just as intense as the engineering ones these days.","voice":2,"speaker":"Conrad","summary":"Apple DOJ Legal Win"}]};

function refreshNote() {
  if (cur === 0) {
    mvNote.textContent = playlist.length > 1 ? 'The music video opens the episode; the news follows when it ends.' : '';
  } else {
    mvNote.textContent = mv.paused ? 'The news is playing. You can play the video alongside it, with or without its sound.' : (mv.muted ? 'Video playing without sound.' : 'Video playing with its sound.');
  }
}

function currentLyric() {
  if (!lyricsTrack || !lyricsTrack.activeCues || !lyricsTrack.activeCues.length) return '';
  return Array.from(lyricsTrack.activeCues).map((c) => c.text).join('\n');
}

function updateUI(i) {
  btnPrev.disabled = i === 0;
  btnNext.disabled = i >= playlist.length - 1;
  const t = playlist[i];
  st.textContent = 'Segment ' + (i + 1) + ' of ' + playlist.length + (i === 0 ? ' · music video' : '');
  try { history.replaceState(null, '', '#section=' + (i + 1)); } catch (e) {}
  tsVoice.textContent = t.speaker;
  tsText.textContent = i === 0 ? (currentLyric() || '♪ ' + EP.songTitle) : t.text;
  tsBox.style.borderLeftColor = colourFor(t);
  document.querySelectorAll('.chat-bubble').forEach((b, idx) => {
    b.classList.toggle('active', idx === i);
    if (idx === i && chatContainer.classList.contains('visible')) b.scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  if (t.url) {
    lnk.href = t.url;
    summ.textContent = t.summary || '';
    lnkWrap.classList.add('visible');
  } else {
    lnkWrap.classList.remove('visible');
  }
  refreshNote();
}

const preload = {};
function preloadAround(i) {
  const targets = [i + 1, i + 2].filter((n) => n > 0 && n < playlist.length);
  targets.forEach((n) => { if (!preload[n]) { const a = new Audio(); a.preload = 'auto'; a.src = playlist[n].file; preload[n] = a; } });
  Object.keys(preload).forEach((k) => { if (!targets.includes(+k)) { preload[k].src = ''; delete preload[k]; } });
}

function stopAudio() { plActive.pause(); plStandby.pause(); }

function attachPlayerLogic(idx) {
  isOverlapping = false;
  plActive.ontimeupdate = () => {
    if (isOverlapping || idx >= playlist.length - 1) return;
    if (playlist[idx + 1].text.trim().startsWith('--') && plActive.duration && plActive.duration - plActive.currentTime <= 2) {
      isOverlapping = true;
      cur++;
      updateUI(cur);
      plStandby.src = playlist[cur].file;
      plStandby.play().catch(() => {});
    }
  };
  plActive.onended = () => {
    if (isOverlapping) {
      const tmp = plActive; plActive = plStandby; plStandby = tmp;
      plActive.style.display = 'block'; plStandby.style.display = 'none';
      attachPlayerLogic(cur);
    } else if (cur < playlist.length - 1) {
      go(cur + 1);
    } else {
      st.textContent = 'Broadcast ended';
    }
  };
}

function go(i, opts) {
  const autoplay = !opts || opts.autoplay !== false;
  cur = i;
  updateUI(i);
  if (i === 0) {
    stopAudio();
    plActive.style.display = 'none';
    plStandby.style.display = 'none';
    setLyrics(true);
    mv.muted = false;
    if (!mv.paused || mv.ended || mv.currentTime > 0) mv.currentTime = 0;
    if (autoplay) mv.play().catch(() => { mvNote.textContent = 'Press play on the video to start.'; });
    refreshSoundButton();
    return;
  }
  // Leaving the song for the news: stop the song, hide its lyrics, and mute the video so it can be
  // played alongside the news without the two soundtracks clashing until the listener asks.
  setLyrics(false);
  if (!mv.paused) mv.pause();
  mv.muted = true;
  refreshSoundButton();
  stopAudio();
  preloadAround(i);
  plActive.src = playlist[i].file;
  plActive.style.display = 'block';
  plStandby.style.display = 'none';
  if (autoplay) plActive.play().catch(() => {});
  attachPlayerLogic(i);
}

mv.addEventListener('ended', () => {
  if (cur === 0 && playlist.length > 1) go(1);
  refreshNote();
});
mv.addEventListener('play', () => {
  if (cur === 0) stopAudio();
  refreshNote();
});
mv.addEventListener('pause', refreshNote);
mv.addEventListener('volumechange', () => { refreshSoundButton(); refreshNote(); });
mvSound.addEventListener('click', () => { mv.muted = !mv.muted; });
if (lyricsTrack) lyricsTrack.addEventListener('cuechange', () => { if (cur === 0) tsText.textContent = currentLyric() || '♪ ' + EP.songTitle; });

btnPrev.onclick = () => { if (cur > 0) go(cur - 1); };
btnNext.onclick = () => { if (cur < playlist.length - 1) go(cur + 1); };

document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.target && /^(INPUT|TEXTAREA|BUTTON|VIDEO|AUDIO)$/.test(e.target.tagName) && e.key === ' ') return;
  const k = e.key.toLowerCase();
  if (k === 'j' && !btnPrev.disabled) btnPrev.click();
  if (k === 'l' && !btnNext.disabled) btnNext.click();
  if (k === 'k') {
    const p = cur === 0 ? mv : plActive;
    if (p.paused) p.play().catch(() => {}); else p.pause();
  }
});

let lastTopic = null;
let group = null;
playlist.forEach((item, idx) => {
  const topic = item.summary || 'Banter and hot takes';
  if (topic !== lastTopic) {
    group = document.createElement('div');
    const h = document.createElement('div');
    h.className = 'topic-header'; h.textContent = topic;
    group.appendChild(h);
    chatContainer.appendChild(group);
    lastTopic = topic;
  }
  const b = document.createElement('div');
  b.className = 'chat-bubble';
  b.style.setProperty('--c', colourFor(item));
  const label = document.createElement('div');
  label.className = 'chat-label'; label.textContent = item.speaker;
  b.appendChild(label);
  b.appendChild(document.createTextNode(item.text));
  b.onclick = () => go(idx);
  group.appendChild(b);
});

toggleBtn.onclick = () => {
  const vis = chatContainer.classList.toggle('visible');
  toggleBtn.textContent = vis ? 'Hide transcript' : 'Show full transcript';
  tsBox.style.display = vis ? 'none' : 'block';
};

const startAt = (() => { const m = (location.hash || '').match(/section=(\d+)/); const n = m ? parseInt(m[1], 10) - 1 : 0; return n >= 0 && n < playlist.length ? n : 0; })();
setLyrics(startAt === 0);
go(startAt);
refreshSoundButton();

async function initMenu() {
  try {
    const r = await fetch('/projects/news/menu-data.json');
    if (!r.ok) return;
    const folders = await r.json();
    const at = folders.indexOf(FOLDER);
    if (at >= 0) {
      const older = folders[at + 1];
      const newer = at > 0 ? folders[at - 1] : null;
      const o = document.getElementById('podcast-older');
      const n = document.getElementById('podcast-newer');
      if (older) { o.href = '/projects/news/' + older + '/'; o.textContent = '← Older · ' + older; o.classList.remove('disabled'); o.removeAttribute('aria-disabled'); }
      if (newer) { n.href = '/projects/news/' + newer + '/'; n.textContent = 'Newer · ' + newer + ' →'; n.classList.remove('disabled'); n.removeAttribute('aria-disabled'); }
    }
    const overlay = document.createElement('div'); overlay.id = 'sidebar-overlay'; document.body.appendChild(overlay);
    const sidebar = document.createElement('div'); sidebar.id = 'news-sidebar';
    sidebar.innerHTML = '<div class="sidebar-header"><h2>Archives</h2><button class="sidebar-close" id="news-close-btn" aria-label="Close">&times;</button></div>';
    const list = document.createElement('ul'); list.className = 'sidebar-list';
    folders.forEach((f) => { const li = document.createElement('li'); const a = document.createElement('a'); a.href = '/projects/news/' + f + '/'; a.textContent = f; li.appendChild(a); list.appendChild(li); });
    sidebar.appendChild(list); document.body.appendChild(sidebar);
    const btn = document.createElement('button'); btn.id = 'news-menu-btn'; btn.innerHTML = '&#9776; Menu'; document.body.appendChild(btn);
    const toggle = () => { const open = !sidebar.classList.contains('open'); sidebar.classList.toggle('open', open); overlay.classList.toggle('open', open); };
    btn.addEventListener('click', toggle);
    overlay.addEventListener('click', toggle);
    document.getElementById('news-close-btn').addEventListener('click', toggle);
  } catch (e) { console.error('Menu failed:', e); }
}
initMenu();
</script>
</body>
