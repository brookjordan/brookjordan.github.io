<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>JorNgô bedroom light switch</title>
	<link rel="stylesheet" href="./index--app.css">
</head>
<body>
	<div class="app">
		<div class="app__screen">
			<div class="lights">
				<h3>Lights</h3>
				<button class="lights__button--ceiling chunky-button">
					<h4>Toggle ceiling</h4>
				</button>
			</div>

			<div class="clothes">
				<h3>Clothes</h3>
				<button class="clothes__button--alert chunky-button">
					<h4>Done alert</h4>
				</button>
				<div class="clothes__value--washer screen-value">
					<h4>Wash</h4>
				</div>
				<div class="clothes__value--drier screen-value">
					<h4>Dry</h4>
				</div>
			</div>

			<div class="drawer">
				<h3>Weather</h3>
			</div>
		</div>
	</div>

	<script type="module" src="./index.js"></script>
</body>
</html>
