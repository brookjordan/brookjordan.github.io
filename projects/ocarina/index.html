<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href=".icons/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16x16.png" />
  <link rel="manifest" href="./icons/site.webmanifest" />
  <link rel="mask-icon" href="./icons/safari-pinned-tab.svg" color="#ceb3a1" />
  <meta name="msapplication-TileColor" content="#ceb3a1" />
  <meta name="theme-color" content="#ceb3a1" />
  <title>Ocarina tabs</title>

  <style>
    * {
      box-sizing: border-box;
    }

    #main {
      white-space: nowrap;
    }

    #stave {
      display: grid;
      grid-template-columns: repeat(var(--column-count), 1fr);
      font-size: calc(var(--column-count) * 0.2vmin);
    }

    #stave>* {
      display: grid;
      overflow: hidden;
      padding: clamp(3px, calc(3vmin - 30px), 36px) clamp(2px, calc(2vmin - 20px), 24px);
      font-size: clamp(16px, calc(1.5vmin / (6 / var(--column-count))), 24px);
      min-width: 40px;
    }

    #stave img,
    #stave svg {
      height: auto;
    }

    .line-start {
      grid-column: 1;
    }

    p {
      text-align: center;
      margin: 0;
    }
  </style>
</head>

<body>
  <main id="main" style="--c-ocarina: hsl(24 31.5% 72%)"></main>

  <script src="./songs.js"></script>

  <script>
    "use strict";
    const availableNotes = [
      "C5",
      "D♭5",
      "D5",
      "E♭5",
      "E5",
      "F5",
      "G♭5",
      "G5",
      "A♭5",
      "A5",
      "B♭5",
      "B5",
      "C6",
      "D♭6",
      "D6",
      "E♭6",
      "E6",
      "F6",
    ];
    let noteImages = {};
    const noteImagesPromise = Promise.all(
      [...availableNotes, "blank", "broken"].map(async (svgName) => {
        const response = await fetch(
          `./i/${svgName.replace("♯", "%23")}.svg`
        );
        const svgString = await response.text();
        const container = document.createElement("div");
        container.innerHTML = svgString;
        const svgElement = container.querySelector("svg");
        if (svgElement) {
          noteImages[svgName] = svgElement;
        }
      })
    );
    (async () => {
      await noteImagesPromise;
      renderSong();
    })();
    const mainElement = document.querySelector("#main");
    const staveElement = document.createElement("div");
    staveElement.id = "stave";
    const songs = availableSongs;
    function songFromUrl() {
      const fromQuery = new URLSearchParams(location.search).get("song");
      const fromHash = location.hash.replace(/^#/, "");
      const raw = fromQuery || (fromHash ? decodeURIComponent(fromHash) : "");
      if (!raw) return null;
      if (songs[raw]) return raw;
      return (
        Object.keys(songs).find(
          (name) => name.toLowerCase() === raw.toLowerCase()
        ) || null
      );
    }
    function syncSongToUrl(name) {
      const url = new URL(location.href);
      url.searchParams.set("song", name);
      url.hash = "";
      history.replaceState(null, "", url);
    }
    const songFromLocation = songFromUrl();
    let selectedSongName = songFromLocation || Object.keys(songs)[0];
    if (songFromLocation) syncSongToUrl(songFromLocation);
    let userTransposeOffset = 0;
    const statusElement = document.createElement("div");
    const controlsElement = document.createElement("div");
    const formatOffset = (value) => `${value > 0 ? "+" : ""}${value}`;

    function computeLayout() {
      const song = songs[selectedSongName];
      const maxAllowedNoteNumber = availableNotes.length - 1;
      const numberedNotes = song.filter((note) => typeof note === "number");
      const maxNote = Math.max(...numberedNotes);
      const minNote = Math.min(...numberedNotes);
      const rangeDifference = maxNote - minNote - maxAllowedNoteNumber;
      const outOfRangeBy = Math.max(0, rangeDifference);
      const distanceOver = Math.max(0, maxNote - maxAllowedNoteNumber);
      const distanceUnder = Math.abs(Math.min(0, minNote));
      let baseOffset = 0;
      let errorMessage = "";
      if (maxNote - minNote > availableNotes.length - 1) {
        errorMessage = `Song out of range by ${outOfRangeBy} semitones`;
      }
      if (distanceOver || distanceUnder) {
        baseOffset = distanceUnder ? distanceUnder : -distanceOver;
      }
      const fittedMin = minNote + baseOffset;
      const fittedMax = maxNote + baseOffset;
      const minUserOffset = errorMessage ? 0 : -fittedMin;
      const maxUserOffset = errorMessage
        ? 0
        : maxAllowedNoteNumber - fittedMax;
      userTransposeOffset = Math.min(
        maxUserOffset,
        Math.max(minUserOffset, userTransposeOffset)
      );
      const totalOffset = baseOffset + userTransposeOffset;
      const reRangedSong = song.map((noteNumber) =>
        typeof noteNumber === "number" ? noteNumber + totalOffset : noteNumber
      );
      return {
        errorMessage,
        totalOffset,
        minUserOffset,
        maxUserOffset,
        reRangedSong,
      };
    }

    function renderStatus(errorMessage, totalOffset) {
      statusElement.innerHTML = "";
      if (errorMessage) {
        statusElement.append(`Error: ${errorMessage}`);
        statusElement.append(document.createElement("br"));
      }
      if (totalOffset) {
        statusElement.append(
          `Transposed ${totalOffset > 0 ? "up" : "down"} by ${Math.abs(
            totalOffset
          )}`
        );
        statusElement.append(document.createElement("br"));
      }
    }

    function renderStave(reRangedSong) {
      staveElement.innerHTML = "";
      let lineStart = true;
      let lineLength = 0;
      let maxLineLength = 0;
      reRangedSong.forEach((number) => {
        lineLength += 1;
        if (number === "|") {
          lineStart = true;
          lineLength = 0;
          return;
        }
        maxLineLength = Math.max(maxLineLength, lineLength);
        const wrapper = document.createElement("div");
        wrapper.classList.add("note");
        if (lineStart) {
          lineStart = false;
          wrapper.classList.add("line-start");
        }
        const label = document.createElement("p");
        const note =
          typeof number === "number" ? availableNotes[number] : null;
        const svg =
          noteImages[
            note === undefined ? "broken" : note === null ? "blank" : note
          ].cloneNode(true);
        label.textContent =
          note === undefined ? "?" : note === null ? "" : note;
        wrapper.append(label);
        wrapper.appendChild(svg);
        staveElement.append(wrapper);
      });
      staveElement.style.setProperty(
        "--column-count",
        maxLineLength.toString()
      );
    }

    function renderSong() {
      if (!mainElement) return;
      const {
        errorMessage,
        totalOffset,
        minUserOffset,
        maxUserOffset,
        reRangedSong,
      } = computeLayout();

      mainElement.innerHTML = "";
      controlsElement.innerHTML = "";
      renderStatus(errorMessage, totalOffset);

      const selectMenu = document.createElement("select");
      Object.keys(songs).forEach((songName) => {
        const option = document.createElement("option");
        option.textContent = songName;
        if (selectedSongName === songName) {
          option.selected = true;
        }
        selectMenu.append(option);
      });
      selectMenu.addEventListener("change", () => {
        selectedSongName = selectMenu.selectedOptions[0].value;
        userTransposeOffset = 0;
        syncSongToUrl(selectedSongName);
        renderSong();
      });
      controlsElement.append(selectMenu);
      controlsElement.append(document.createElement("br"));

      if (maxUserOffset > minUserOffset) {
        const transposeRow = document.createElement("label");
        transposeRow.style.display = "inline-flex";
        transposeRow.style.alignItems = "center";
        transposeRow.style.gap = "0.5rem";
        transposeRow.style.margin = "0.5rem 0";
        const transposeLabel = document.createElement("span");
        transposeLabel.textContent = `Shift ${formatOffset(
          userTransposeOffset
        )}`;
        const transposeSlider = document.createElement("input");
        transposeSlider.type = "range";
        transposeSlider.min = String(minUserOffset);
        transposeSlider.max = String(maxUserOffset);
        transposeSlider.step = "1";
        transposeSlider.value = String(userTransposeOffset);
        transposeSlider.setAttribute(
          "aria-label",
          `Transpose within ${maxUserOffset - minUserOffset} semitones`
        );
        const transposeBounds = document.createElement("span");
        transposeBounds.style.opacity = "0.7";
        transposeBounds.textContent = `(${formatOffset(
          minUserOffset
        )}…${formatOffset(maxUserOffset)})`;
        transposeSlider.addEventListener("input", () => {
          userTransposeOffset = Number(transposeSlider.value);
          transposeLabel.textContent = `Shift ${formatOffset(
            userTransposeOffset
          )}`;
          const layout = computeLayout();
          renderStatus(layout.errorMessage, layout.totalOffset);
          renderStave(layout.reRangedSong);
        });
        transposeRow.append(transposeLabel, transposeSlider, transposeBounds);
        controlsElement.append(transposeRow);
        controlsElement.append(document.createElement("br"));
      }

      mainElement.append(statusElement);
      mainElement.append(controlsElement);
      mainElement.append(staveElement);
      renderStave(reRangedSong);
    }
  </script>

  <div>
    <style>
      menu {
        padding: 0;
      }

      #base_color {
        appearance: none;
        padding: 0;
        border: 1px solid black;
        margin: 0;
        display: inline-block;
        vertical-align: middle;
        width: 200px;
        height: 44px;
        border-radius: 10px;
        overflow: hidden;
      }

      ::-webkit-color-swatch-wrapper {
        padding: 0;
      }

      ::color-swatch-wrapper {
        padding: 0;
      }
    </style>
    <menu>
      <label>
        <input type="color" value="#ceb3a1" id="base_color" />
        Ocarina colour
      </label>
    </menu>
    <script>
      function rgbToHsl(red, green, blue) {
        let max = Math.max(red, green, blue);
        let min = Math.min(red, green, blue);
        let [hue, sat, light] = [NaN, 0, (min + max) / 2];
        let d = max - min;

        if (d !== 0) {
          sat =
            light === 0 || light === 1
              ? 0
              : (max - light) / Math.min(light, 1 - light);

          switch (max) {
            case red:
              hue = (green - blue) / d + (green < blue ? 6 : 0);
              break;
            case green:
              hue = (blue - red) / d + 2;
              break;
            case blue:
              hue = (red - green) / d + 4;
          }

          hue = hue * 60;
        }

        return [hue || 0, sat * 100, light * 100];
      }

      base_color.addEventListener("change", () => {
        const rgb = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i
          .exec(base_color.value)
          .map((a) => parseInt(a, 16) / 255)
          .slice(1);
        const hsl = rgbToHsl(...rgb);
        stave.style.setProperty(
          "--c-ocarina",
          `hsl(${hsl[0]}deg ${hsl[1]}% ${hsl[2]}%)`
        );
      });
    </script>
  </div>
</body>

</html>
