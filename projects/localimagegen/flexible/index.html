      const files = Object.values(catalog).reduce(
        (acc, m) => acc + Object.values(m).reduce((s, subj) => s + Object.keys(subj).length, 0),
        0
      );
      const status = document.getElementById('status');
      status.classList.remove('error');
      if (!n) {
        status.textContent = 'No matching PNGs found.';
        status.classList.add('error');
        document.getElementById('empty').hidden = false;
        document.getElementById('modelList').innerHTML = '';
        return;
      }
      const subjects = allSubjects();
      status.textContent = `${n} models, ${files} images, ${subjects.length} subjects — samples: ${availableSamples.join(', ')} ${sourceLabel()}`;
      document.getElementById('empty').hidden = true;
      await render();
    }

    async function refresh(mode = 'auto') {
      const status = document.getElementById('status');
      status.classList.remove('error');
      status.textContent = 'Loading…';
      try {
        if (BAKED_FILES && mode !== 'picker') {
          loadFromBaked();
          await applyLoaded();
          return;
        }
        if (mode === 'picker') {
          await loadFromPicker();
        } else if (mode === 'handle' && dirHandle) {
          await loadFromDirHandle(dirHandle);
        } else if (loadSource === 'dropped' && fileMap.size) {
          const files = [...fileMap.values()];
          await loadFromDroppedFiles(files, droppedFolderName);
        } else if (loadSource === 'handle' && dirHandle) {
          await loadFromDirHandle(dirHandle);
        } else if (!(await loadFromManifest())) {
          await loadFromListing();
        }
        await applyLoaded();
      } catch (e) {
        status.textContent = e.message;
        status.classList.add('error');
        document.getElementById('empty').hidden = false;
      }
    }

    async function handleFolderDrop(dt) {
      await loadFromDataTransfer(dt);
      await applyLoaded();
    }

    function setupDragDrop(el, { highlightHeader = false } = {}) {
      const prevent = (e) => {
        e.preventDefault();
        e.stopPropagation();
      };

      el.addEventListener('dragenter', (e) => {
        prevent(e);
        el.classList.add('drag-over');
        if (highlightHeader) document.getElementById('dropZone').classList.add('drag-over');
      });

      el.addEventListener('dragover', (e) => {
        prevent(e);
        if (e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
      });

      el.addEventListener('dragleave', (e) => {
        prevent(e);
        const related = e.relatedTarget;
        if (!related || !el.contains(related)) {
          el.classList.remove('drag-over');
          if (highlightHeader) document.getElementById('dropZone').classList.remove('drag-over');
        }
      });

      el.addEventListener('drop', async (e) => {
        prevent(e);
        el.classList.remove('drag-over');
        if (highlightHeader) document.getElementById('dropZone').classList.remove('drag-over');
        const status = document.getElementById('status');
        status.textContent = 'Reading dropped folder…';
        try {
          await handleFolderDrop(e.dataTransfer);
        } catch (err) {
          status.textContent = err.message;
          status.classList.add('error');
        }
      });
    }

    document.getElementById('sample').addEventListener('input', (e) => {
      document.getElementById('sampleVal').textContent = e.target.value;
      render();
    });
    document.getElementById('modelSelect').addEventListener('change', () => {
      if (compareMode === 'samples') populateSampleFilter();
      render();
    });
    document.getElementById('seedSelect').addEventListener('change', (e) => {
      currentSeed = Number(e.target.value);
      render();
    });
    document.getElementById('promptSizeSelect').addEventListener('change', refreshPromptRow);
    document.getElementById('modelFilter').addEventListener('change', () => render());
    document.getElementById('sampleFilter').addEventListener('change', () => render());
    document.getElementById('showAllModels').addEventListener('click', () => {
      setModelSelection(Object.keys(catalog).sort());
      render();
    });
    document.getElementById('hideAllModels').addEventListener('click', () => {
      setModelSelection([]);
      render();
    });
    document.getElementById('showAllSamples').addEventListener('click', () => {
      setSampleSelection(availableSamples);
      render();
    });
    document.getElementById('hideAllSamples').addEventListener('click', () => {
      setSampleSelection([]);
      render();
    });
    document.getElementById('compareSelect').addEventListener('change', (e) => {
      compareMode = e.target.value;
      updateCompareControls();
      if (compareMode === 'samples') populateSampleFilter();
      syncCollapsedControlPlacement();
      render();
    });
    document.getElementById('timeSlider').addEventListener('input', (e) => {
      document.getElementById('timeVal').textContent = `${e.target.value}s`;
      render();
    });
    document.getElementById('refresh').addEventListener('click', () => refresh('auto'));
    document.getElementById('pickDir').addEventListener('click', () => refresh('picker'));

    const headerEl = document.getElementById('dropZone');
    const headerToggle = document.getElementById('headerToggle');
    const headerBarSliderSlot = document.getElementById('headerBarSliderSlot');
    const controlsSliderSlot = document.getElementById('controlsSliderSlot');
    const sampleSliderGroup = document.getElementById('sampleSliderGroup');
    const timeSliderGroup = document.getElementById('timeSliderGroup');
    const modelSelectGroup = document.getElementById('modelSelectGroup');
    const controlsEl = document.querySelector('#headerPanel .controls');

    // When collapsed, lift whichever control matters in the current mode into the
    // always-visible top bar: the sample slider when comparing models, the model
    // picker when comparing samples (so models can still be swapped while collapsed).
    function restoreControlHome(el) {
      if (el === sampleSliderGroup || el === timeSliderGroup) {
        if (el.parentElement !== controlsSliderSlot) controlsSliderSlot.appendChild(el);
      } else if (el === modelSelectGroup && controlsEl) {
        if (el.parentElement !== controlsEl) controlsEl.prepend(el);
      }
    }
    function syncCollapsedControlPlacement() {
      const collapsed = headerEl.classList.contains('collapsed');
      const primary = compareMode === 'samples' ? modelSelectGroup
        : compareMode === 'time' ? timeSliderGroup
        : sampleSliderGroup;
      for (const el of [sampleSliderGroup, timeSliderGroup, modelSelectGroup]) {
        if (el !== primary) restoreControlHome(el);
      }
      if (collapsed) {
        if (primary.parentElement !== headerBarSliderSlot) headerBarSliderSlot.appendChild(primary);
      } else {
        restoreControlHome(primary);
      }
    }

    headerToggle.addEventListener('click', () => {
      const collapsed = headerEl.classList.toggle('collapsed');
      headerToggle.setAttribute('aria-expanded', String(!collapsed));
      headerToggle.title = collapsed ? 'Show controls' : 'Hide controls';
      syncCollapsedControlPlacement();
    });
    if (window.matchMedia('(max-width: 640px)').matches) {
      headerEl.classList.add('collapsed');
      headerToggle.setAttribute('aria-expanded', 'false');
      headerToggle.title = 'Show controls';
    }
    syncCollapsedControlPlacement();

    setupDragDrop(document.getElementById('pickDir'));
    setupDragDrop(document.getElementById('dropZone'), { highlightHeader: true });

    document.body.addEventListener('dragover', (e) => e.preventDefault());
    document.body.addEventListener('drop', (e) => e.preventDefault());

    document.documentElement.classList.toggle('baked', !!BAKED_FILES);
    refresh('auto');

</script>
</body>
</html>
