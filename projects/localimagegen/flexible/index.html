<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <base href="../" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1d24" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Stage 2 model compare</title>
  <style>
/* Design tokens shared by the gallery (app.css) and the devlog (blog.css).
   This is the single source of truth for colour, radius, spacing and type.
   It is inlined ahead of each page's stylesheet at build time, and linked
   first in dev so opening the .html files directly still resolves the vars.

   Theming: everything below is a semantic token mapped onto a small palette of
   primitives. To add a theme, override the *semantic* tokens under a selector
   (see the commented [data-theme="light"] block at the bottom) — no stylesheet
   needs to change, only these variables. */
:root {
  color-scheme: dark;

  /* ---- palette primitives (raw colours; reference these only via the tokens below) ---- */
  --c-ink-900: #0f1115;
  --c-ink-800: #1a1d24;
  --c-ink-700: #232732;
  --c-ink-600: #2a2f3a;
  --c-fog-100: #e8eaed;
  --c-fog-300: #9aa0a6;
  --c-fog-500: #6b727d;
  --c-accent: #7c9cff;

  /* ---- semantic: background / border / text, primary > secondary > tertiary ---- */
  --bg-primary: var(--c-ink-900);
  --bg-secondary: var(--c-ink-800);
  --bg-tertiary: var(--c-ink-700);

  --border-primary: var(--c-ink-600);
  --border-secondary: rgba(150, 170, 210, 0.16);

  --text-primary: var(--c-fog-100);
  --text-secondary: var(--c-fog-300);
  --text-tertiary: var(--c-fog-500);

  --accent: var(--c-accent);

  /* ---- radius scale ---- */
  --radius-sm: 5px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 9999px;

  /* ---- spacing / padding scale ---- */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 2rem;

  /* ---- type ---- */
  --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
    sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

/* Shared cross-nav link (gallery <-> devlog). Both app.css and blog.css inline this
   file, so defining it once here keeps the two links visually identical. */
.cross-link {
  color: var(--text-secondary);
  font-size: 0.92rem;
  text-decoration: none;
  white-space: nowrap;
}
.cross-link:hover {
  color: var(--accent);
  text-decoration: underline;
}

/* Example theme override — set <html data-theme="light"> to activate (or wire it
   to prefers-color-scheme). Left commented so we don't ship untuned colours:

:root[data-theme="light"] {
  color-scheme: light;
  --bg-primary: #fbfbfd;
  --bg-secondary: #f1f2f5;
  --bg-tertiary: #e7e9ee;
  --border-primary: #d4d8e0;
  --border-secondary: rgba(20, 30, 60, 0.12);
  --text-primary: #1a1d24;
  --text-secondary: #555b66;
  --text-tertiary: #7b828d;
}
*/

</style>
  <style>
@property --slide-img-height {
      syntax: '<length>';
      inherits: true;
      initial-value: 270px;
    }
    :root {
      /* Local aliases mapped onto the shared tokens in tokens.css (inlined first).
         Keeping the short names means the rest of app.css is unchanged. */
      --bg: var(--bg-primary);
      --panel: var(--bg-secondary);
      --border: var(--border-primary);
      --text: var(--text-primary);
      --muted: var(--text-secondary);
      /* --accent comes straight from tokens.css */
      --slide-img-height: 270px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 10;
      transition: outline-color 0.15s, background 0.15s;
    }
    header.collapsed {
      padding-bottom: 0.75rem;
    }
    header.drag-over {
      outline: 2px dashed var(--accent);
      outline-offset: -4px;
      background: #1e2430;
    }
    .header-bar {
      display: flex;
      align-items: flex-end;
      gap: 1rem;
    }
    .header-bar .header-slider-slot {
      flex: 1 1 auto;
      min-width: 0;
      max-width: 20rem;
    }
    .header-bar .header-slider-slot:empty {
      display: none;
    }
    .header-toggle-slot {
      flex-shrink: 0;
      margin-left: auto;
    }
    .header-toggle-slot:empty {
      display: none;
    }
    /* devlog cross-link: sit at the top-right, next to the collapse toggle. */
    .gallery-nav {
      margin-left: auto;
      align-self: center;
      flex-shrink: 0;
    }
    .header-toggle {
      flex-shrink: 0;
      width: 2.35rem;
      height: 2.35rem;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
    }
    .header-toggle svg {
      width: 1.2rem;
      height: 1.2rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    header:not(.collapsed) .header-toggle .icon-expand { display: none; }
    header.collapsed .header-toggle .icon-collapse { display: none; }
    header.collapsed .header-panel { display: none; }
    html.baked #pickDirGroup,
    html.baked #refreshGroup { display: none; }
    .header-panel { margin-top: 0.75rem; }
    .controls-slider-row {
      margin-top: 0.75rem;
      max-width: 20rem;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
      align-items: flex-end;
    }
    .control-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .control-group label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .checkbox-label { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; text-transform: none; letter-spacing: normal; font-size: 0.85rem; color: var(--text); }
    .slider-row { display: flex; align-items: center; gap: 0.75rem; min-width: 220px; }
    input[type="range"] { flex: 1; accent-color: var(--accent); }
    .sample-value { font-variant-numeric: tabular-nums; min-width: 2ch; font-weight: 600; }
    .slider-bound-label { font-size: 0.7rem; color: var(--muted); min-width: 1.8rem; text-transform: uppercase; letter-spacing: 0.04em; }
    .dual-slider .slider-row { gap: 0.5rem; }
    .dual-slider .slider-row + .slider-row { margin-top: 0.2rem; }
    select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.6rem;
      min-width: 140px;
    }
    select[multiple] {
      min-width: 160px;
      min-height: 5.5rem;
      padding: 0.35rem;
    }
    select[multiple] option {
      padding: 0.2rem 0.35rem;
      border-radius: 4px;
    }
    select[multiple] option:checked {
      background: rgba(124, 156, 255, 0.35);
      color: var(--text);
    }
    .filter-actions {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
    }
    .filter-actions button {
      padding: 0.25rem 0.5rem;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .control-group[hidden] { display: none; }
    .size-badge { display: inline-block; min-width: 1.4em; text-align: center; padding: 0 0.35em; margin-right: 0.45em; border-radius: 4px; background: rgba(120,170,255,0.22); color: #cfe0ff; font-weight: 600; font-size: 0.72rem; }
    .prompt-row .slide-overlay-model { color: #cfe0ff; text-shadow: 0 1px 3px rgba(0,0,0,0.85); }
    .prompt-slide { flex: 0 0 auto; }
    .prompt-cell {
      width: 100%;
      box-sizing: border-box;
      max-height: var(--slide-img-height, 270px);
      overflow: auto;
      padding: 1.3rem 0.6rem 0.6rem;
      font-size: 0.8rem;
      line-height: 1.42;
      color: #e9e9ee;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      white-space: pre-wrap;
      scrollbar-width: thin;
    }
    .prompt-cell.empty { display: flex; align-items: center; justify-content: center; color: var(--muted); white-space: normal; }
    .prompt-cell-block + .prompt-cell-block { margin-top: 0.55rem; padding-top: 0.55rem; border-top: 1px solid rgba(255,255,255,0.08); }
    button {
      background: var(--accent);
      color: #0f1115;
      border: none;
      border-radius: 6px;
      padding: 0.45rem 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    button.secondary.drag-over {
      border-color: var(--accent);
      background: rgba(124, 156, 255, 0.12);
      color: var(--accent);
    }
    button:hover { filter: brightness(1.08); }
    .status {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }
    .status.error { color: #f28b82; }
    main { padding: 1rem 1.25rem 2rem; }
    .model-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .model-row {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .carousel {
      padding: 0.35rem 0.5rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .carousel-sync-hint .carousel:not(:first-child) {
      scrollbar-width: none;
    }
    .carousel-sync-hint .carousel:not(:first-child)::-webkit-scrollbar {
      display: none;
    }
    .carousel-track {
      display: flex;
      align-items: flex-start;
      width: max-content;
    }
    .carousel-slide {
      flex: 0 0 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .slide-img-wrap {
      position: relative;
      height: var(--slide-img-height);
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: filter 0.25s ease, box-shadow 0.25s ease;
    }
    .slide-overlay {
      position: sticky;
      right: 0;
      left: auto;
      z-index: 2;
      align-self: flex-end;
      width: max-content;
      max-width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      margin-top: -1.35rem;
      padding: 0.35rem 0.45rem;
      pointer-events: none;
      font-size: 0.72rem;
      line-height: 1.2;
    }
    .slide-overlay-caption {
      paint-order: stroke fill;
    }
    .slide-overlay-model {
      position: sticky;
      left: 0;
      z-index: 3;
      align-self: flex-start;
      flex: 0 0 0;
      min-width: 0;
      width: 0;
      padding: 0.35rem 0.45rem 0;
      font-size: 0.72rem;
      line-height: 1.2;
      font-weight: 600;
      text-align: left;
      white-space: nowrap;
      overflow: visible;
      pointer-events: none;
    }
    .slide-overlay-right {
      flex: 0 0 auto;
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      margin-left: auto;
      text-align: right;
      white-space: nowrap;
    }
    .slide-overlay-subject {
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .slide-overlay-sample {
      font-variant-numeric: tabular-nums;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .slide-overlay-duration {
      font-variant-numeric: tabular-nums;
      opacity: 0.85;
      text-transform: none;
      letter-spacing: 0;
    }
    .slide-overlay-duration.missing-meta {
      opacity: 0.45;
      letter-spacing: 0.12em;
    }
    .slide-overlay-sample .warn {
      text-transform: none;
      letter-spacing: 0;
    }
    .resize-bar {
      position: relative;
      z-index: 4;
      flex: 0 0 8px;
      width: 8px;
      margin: 0 2px;
      align-self: stretch;
      min-height: var(--slide-img-height);
      touch-action: none;
      background: transparent;
    }
    .resize-bar::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc(-1 * var(--hit-pad-left, 5rem));
      right: calc(-1 * var(--hit-pad-right, 5rem));
      cursor: col-resize;
    }
    .resize-bar::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 8px;
      transform: translateX(-50%);
      background: var(--border);
      border-radius: 3px;
      pointer-events: none;
      transition: background 0.15s;
    }
    .resize-bar:hover::after,
    body.resizing .resize-bar.active::after {
      background: var(--accent);
    }
    body.resizing {
      cursor: col-resize;
      user-select: none;
    }
    body.resizing .slide-img-layer {
      transition: none;
    }
    body.resizing .model-row {
      overflow: visible;
    }
    body.resizing .carousel {
      overflow-y: visible;
    }
    .slide-img-stack {
      position: absolute;
      inset: 0;
    }
    .slide-img-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: transparent;
      transition: opacity 300ms ease;
    }
    .carousel-slide.nsfw-hidden .slide-img-layer {
      filter: blur(24px);
      transform: scale(1.08);
    }
    .carousel-slide.nsfw-hidden .slide-img-wrap::after {
      content: 'NSFW · use Show NSFW to reveal';
      position: absolute;
      inset: 0;
      z-index: 2;
      display: grid;
      place-items: center;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.35);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-align: center;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.95);
      pointer-events: none;
    }
    .carousel-slide.missing .slide-img-wrap { opacity: 0.45; }
    .empty {
      padding: 2rem;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 10px;
    }

    /* ---- Notes: has-note indicator dot on annotated slides ---- */
    .slide-note-dot {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      border: 1px solid rgba(0, 0, 0, 0.5);
      pointer-events: none;
      z-index: 3;
    }
    .carousel-slide.nsfw-hidden .slide-note-dot {
      background: #f87171;
    }

    /* ---- Notes lightbox overlay ---- */
    .notes-lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: stretch;
    }
    .notes-lightbox[hidden] { display: none; }
    .notes-lightbox-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(4px);
    }
    .notes-lightbox-panel {
      position: relative;
      display: flex;
      width: 100%;
      height: 100%;
    }
    .notes-lightbox-img {
      flex: 1 1 auto;
      min-width: 0;
      object-fit: contain;
      max-height: 100vh;
      background: transparent;
    }
    .notes-lightbox-editor {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      width: 320px;
      flex-shrink: 0;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border-primary);
      padding: var(--space-5);
      overflow-y: auto;
    }
    .notes-lightbox-meta {
      font-size: 0.8rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .notes-textarea {
      flex: 1 1 auto;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      font-family: var(--font-sans);
      font-size: 0.9rem;
      line-height: 1.55;
      resize: vertical;
      min-height: 120px;
    }
    .notes-textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .notes-nsfw-label {
      font-size: 0.82rem;
    }
    .notes-lightbox-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
    }
    .notes-save-status {
      font-size: 0.78rem;
      color: var(--text-secondary);
    }
    .notes-save-status.saved { color: var(--accent); }
    .notes-save-status.error { color: #f87171; }
    @media (max-width: 900px) {
      .notes-lightbox-panel { flex-direction: column; }
      .notes-lightbox-img { flex: 1 1 auto; max-height: 55vh; }
      .notes-lightbox-editor { width: 100%; border-left: none; border-top: 1px solid var(--border-primary); }
    }

    @media (max-width: 640px) {
      header {
        padding: 0.75rem 1rem;
      }
      main {
        padding: 0.75rem 1rem 1.5rem;
      }
      .header-bar {
        gap: 0.65rem;
      }
      .header-bar .header-slider-slot,
      .controls-slider-row {
        max-width: none;
        flex: 1 1 auto;
      }
      .slider-row {
        min-width: 0;
        width: 100%;
      }
      .controls {
        gap: 0.75rem;
      }
      .control-group {
        flex: 1 1 100%;
        min-width: 0;
      }
      select,
      select[multiple] {
        width: 100%;
        min-width: 0;
      }
      .control-group button {
        width: 100%;
        min-height: 2.75rem;
      }
      .header-toggle {
        width: 2.75rem;
        height: 2.75rem;
      }
      .status {
        font-size: 0.8rem;
        line-height: 1.45;
      }
    }

</style>
</head>

<body>
  <header id="dropZone">
    <div class="header-bar">
      <div id="headerBarSliderSlot" class="header-slider-slot"></div>
      <nav class="gallery-nav"><a class="cross-link" href="./blog/">devlog →</a></nav>
      <div id="headerToggleSlot" class="header-toggle-slot">
        <button type="button" id="headerToggle" class="header-toggle secondary" aria-expanded="true"
          aria-controls="headerPanel" title="Hide controls">
          <svg class="icon-collapse" viewBox="0 0 24 24" aria-hidden="true">
            <polyline points="6 14 12 8 18 14" />
            <line x1="4" y1="19" x2="20" y2="19" />
          </svg>
          <svg class="icon-expand" viewBox="0 0 24 24" aria-hidden="true">
            <line x1="4" y1="7" x2="20" y2="7" />
            <line x1="6" y1="12" x2="18" y2="12" />
            <line x1="8" y1="17" x2="16" y2="17" />
          </svg>
        </button>
      </div>
    </div>
    <div class="header-panel" id="headerPanel">
      <div class="controls">
        <div class="control-group" id="modelSelectGroup" hidden>
          <label for="modelSelect">Model</label>
          <select id="modelSelect"></select>
        </div>
        <div class="control-group" id="seedGroup" hidden>
          <label for="seedSelect">Version (seed)</label>
          <select id="seedSelect"
            title="Scrub between seed-versions; cells without this seed fall back to v1."></select>
        </div>
        <div class="control-group" id="promptSizeGroup" hidden>
          <label for="promptSizeSelect">Prompt size</label>
          <select id="promptSizeSelect"
            title="Show the prompt variant sent at each token budget. Models are grouped by encoder size.">
            <option value="all">All sizes</option>
            <option value="s">S · CLIP ~77t</option>
            <option value="m">M · T5 ~512t</option>
            <option value="l">L · full</option>
            <option value="b">B · booru tags</option>
          </select>
        </div>
        <div class="control-group" id="modelFilterGroup">
          <label for="modelFilter">Visible models</label>
          <select id="modelFilter" multiple
            title="Tap or Cmd/Ctrl+click to toggle. Selected models are shown."></select>
          <div class="filter-actions">
            <button type="button" class="secondary" id="showAllModels">All</button>
            <button type="button" class="secondary" id="hideAllModels">None</button>
          </div>
        </div>
        <div class="control-group" id="sampleFilterGroup" hidden>
          <label for="sampleFilter">Visible samples</label>
          <select id="sampleFilter" multiple
            title="Tap or Cmd/Ctrl+click to toggle. Selected sample counts are shown."></select>
          <div class="filter-actions">
            <button type="button" class="secondary" id="showAllSamples">All</button>
            <button type="button" class="secondary" id="hideAllSamples">None</button>
          </div>
        </div>
        <div class="control-group" id="compareGroup">
          <label for="compareSelect">Compare by</label>
          <select id="compareSelect"
            title="Compare models at a step count, sample counts for one model, or each model's best image within a time budget.">
            <option value="models">Models · step count</option>
            <option value="samples">Samples · one model</option>
            <option value="time">Time budget</option>
          </select>
        </div>
        <div class="control-group" id="pickDirGroup">
          <label>&nbsp;</label>
          <button type="button" class="secondary" id="pickDir" title="Click to browse, or drag a folder here">Pick or
            drop folder…</button>
        </div>
        <div class="control-group" id="refreshGroup">
          <label>&nbsp;</label>
          <button type="button" id="refresh">Refresh</button>
        </div>
        <div class="control-group" id="overshootGroup" hidden>
          <label>&nbsp;</label>
          <label class="checkbox-label"
            title="Steps above a model's quality plateau. Hidden by default; toggle to compare beyond the ceiling.">
