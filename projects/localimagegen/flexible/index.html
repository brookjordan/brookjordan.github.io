<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <base href="../" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1d24" />
  <meta name="color-scheme" content="dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Stage 2 model compare</title>
  <style>
/* Design tokens shared by the gallery (app.css) and the devlog (blog.css).
   This is the single source of truth for colour, radius, spacing and type.
   It is inlined ahead of each page's stylesheet at build time, and linked
   first in dev so opening the .html files directly still resolves the vars.

   Theming: everything below is a semantic token mapped onto a small palette of
   primitives. To add a theme, override the *semantic* tokens under a selector
   (see the commented [data-theme="light"] block at the bottom) — no stylesheet
   needs to change, only these variables. */
:root {
  color-scheme: dark;

  /* ---- palette primitives (raw colours; reference these only via the tokens below) ---- */
  --c-ink-900: #0f1115;
  --c-ink-800: #1a1d24;
  --c-ink-700: #232732;
  --c-ink-600: #2a2f3a;
  --c-fog-100: #e8eaed;
  --c-fog-300: #9aa0a6;
  --c-fog-500: #6b727d;
  --c-accent: #7c9cff;

  /* ---- semantic: background / border / text, primary > secondary > tertiary ---- */
  --bg-primary: var(--c-ink-900);
  --bg-secondary: var(--c-ink-800);
  --bg-tertiary: var(--c-ink-700);

  --border-primary: var(--c-ink-600);
  --border-secondary: rgba(150, 170, 210, 0.16);

  --text-primary: var(--c-fog-100);
  --text-secondary: var(--c-fog-300);
  --text-tertiary: var(--c-fog-500);

  --accent: var(--c-accent);

  /* ---- radius scale ---- */
  --radius-sm: 5px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-pill: 9999px;

  /* ---- spacing / padding scale ---- */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 2rem;

  /* ---- type ---- */
  --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
    sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

/* Example theme override — set <html data-theme="light"> to activate (or wire it
   to prefers-color-scheme). Left commented so we don't ship untuned colours:

:root[data-theme="light"] {
  color-scheme: light;
  --bg-primary: #fbfbfd;
  --bg-secondary: #f1f2f5;
  --bg-tertiary: #e7e9ee;
  --border-primary: #d4d8e0;
  --border-secondary: rgba(20, 30, 60, 0.12);
  --text-primary: #1a1d24;
  --text-secondary: #555b66;
  --text-tertiary: #7b828d;
}
*/

</style>
  <style>
@property --slide-img-height {
      syntax: '<length>';
      inherits: true;
      initial-value: 270px;
    }
    :root {
      /* Local aliases mapped onto the shared tokens in tokens.css (inlined first).
         Keeping the short names means the rest of app.css is unchanged. */
      --bg: var(--bg-primary);
      --panel: var(--bg-secondary);
      --border: var(--border-primary);
      --text: var(--text-primary);
      --muted: var(--text-secondary);
      /* --accent comes straight from tokens.css */
      --slide-img-height: 270px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      position: sticky;
      top: 0;
      z-index: 10;
      transition: outline-color 0.15s, background 0.15s;
    }
    header.collapsed {
      padding-bottom: 0.75rem;
    }
    header.drag-over {
      outline: 2px dashed var(--accent);
      outline-offset: -4px;
      background: #1e2430;
    }
    .header-bar {
      display: flex;
      align-items: flex-end;
      gap: 1rem;
    }
    .header-bar .header-slider-slot {
      flex: 1 1 auto;
      min-width: 0;
      max-width: 20rem;
    }
    .header-bar .header-slider-slot:empty {
      display: none;
    }
    .header-toggle-slot {
      flex-shrink: 0;
      margin-left: auto;
    }
    .header-toggle-slot:empty {
      display: none;
    }
    .header-toggle {
      flex-shrink: 0;
      width: 2.35rem;
      height: 2.35rem;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 0;
    }
    .header-toggle svg {
      width: 1.2rem;
      height: 1.2rem;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    header:not(.collapsed) .header-toggle .icon-expand { display: none; }
    header.collapsed .header-toggle .icon-collapse { display: none; }
    header.collapsed .header-panel { display: none; }
    html.baked #pickDirGroup,
    html.baked #refreshGroup { display: none; }
    .header-panel { margin-top: 0.75rem; }
    .controls-slider-row {
      margin-top: 0.75rem;
      max-width: 20rem;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
      align-items: flex-end;
    }
    .control-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .control-group label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .slider-row { display: flex; align-items: center; gap: 0.75rem; min-width: 220px; }
    input[type="range"] { flex: 1; accent-color: var(--accent); }
    .sample-value { font-variant-numeric: tabular-nums; min-width: 2ch; font-weight: 600; }
    select {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0.4rem 0.6rem;
      min-width: 140px;
    }
    select[multiple] {
      min-width: 160px;
      min-height: 5.5rem;
      padding: 0.35rem;
    }
    select[multiple] option {
      padding: 0.2rem 0.35rem;
      border-radius: 4px;
    }
    select[multiple] option:checked {
      background: rgba(124, 156, 255, 0.35);
      color: var(--text);
    }
    .filter-actions {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
    }
    .filter-actions button {
      padding: 0.25rem 0.5rem;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .control-group[hidden] { display: none; }
    .size-badge { display: inline-block; min-width: 1.4em; text-align: center; padding: 0 0.35em; margin-right: 0.45em; border-radius: 4px; background: rgba(120,170,255,0.22); color: #cfe0ff; font-weight: 600; font-size: 0.72rem; }
    .prompt-row .slide-overlay-model { color: #cfe0ff; text-shadow: 0 1px 3px rgba(0,0,0,0.85); }
    .prompt-slide { flex: 0 0 auto; }
    .prompt-cell {
      width: 100%;
      box-sizing: border-box;
      max-height: var(--slide-img-height, 270px);
      overflow: auto;
      padding: 1.3rem 0.6rem 0.6rem;
      font-size: 0.8rem;
      line-height: 1.42;
      color: #e9e9ee;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      white-space: pre-wrap;
      scrollbar-width: thin;
    }
    .prompt-cell.empty { display: flex; align-items: center; justify-content: center; color: var(--muted); white-space: normal; }
    .prompt-cell-block + .prompt-cell-block { margin-top: 0.55rem; padding-top: 0.55rem; border-top: 1px solid rgba(255,255,255,0.08); }
    button {
      background: var(--accent);
      color: #0f1115;
      border: none;
      border-radius: 6px;
      padding: 0.45rem 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    button.secondary.drag-over {
      border-color: var(--accent);
      background: rgba(124, 156, 255, 0.12);
      color: var(--accent);
    }
    button:hover { filter: brightness(1.08); }
    .status {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 0.5rem;
    }
    .status.error { color: #f28b82; }
    main { padding: 1rem 1.25rem 2rem; }
    .model-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .model-row {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .carousel {
      padding: 0.35rem 0.5rem;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .carousel-sync-hint .carousel:not(:first-child) {
      scrollbar-width: none;
    }
    .carousel-sync-hint .carousel:not(:first-child)::-webkit-scrollbar {
      display: none;
    }
    .carousel-track {
      display: flex;
      align-items: flex-start;
      width: max-content;
    }
    .carousel-slide {
      flex: 0 0 auto;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .slide-img-wrap {
      position: relative;
      height: var(--slide-img-height);
      background: #000;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .slide-overlay {
      position: sticky;
      right: 0;
      left: auto;
      z-index: 2;
      align-self: flex-end;
      width: max-content;
      max-width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      margin-top: -1.35rem;
      padding: 0.35rem 0.45rem;
      pointer-events: none;
      font-size: 0.72rem;
      line-height: 1.2;
    }
    .slide-overlay-caption {
      paint-order: stroke fill;
    }
    .slide-overlay-model {
      position: sticky;
      left: 0;
      z-index: 3;
      align-self: flex-start;
      flex: 0 0 0;
      min-width: 0;
      width: 0;
      padding: 0.35rem 0.45rem 0;
      font-size: 0.72rem;
      line-height: 1.2;
      font-weight: 600;
      text-align: left;
      white-space: nowrap;
      overflow: visible;
      pointer-events: none;
    }
    .slide-overlay-right {
      flex: 0 0 auto;
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
      margin-left: auto;
      text-align: right;
      white-space: nowrap;
    }
    .slide-overlay-subject {
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .slide-overlay-sample {
      font-variant-numeric: tabular-nums;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .slide-overlay-duration {
      font-variant-numeric: tabular-nums;
      opacity: 0.85;
      text-transform: none;
      letter-spacing: 0;
    }
    .slide-overlay-duration.missing-meta {
      opacity: 0.45;
      letter-spacing: 0.12em;
    }
    .slide-overlay-sample .warn {
      text-transform: none;
      letter-spacing: 0;
    }
    .resize-bar {
      position: relative;
      z-index: 4;
      flex: 0 0 8px;
      width: 8px;
      margin: 0 2px;
      align-self: stretch;
      min-height: var(--slide-img-height);
      touch-action: none;
      background: transparent;
    }
    .resize-bar::before {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: calc(-1 * var(--hit-pad-left, 5rem));
      right: calc(-1 * var(--hit-pad-right, 5rem));
      cursor: col-resize;
    }
    .resize-bar::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 8px;
      transform: translateX(-50%);
      background: var(--border);
      border-radius: 3px;
      pointer-events: none;
      transition: background 0.15s;
    }
    .resize-bar:hover::after,
    body.resizing .resize-bar.active::after {
      background: var(--accent);
    }
    body.resizing {
      cursor: col-resize;
      user-select: none;
    }
    body.resizing .slide-img-layer {
      transition: none;
    }
    body.resizing .model-row {
      overflow: visible;
    }
    body.resizing .carousel {
      overflow-y: visible;
    }
    .slide-img-stack {
      position: absolute;
      inset: 0;
    }
    .slide-img-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: transparent;
      transition: opacity 300ms ease;
    }
    .carousel-slide.missing .slide-img-wrap { opacity: 0.45; }
    .empty {
      padding: 2rem;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 10px;
    }

    @media (max-width: 640px) {
      header {
        padding: 0.75rem 1rem;
      }
      main {
        padding: 0.75rem 1rem 1.5rem;
      }
      .header-bar {
        gap: 0.65rem;
      }
      .header-bar .header-slider-slot,
      .controls-slider-row {
        max-width: none;
        flex: 1 1 auto;
      }
      .slider-row {
        min-width: 0;
        width: 100%;
      }
      .controls {
        gap: 0.75rem;
      }
      .control-group {
        flex: 1 1 100%;
        min-width: 0;
      }
      select,
      select[multiple] {
        width: 100%;
        min-width: 0;
      }
      .control-group button {
        width: 100%;
        min-height: 2.75rem;
      }
      .header-toggle {
        width: 2.75rem;
        height: 2.75rem;
      }
      .status {
        font-size: 0.8rem;
        line-height: 1.45;
      }
    }

</style>
</head>
<body>
  <header id="dropZone">
    <div class="header-bar">
      <div id="headerBarSliderSlot" class="header-slider-slot"></div>
      <div id="headerToggleSlot" class="header-toggle-slot">
        <button
          type="button"
          id="headerToggle"
          class="header-toggle secondary"
          aria-expanded="true"
          aria-controls="headerPanel"
          title="Hide controls"
        >
          <svg class="icon-collapse" viewBox="0 0 24 24" aria-hidden="true">
            <polyline points="6 14 12 8 18 14" />
            <line x1="4" y1="19" x2="20" y2="19" />
          </svg>
          <svg class="icon-expand" viewBox="0 0 24 24" aria-hidden="true">
            <line x1="4" y1="7" x2="20" y2="7" />
            <line x1="6" y1="12" x2="18" y2="12" />
            <line x1="8" y1="17" x2="16" y2="17" />
          </svg>
        </button>
      </div>
    </div>
    <div class="header-panel" id="headerPanel">
    <div class="controls">
      <div class="control-group" id="modelSelectGroup" hidden>
        <label for="modelSelect">Model</label>
        <select id="modelSelect"></select>
      </div>
      <div class="control-group" id="seedGroup" hidden>
        <label for="seedSelect">Version (seed)</label>
        <select id="seedSelect" title="Scrub between seed-versions; cells without this seed fall back to v1."></select>
      </div>
      <div class="control-group" id="promptSizeGroup" hidden>
        <label for="promptSizeSelect">Prompt size</label>
        <select id="promptSizeSelect" title="Show the prompt variant sent at each token budget. Models are grouped by encoder size.">
          <option value="all">All sizes</option>
          <option value="s">S · CLIP ~77t</option>
          <option value="m">M · T5 ~512t</option>
          <option value="l">L · full</option>
        </select>
      </div>
      <div class="control-group" id="modelFilterGroup">
        <label for="modelFilter">Visible models</label>
        <select id="modelFilter" multiple title="Tap or Cmd/Ctrl+click to toggle. Selected models are shown."></select>
        <div class="filter-actions">
          <button type="button" class="secondary" id="showAllModels">All</button>
          <button type="button" class="secondary" id="hideAllModels">None</button>
        </div>
      </div>
      <div class="control-group" id="sampleFilterGroup" hidden>
        <label for="sampleFilter">Visible samples</label>
        <select id="sampleFilter" multiple title="Tap or Cmd/Ctrl+click to toggle. Selected sample counts are shown."></select>
        <div class="filter-actions">
          <button type="button" class="secondary" id="showAllSamples">All</button>
          <button type="button" class="secondary" id="hideAllSamples">None</button>
        </div>
      </div>
      <div class="control-group" id="compareGroup">
        <label for="compareSelect">Compare by</label>
        <select id="compareSelect" title="Compare models at a step count, sample counts for one model, or each model's best image within a time budget.">
          <option value="models">Models · step count</option>
          <option value="samples">Samples · one model</option>
          <option value="time">Time budget</option>
        </select>
      </div>
      <div class="control-group" id="pickDirGroup">
        <label>&nbsp;</label>
        <button type="button" class="secondary" id="pickDir" title="Click to browse, or drag a folder here">Pick or drop folder…</button>
      </div>
      <div class="control-group" id="refreshGroup">
        <label>&nbsp;</label>
        <button type="button" id="refresh">Refresh</button>
      </div>
    </div>
    <div id="controlsSliderSlot" class="controls-slider-row">
      <div class="control-group" id="sampleSliderGroup">
        <label for="sample">Sample count</label>
        <div class="slider-row">
          <input type="range" id="sample" min="1" max="8" value="4" />
          <span class="sample-value" id="sampleVal">4</span>
        </div>
      </div>
      <div class="control-group" id="timeSliderGroup" hidden>
        <label for="timeSlider">Time budget</label>
        <div class="slider-row">
          <input type="range" id="timeSlider" min="1" max="120" value="30" />
          <span class="sample-value" id="timeVal">30s</span>
        </div>
      </div>
    </div>
    <p class="status" id="status">Loading…</p>
    </div>
  </header>
  <input type="file" id="folderInput" hidden multiple webkitdirectory directory />
  <main>
    <div class="model-list" id="modelList"></div>
    <p class="empty" id="empty" hidden>No images found. Drag the output folder here, pick it, or open this folder over HTTP.</p>
  </main>

  <script>
let catalog = {};
    let metaByPrefix = {};
    let promptCatalog = null;  // _prompts.json: {models, promptSizes, fallback, scenes:{scene:{layer:text}}}
    /** @type {Map<string, string>} filename → resolved object/url */
    const imageUrlCache = new Map();
    const preloadedFiles = new Set();
    let renderGeneration = 0;
    let availableSamples = [];
    let availableSeeds = [42];
    let currentSeed = 42;
    let dirHandle = null;
    /** @type {Map<string, File>} filename → File (drag-drop or picker) */
    let fileMap = new Map();
    let loadSource = 'listing'; // 'listing' | 'handle' | 'dropped'
    let droppedFolderName = '';
    let compareMode = 'models'; // 'models' | 'samples'

    // Baked-data hook. build_static.py replaces the sentinel below to produce a
    // standalone index.html with a hard-coded file list + meta, so it works on a
    // plain static host (no directory listing, no folder picker, no local images
    // folder). Left null here, so flexible.html keeps using the live picker flow.
    let IMG_BASE = '';
    let BAKED_FILES = null;
    let BAKED_META = null;
    let BAKED_PROMPTS = null;
    /* __BAKED_DATA__ */
    /** @type {number[] | null} pixel width per subject index, synced across all rows */
    let slideWidthsPx = null;
    let slideImgHeightPx = 270;
    let slidesAutoSized = false;
    let userHasResizedSlides = false;
    const SLIDE_MIN_WIDTH_PX = 200;
    const SLIDE_DEFAULT_WIDTH_PX = 480;
    const SLIDE_FALLBACK_ASPECT = 16 / 9;
    const RESIZE_BAR_TOTAL_PX = 12;
    const RESIZE_HIT_FRACTION = 0.33;
    const MAX_VISIBLE_SLIDES = 3;
    const IMAGE_FADE_MS = 300;

    const FILE_RE = /^(.+?)_(dragon|van|[a-z0-9]+)_s(\d+)(?:_t(\d+)s)?_(\d+)_?\.(?:png|webp|avif|jpe?g)$/i;
    const IMG_EXT_RE = /\.(?:png|webp|avif|jpe?g)$/i;
    const isImageFile = (name) => IMG_EXT_RE.test(name || '');
    // Subfolders to skip when crawling a dropped/picked folder: the compressed build
    // output + caches live here and carry pre-migration names (e.g. _00001_/_00002_)
    // that would otherwise register as phantom "seeds".
    const IGNORE_DIRS = new Set(['fixed', '__pycache__', 'build', 'node_modules', '.git']);
    const SUBJECT_ORDER = ['dragon', 'van'];

    function normModel(name) {
      return name.toLowerCase().replace(/-/g, '');
    }

    function resetCatalog() {
      catalog = {};
      preloadedFiles.clear();
    }

    function catalogPrefix(model, subject, sample, seed = 42) {
      const base = `${model}_${subject}_s${String(sample).padStart(2, '0')}`;
      return `${base}_${String(seed).padStart(5, '0')}`;
    }

    function ingestFilename(filename) {
      const base = filename.split('/').pop();
      const m = FILE_RE.exec(base);
      if (!m) return;
      const model = normModel(m[1]);
      const subject = m[2].toLowerCase();
      const sample = parseInt(m[3], 10);
      const duration = m[4] ? parseInt(m[4], 10) : null;
      const seed = parseInt(m[5], 10);  // trailing number = seed = version axis
      if (!catalog[model]) catalog[model] = {};
      if (!catalog[model][subject]) catalog[model][subject] = {};
      if (!catalog[model][subject][sample]) catalog[model][subject][sample] = {};
      const cell = catalog[model][subject][sample];
      const prev = cell[seed];
      if (prev) {
        const prevHasDuration = !!FILE_RE.exec(prev.file)?.[4];
        if (prevHasDuration && !m[4]) return;  // keep the stamped one
      }
      cell[seed] = { file: base, duration, seed };
    }

    // The entry to display for a cell at the active seed, falling back to seed 42
    // (v1) then the lowest available seed when the selected one is missing.
    function pickEntry(model, subject, sample) {
      const cell = catalog[model]?.[subject]?.[sample];
      if (!cell) return null;
      if (cell[currentSeed]) return cell[currentSeed];
      if (cell[42]) return cell[42];
      const ss = Object.keys(cell).map(Number).sort((a, b) => a - b);
      return ss.length ? cell[ss[0]] : null;
    }

    function entryMeta(model, subject, sample, entry) {
      const pref = catalogPrefix(model, subject, sample, entry?.seed ?? 42);
      const fromJson = metaByPrefix[pref];
      const seconds = entry?.duration ?? (fromJson?.seconds >= 0 ? fromJson.seconds : null);
      return { ...(fromJson || {}), seconds: seconds ?? -1 };
    }

    function formatDuration(seconds) {
      if (seconds == null || seconds < 0) return '···';
      return `${seconds}s`;
    }

    function formatMetaTooltip(filename, meta) {
      const parts = [filename];
      if (!meta) return parts.join('');
      if (meta.seconds >= 0) parts.push(`${meta.seconds}s render`);
      if (meta.steps >= 0) parts.push(`${meta.steps} steps`);
      if (meta.cfg >= 0) parts.push(`cfg ${meta.cfg}`);
      if (meta.seed >= 0) parts.push(`seed ${meta.seed}`);
      if (meta.sampler) parts.push(meta.sampler);
      if (meta.schedule) parts.push(meta.schedule);
      if (meta.denoise >= 0 && meta.denoise !== 1) parts.push(`denoise ${meta.denoise}`);
      if (meta.width > 0 && meta.height > 0) parts.push(`${meta.width}×${meta.height}`);
      if (meta.unet) parts.push(meta.unet);
      if (meta.vae) parts.push(meta.vae);
      let line = parts.join(' · ');
      const fm = FILE_RE.exec(filename);
      if (fm && promptCatalog) {
        const model = normModel(fm[1]);
        const subject = fm[2].toLowerCase();
        const promptSize = meta.promptSize || promptSizeOfModel(model);
        const prompt = promptFor(model, subject);
        if (prompt) {
          const trimmed = prompt.length > 240 ? prompt.slice(0, 240) + '…' : prompt;
          line += `\n\n[${(promptSize || '?').toString().toUpperCase()}] ${trimmed}`;
        }
      }
      return line;
    }

    function applyMetaToCatalog() {
      for (const [model, subjects] of Object.entries(catalog)) {
        for (const [subject, samples] of Object.entries(subjects)) {
          for (const [sample, cell] of Object.entries(samples)) {
            for (const [seed, entry] of Object.entries(cell)) {
              const meta = metaByPrefix[catalogPrefix(model, subject, Number(sample), Number(seed))];
              if (meta?.seconds >= 0 && entry.duration == null) entry.duration = meta.seconds;
            }
          }
        }
      }
    }

    function rebuildSeedList() {
      const set = new Set();
      for (const subjects of Object.values(catalog))
        for (const samples of Object.values(subjects))
          for (const cell of Object.values(samples))
            for (const s of Object.keys(cell)) set.add(Number(s));
      availableSeeds = [...set].sort((a, b) => a - b);
      if (!availableSeeds.length) availableSeeds = [42];
      if (!availableSeeds.includes(currentSeed)) currentSeed = availableSeeds.includes(42) ? 42 : availableSeeds[0];
      const sel = document.getElementById('seedSelect');
      const group = document.getElementById('seedGroup');
      if (sel) {
        sel.innerHTML = '';
        availableSeeds.forEach((s, i) => {
          const opt = document.createElement('option');
          opt.value = String(s);
          opt.textContent = `v${i + 1} · seed ${s}`;
          sel.appendChild(opt);
        });
        sel.value = String(currentSeed);
      }
      if (group) group.hidden = availableSeeds.length < 2;  // hide until >1 seed exists
    }

    function promptSizeValue() {
      return document.getElementById('promptSizeSelect')?.value || 'all';
    }

    function setupPromptUI() {
      const group = document.getElementById('promptSizeGroup');
      if (group) group.hidden = !promptCatalog;
    }

    // (label, text) pairs to show for one scene at the chosen size. "All" lists the
    // authored layers as-is (legacy => one "all"; kingdom => s/m/l); a specific size
    // resolves that size (falling back to the base layer, labelled accordingly).
    function promptRowsFor(subject, size) {
      const layers = promptCatalog?.scenes?.[subject] || {};
      if (size === 'all') {
        return ['all', 's', 'm', 'l'].filter((k) => layers[k] != null).map((k) => [k, layers[k]]);
      }
      const text = promptForSize(subject, size);
      const label = layers[size] != null ? size : (promptCatalog?.fallback || 'all');
      return text ? [[label, text]] : [];
    }

    // An extra grid row (aligned to the scene columns) showing the prompt sent for
    // each scene, instead of a separate accordion. Mirrors a model row so the shared
    // width + scroll sync keep it lined up with the image columns.
    function renderPromptRow(subjects, size) {
      const row = document.createElement('section');
      row.className = 'model-row prompt-row';
      row.dataset.model = '__prompt__';

      const carousel = document.createElement('div');
      carousel.className = 'carousel';
      carousel.setAttribute('aria-label', 'prompts');

      const track = document.createElement('div');
      track.className = 'carousel-track';
      getSlideWidthsPx(subjects.length);

      const modelEl = document.createElement('span');
      modelEl.className = 'slide-overlay-model slide-overlay-caption';
      modelEl.textContent = size === 'all' ? 'prompt' : `prompt · ${size.toUpperCase()}`;
      track.appendChild(modelEl);

      subjects.forEach((subject, i) => {
        const slide = document.createElement('article');
        slide.className = 'carousel-slide prompt-slide';
        slide.dataset.subjectIndex = String(i);
        slide.dataset.subject = subject;

        const cell = document.createElement('div');
        cell.className = 'prompt-cell';
        const rows = promptRowsFor(subject, size);
        if (!rows.length) {
          cell.classList.add('empty');
          cell.textContent = '—';
        } else {
          for (const [size, text] of rows) {
            const block = document.createElement('div');
            block.className = 'prompt-cell-block';
            const badge = document.createElement('span');
            badge.className = 'size-badge';
            badge.textContent = String(size).toUpperCase();
            block.appendChild(badge);
            block.appendChild(document.createTextNode(text));
            cell.appendChild(block);
          }
        }
        slide.appendChild(cell);
        track.appendChild(slide);

        const bar = document.createElement('div');
        bar.className = 'resize-bar';
        bar.setAttribute('role', 'separator');
        bar.setAttribute('aria-orientation', 'vertical');
        bar.setAttribute('aria-label', 'Drag to resize images');
        setupResizeBar(bar, i, track);
        track.appendChild(bar);
      });

      carousel.appendChild(track);
      row.appendChild(carousel);
      return row;
    }

    function refreshPromptRow() {
      const list = document.getElementById('modelList');
      if (!list) return;
      const existing = list.querySelector('.prompt-row');
      const subjects = allSubjects();
      if (!promptCatalog || !subjects.length) {
        if (existing) existing.remove();
        return;
      }
      const fresh = renderPromptRow(subjects, promptSizeValue());
      if (existing) existing.replaceWith(fresh);
      else list.prepend(fresh);
      applySlideLayoutAll(getSlideWidthsPx(subjects.length));
      setupSyncedCarousels();
    }

    async function loadMetaJson() {
      if (BAKED_META) {
        metaByPrefix = BAKED_META;
        return;
      }
      metaByPrefix = {};
      try {
        const res = await fetch('./data/meta.json', { cache: 'no-store' });
        if (res.ok) metaByPrefix = await res.json();
      } catch {
        /* optional static sidecar */
      }
    }

    async function loadPromptsJson() {
      if (BAKED_PROMPTS) { promptCatalog = BAKED_PROMPTS; return; }
      promptCatalog = null;
      try {
        const res = await fetch('./data/prompts.json', { cache: 'no-store' });
        if (res.ok) promptCatalog = await res.json();
      } catch {
        /* optional sidecar — prompt UI stays hidden when absent */
      }
    }

    // _prompts.json model keys are raw engine keys (no dashes); catalog keys are
    // normModel()'d. Match directly, then fall back to a normalized comparison.
    function promptSizeOfModel(model) {
      const models = promptCatalog?.models;
      if (!models) return null;
      if (model in models) return models[model];
      const hit = Object.keys(models).find((k) => normModel(k) === model);
      return hit ? models[hit] : null;
    }
    function promptForSize(subject, size) {
      const layers = promptCatalog?.scenes?.[subject];
      if (!layers) return null;
      if (size && layers[size] != null) return layers[size];
      const fb = promptCatalog.fallback || 'all';
      return layers[fb] != null ? layers[fb] : null;
    }
    function promptFor(model, subject) {
      return promptForSize(subject, promptSizeOfModel(model) || 'l');
    }

    function allSubjects() {
      const set = new Set();
      for (const model of Object.values(catalog)) {
        for (const subj of Object.keys(model)) set.add(subj);
      }
      const preferred = SUBJECT_ORDER.filter((s) => set.has(s));
      const rest = [...set].filter((s) => !SUBJECT_ORDER.includes(s)).sort();
      return [...preferred, ...rest];
    }

    function rebuildSampleList() {
      const set = new Set();
      for (const model of Object.values(catalog)) {
        for (const subj of Object.keys(model)) {
          for (const n of Object.keys(model[subj])) set.add(Number(n));
        }
      }
      availableSamples = [...set].sort((a, b) => a - b);
      const slider = document.getElementById('sample');
      if (availableSamples.length) {
        const min = availableSamples[0];
        const max = availableSamples[availableSamples.length - 1];
        slider.min = String(min);
        slider.max = String(max);
        if (Number(slider.value) < min || Number(slider.value) > max) {
          slider.value = availableSamples.includes(4) ? '4' : String(availableSamples[Math.floor(availableSamples.length / 2)]);
        }
      }
      document.getElementById('sampleVal').textContent = slider.value;
    }

    function rebuildTimeSlider() {
      let min = Infinity, max = 0;
      for (const subs of Object.values(catalog))
        for (const samps of Object.values(subs))
          for (const cell of Object.values(samps))
            for (const e of Object.values(cell)) {
              const d = e.duration;
              if (d != null && d >= 0) { if (d < min) min = d; if (d > max) max = d; }
            }
      const slider = document.getElementById('timeSlider');
      const val = document.getElementById('timeVal');
      if (!slider) return;
      if (!isFinite(min)) { min = 1; max = 120; }
      slider.min = String(Math.max(1, Math.floor(min)));
      slider.max = String(Math.max(Number(slider.min), Math.ceil(max)));
      const cur = Number(slider.value);
      if (cur < Number(slider.min) || cur > Number(slider.max)) {
        slider.value = String(Math.min(Number(slider.max), Math.max(Number(slider.min), 30)));
      }
      if (val) val.textContent = `${slider.value}s`;
    }

    function allModels() {
      return Object.keys(catalog).sort();
    }

    function populateModelSelect() {
      const models = allModels();
      const sel = document.getElementById('modelSelect');
      const prev = sel.value;
      sel.innerHTML = '';
      for (const m of models) {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        sel.appendChild(opt);
      }
      if (prev && models.includes(prev)) sel.value = prev;
      else if (models.length) sel.value = models[0];
    }

    function getSelectedModel() {
      return document.getElementById('modelSelect').value || allModels()[0] || null;
    }

    function samplesForModel(model) {
      const set = new Set();
      for (const subj of Object.keys(catalog[model] || {})) {
        for (const s of Object.keys(catalog[model][subj])) set.add(Number(s));
      }
      return [...set].sort((a, b) => a - b);
    }

    function closestSample(model, subject, target) {
      const samples = Object.keys(catalog[model]?.[subject] || {}).map(Number).sort((a, b) => a - b);
      if (!samples.length) return null;
      const atOrBelow = samples.filter((s) => s <= target);
      if (atOrBelow.length) return atOrBelow[atOrBelow.length - 1];
      return samples[0];
    }

    function readDirEntries(dirEntry) {
      return new Promise((resolve, reject) => {
        const reader = dirEntry.createReader();
        const all = [];
        const readBatch = () => {
          reader.readEntries(
            (entries) => {
              if (!entries.length) resolve(all);
              else {
                all.push(...entries);
                readBatch();
              }
            },
            reject
          );
        };
        readBatch();
      });
    }

    async function collectPngFilesFromEntry(entry, files = []) {
      if (entry.isFile) {
        const file = await new Promise((res, rej) => entry.file(res, rej));
        if (isImageFile(file.name)) files.push(file);
        return files;
      }
      if (entry.isDirectory) {
        if (IGNORE_DIRS.has(entry.name)) return files;
        const children = await readDirEntries(entry);
        for (const child of children) {
          await collectPngFilesFromEntry(child, files);
        }
      }
      return files;
    }

    async function loadFromDroppedFiles(files, folderName = 'folder') {
      resetCatalog();
      fileMap = new Map();
      dirHandle = null;
      loadSource = 'dropped';
      droppedFolderName = folderName;
      for (const file of files) {
        fileMap.set(file.name, file);
        ingestFilename(file.name);
      }
    }

    function loadFromBaked() {
      resetCatalog();
      fileMap = new Map();
      dirHandle = null;
      loadSource = 'baked';
      IMG_BASE = './img/';
      droppedFolderName = '';
      for (const name of BAKED_FILES) ingestFilename(name);
    }

    async function loadFromListing() {
      const res = await fetch('./', { cache: 'no-store' });
      if (!res.ok) throw new Error(`Directory listing failed (${res.status}). Drag the folder here or use Pick folder.`);
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const links = [...doc.querySelectorAll('a[href]')];
      resetCatalog();
      fileMap = new Map();
      dirHandle = null;
      loadSource = 'listing';
      droppedFolderName = '';
      for (const a of links) {
        const href = decodeURIComponent(a.getAttribute('href').split('?')[0]);
        if (isImageFile(href)) ingestFilename(href.replace(/^\.\//, ''));
      }
    }

    // Served (deployed/flexible) mode: discover files from data/manifest.json
    // and load compressed images from ./img/. No directory listing needed.
    async function loadFromManifest() {
      try {
        const res = await fetch('./data/manifest.json', { cache: 'no-store' });
        if (!res.ok) return false;
        const manifest = await res.json();
        const files = [...new Set(Object.values(manifest))];
        if (!files.length) return false;
        resetCatalog();
        fileMap = new Map();
        dirHandle = null;
        loadSource = 'served';
        droppedFolderName = '';
        IMG_BASE = './img/';
        for (const name of files) ingestFilename(name);
        return true;
      } catch {
        return false;
      }
    }

    async function loadFromDirHandle(handle) {
      resetCatalog();
      fileMap = new Map();
      loadSource = 'handle';
      droppedFolderName = handle.name || '';
      for await (const entry of handle.values()) {
        if (entry.kind === 'file' && isImageFile(entry.name)) {
          ingestFilename(entry.name);
          const file = await entry.getFile();
          fileMap.set(entry.name, file);
        }
      }
      dirHandle = handle;
    }

    async function loadFromPicker() {
      if (window.showDirectoryPicker) {
        const handle = await showDirectoryPicker();
        await loadFromDirHandle(handle);
        return;
      }
      const input = document.getElementById('folderInput');
      if (!input || !('webkitdirectory' in input)) {
        throw new Error('Folder picker not supported in this browser. Open over HTTP or use a desktop browser.');
      }
      await new Promise((resolve, reject) => {
        input.onchange = async () => {
          input.onchange = null;
          try {
            const files = [...input.files].filter((f) => isImageFile(f.name));
            input.value = '';
            if (!files.length) throw new Error('No PNG images found in picked folder.');
            const path = files[0].webkitRelativePath || '';
            const folderName = path.includes('/') ? path.split('/')[0] : 'folder';
            await loadFromDroppedFiles(files, folderName);
            resolve();
          } catch (err) {
            reject(err);
          }
        };
        input.click();
      });
    }

    async function loadFromDataTransfer(dt) {
      const items = [...dt.items];
      const entries = items
        .map((item) => (item.webkitGetAsEntry ? item.webkitGetAsEntry() : null))
        .filter(Boolean);

      if (!entries.length) {
        const files = [...dt.files].filter((f) => isImageFile(f.name));
        if (!files.length) throw new Error('Drop a folder containing PNG images.');
        await loadFromDroppedFiles(files, 'dropped files');
        return;
      }

      const allFiles = [];
      let folderName = 'folder';
      for (const entry of entries) {
        if (entry.isDirectory) folderName = entry.name;
        await collectPngFilesFromEntry(entry, allFiles);
      }
      if (!allFiles.length) throw new Error('No PNG images found in dropped folder.');
      await loadFromDroppedFiles(allFiles, folderName);
    }

    function getSelectedModels() {
      return [...document.getElementById('modelFilter').selectedOptions].map((o) => o.value);
    }

    function setModelSelection(models) {
      const sel = document.getElementById('modelFilter');
      for (const opt of sel.options) {
        opt.selected = models.includes(opt.value);
      }
    }

    function getSelectedSamples() {
      return [...document.getElementById('sampleFilter').selectedOptions].map((o) => Number(o.value));
    }

    function setSampleSelection(samples) {
      const sel = document.getElementById('sampleFilter');
      const sampleSet = new Set(samples.map(String));
      for (const opt of sel.options) {
        opt.selected = sampleSet.has(opt.value);
      }
    }

    function populateSampleFilter() {
      const sel = document.getElementById('sampleFilter');
      const prev = new Set(getSelectedSamples());
      const model = compareMode === 'samples' ? getSelectedModel() : null;
      const pool = model ? samplesForModel(model) : availableSamples;
      sel.innerHTML = '';
      for (const s of pool) {
        const opt = document.createElement('option');
        opt.value = String(s);
        opt.textContent = `s${String(s).padStart(2, '0')}`;
        opt.selected = prev.size ? prev.has(s) : true;
        sel.appendChild(opt);
      }
      if (!getSelectedSamples().length && pool.length) {
        setSampleSelection(pool);
      }
    }

    function populateModelFilter() {
      const models = Object.keys(catalog).sort();
      const sel = document.getElementById('modelFilter');
      const prev = new Set(getSelectedModels());
      sel.innerHTML = '';
      for (const m of models) {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        opt.selected = prev.size ? prev.has(m) : true;
        sel.appendChild(opt);
      }
      if (!getSelectedModels().length && models.length) {
        setModelSelection(models);
      }
    }

    async function resolveImageUrl(filename) {
      if (imageUrlCache.has(filename)) return imageUrlCache.get(filename);
      const file = fileMap.get(filename);
      if (file) {
        const url = URL.createObjectURL(file);
        imageUrlCache.set(filename, url);
        return url;
      }
      if (dirHandle) {
        try {
          const fh = await dirHandle.getFileHandle(filename);
          const f = await fh.getFile();
          const url = URL.createObjectURL(f);
          imageUrlCache.set(filename, url);
          return url;
        } catch {
          return null;
        }
      }
      const url = encodeURI((IMG_BASE || '') + filename);
      imageUrlCache.set(filename, url);
      return url;
    }

    function preloadUrl(url) {
      if (!url) return Promise.resolve(null);
      return new Promise((resolve, reject) => {
        const probe = new Image();
        probe.decoding = 'async';
        probe.onload = () => {
          if (probe.decode) {
            probe.decode().then(() => resolve(url)).catch(() => resolve(url));
          } else {
            resolve(url);
          }
        };
        probe.onerror = reject;
        probe.src = url;
      });
    }

    async function preloadFilename(filename) {
      if (preloadedFiles.has(filename)) {
        return resolveImageUrl(filename);
      }
      const url = await resolveImageUrl(filename);
      if (!url) throw new Error(`missing image: ${filename}`);
      await preloadUrl(url);
      preloadedFiles.add(filename);
      return url;
    }

    function waitForPaint() {
      return new Promise((resolve) => {
        requestAnimationFrame(() => requestAnimationFrame(resolve));
      });
    }

    async function waitForImageReady(img, { skipPaint = false } = {}) {
      if (!img.getAttribute('src')) return;
      if (!img.complete || !img.naturalWidth) {
        await new Promise((resolve, reject) => {
          img.addEventListener('load', resolve, { once: true });
          img.addEventListener('error', reject, { once: true });
        });
      }
      try {
        if (img.decode) await img.decode();
      } catch {
        /* keep going — load already succeeded */
      }
      if (!skipPaint) {
        await waitForPaint();
        void img.offsetWidth;
      }
    }

    function getSlideStack(wrap) {
      return wrap.querySelector('.slide-img-stack');
    }

    function getStackLayers(stack) {
      return stack ? [...stack.querySelectorAll('img.slide-img-layer')] : [];
    }

    function getTopStackImage(wrap) {
      const layers = getStackLayers(getSlideStack(wrap));
      return layers[layers.length - 1] || null;
    }

    function createStackLayer(wrap, alt) {
      const stack = getSlideStack(wrap);
      const img = document.createElement('img');
      img.className = 'slide-img-layer';
      img.alt = alt;
      img.decoding = 'async';
      stack.appendChild(img);
      return img;
    }

    function pruneStackBelow(layer) {
      const stack = layer.parentElement;
      if (!stack) return;
      while (stack.firstChild && stack.firstChild !== layer) {
        stack.firstChild.remove();
      }
    }

    function clearSlideStack(wrap) {
      const stack = getSlideStack(wrap);
      if (stack) stack.replaceChildren();
    }

    async function fadeInStackLayer(layer, wrap, layerGen) {
      await new Promise((resolve) => {
        let done = false;
        const finish = () => {
          if (done) return;
          done = true;
          layer.removeEventListener('transitionend', onEnd);
          clearTimeout(fallback);
          resolve();
        };
        const onEnd = (e) => {
          if (e.target === layer && e.propertyName === 'opacity') finish();
        };
        const fallback = setTimeout(finish, IMAGE_FADE_MS + 50);
        layer.addEventListener('transitionend', onEnd);
        requestAnimationFrame(() => {
          layer.style.opacity = '1';
        });
      });
      if (wrap._layerGen === layerGen && getTopStackImage(wrap) === layer) {
        pruneStackBelow(layer);
      }
    }

    async function swapSlideImage(wrap, filename, gen) {
      const top = getTopStackImage(wrap);
      if (top?.dataset.filename === filename) return;

      wrap._layerGen = (wrap._layerGen || 0) + 1;
      const layerGen = wrap._layerGen;
      const isStale = () =>
        layerGen !== wrap._layerGen || (gen != null && gen !== renderGeneration);

      let url;
      const skipPaint = preloadedFiles.has(filename);
      try {
        url = await preloadFilename(filename);
        if (isStale()) return;
      } catch {
        if (isStale()) return;
        clearSlideStack(wrap);
        return;
      }

      const slide = wrap.closest('.carousel-slide');
      const alt = top?.alt || slide?.dataset.subject || '';

      if (!top) {
        const layer = createStackLayer(wrap, alt);
        layer.style.opacity = '0';
        layer.src = url;
        try {
          await waitForImageReady(layer, { skipPaint });
        } catch {
          layer.remove();
          return;
        }
        if (isStale()) {
          layer.remove();
          return;
        }
        layer.dataset.filename = filename;
        layer.style.opacity = '1';
        return;
      }

      const layer = createStackLayer(wrap, alt);
      layer.dataset.filename = filename;
      layer.style.opacity = '0';
      layer.src = url;

      try {
        await waitForImageReady(layer, { skipPaint });
      } catch {
        layer.remove();
        return;
      }
      if (isStale()) {
        layer.remove();
        return;
      }

      void fadeInStackLayer(layer, wrap, layerGen);
    }

    async function setImgSrc(wrap, filename, { readyUrl = null, alt = '' } = {}) {
      if (readyUrl) {
        clearSlideStack(wrap);
        const layer = createStackLayer(wrap, alt);
        layer.src = readyUrl;
        layer.dataset.filename = filename;
        layer.style.opacity = '1';
        return;
      }
      await swapSlideImage(wrap, filename, null);
    }

    function getSlideAspectRatio(subjectIndex) {
      const slide = document.querySelector(`.carousel-slide:not(.prompt-slide)[data-subject-index="${subjectIndex}"]`);
      const wrap = slide?.querySelector('.slide-img-wrap');
      const img = wrap ? getTopStackImage(wrap) : null;
      if (img?.naturalWidth > 0 && img.naturalHeight > 0) {
        return img.naturalWidth / img.naturalHeight;
      }
      return SLIDE_FALLBACK_ASPECT;
    }

    function heightFromWidth(subjectIndex, width) {
      return width / getSlideAspectRatio(subjectIndex);
    }

    function widthFromHeight(subjectIndex, height) {
      return height * getSlideAspectRatio(subjectIndex);
    }

    function minHeightForWidths(count) {
      let minH = 80;
      for (let i = 0; i < count; i++) {
        minH = Math.max(minH, heightFromWidth(i, SLIDE_MIN_WIDTH_PX));
      }
      return minH;
    }

    function syncLayoutFromAnchor(anchorIndex, anchorWidth, widths = slideWidthsPx) {
      const layout = layoutFromAnchor(anchorIndex, anchorWidth, widths);
      if (!layout) return;
      applyLayoutState(layout);
    }

    function layoutFromAnchor(anchorIndex, anchorWidth, widths = slideWidthsPx) {
      if (!widths) return null;
      const height = Math.max(
        minHeightForWidths(widths.length),
        heightFromWidth(anchorIndex, Math.max(SLIDE_MIN_WIDTH_PX, anchorWidth))
      );
      const nextWidths = widths.map((_, i) =>
        Math.max(SLIDE_MIN_WIDTH_PX, widthFromHeight(i, height))
      );
      return { height, widths: nextWidths };
    }

    function applyLayoutState({ height, widths }) {
      slideImgHeightPx = height;
      for (let i = 0; i < widths.length; i++) {
        slideWidthsPx[i] = widths[i];
      }
      applySlideLayoutAll(slideWidthsPx);
    }

    function getSlideWidthsPx(count) {
      if (!slideWidthsPx || slideWidthsPx.length !== count) {
        const prev = slideWidthsPx;
        slideWidthsPx = Array(count).fill(SLIDE_DEFAULT_WIDTH_PX);
        if (prev) {
          for (let i = 0; i < Math.min(prev.length, count); i++) {
            slideWidthsPx[i] = prev[i];
          }
        }
      }
      return slideWidthsPx;
    }

    function carouselPadX(carousel) {
      if (!carousel) return 0;
      const s = getComputedStyle(carousel);
      return (parseFloat(s.paddingLeft) || 0) + (parseFloat(s.paddingRight) || 0);
    }

    function measureCarouselInnerWidth() {
      const carousel = document.querySelector('.carousel');
      if (!carousel) return 0;
      const padX = carouselPadX(carousel);
      if (carousel.clientWidth > 0) return Math.max(0, carousel.clientWidth - padX);
      const row = carousel.closest('.model-row');
      if (row?.clientWidth > 0) {
        return Math.max(0, row.clientWidth - padX);
      }
      const main = document.querySelector('main');
      if (main?.clientWidth > 0) {
        const mainStyle = getComputedStyle(main);
        const mainPad =
          (parseFloat(mainStyle.paddingLeft) || 0) + (parseFloat(mainStyle.paddingRight) || 0);
        return Math.max(0, main.clientWidth - mainPad - padX);
      }
      return 0;
    }

    function reconcileLayout(widths) {
      if (!widths.length) return;
      const height = Math.max(
        minHeightForWidths(widths.length),
        heightFromWidth(0, widths[0])
      );
      slideImgHeightPx = height;
      for (let i = 0; i < widths.length; i++) {
        widths[i] = Math.max(SLIDE_MIN_WIDTH_PX, widthFromHeight(i, height));
      }
    }

    function autoSizeSlideWidths(subjectCount) {
      const carouselWidth = measureCarouselInnerWidth();
      if (!carouselWidth || subjectCount < 1) return false;
      const widths = getSlideWidthsPx(subjectCount);
      const fitCount = Math.min(subjectCount, MAX_VISIBLE_SLIDES);
      const barTotal = subjectCount * RESIZE_BAR_TOTAL_PX;
      let aspectSum = 0;
      for (let i = 0; i < fitCount; i++) {
        aspectSum += getSlideAspectRatio(i);
      }
      const height = Math.max(
        minHeightForWidths(subjectCount),
        Math.floor((carouselWidth - barTotal) / aspectSum)
      );
      slideImgHeightPx = height;
      for (let i = 0; i < subjectCount; i++) {
        widths[i] = Math.max(SLIDE_MIN_WIDTH_PX, widthFromHeight(i, height));
      }
      return true;
    }

    function finishRenderLayout(subjects) {
      if (!subjects.length) return;
      const count = subjects.length;
      const widths = getSlideWidthsPx(count);

      const apply = () => {
        if (!slidesAutoSized) {
          if (!autoSizeSlideWidths(count)) return false;
          slidesAutoSized = true;
        } else {
          reconcileLayout(widths);
        }
        applySlideLayoutAll(slideWidthsPx);
        return true;
      };

      if (!slidesAutoSized) {
        if (!apply()) {
          requestAnimationFrame(() => requestAnimationFrame(apply));
        }
      } else {
        reconcileLayout(widths);
        applySlideLayoutAll(slideWidthsPx);
      }
    }

    function updateResizeBarHitboxes(track) {
      const slides = [...track.querySelectorAll('.carousel-slide')];
      const bars = [...track.querySelectorAll('.resize-bar')];
      for (let i = 0; i < bars.length; i++) {
        const leftW = slides[i]?.offsetWidth ?? SLIDE_DEFAULT_WIDTH_PX;
        const rightW = slides[i + 1]?.offsetWidth ?? leftW;
        bars[i].style.setProperty('--hit-pad-left', `${leftW * RESIZE_HIT_FRACTION}px`);
        bars[i].style.setProperty('--hit-pad-right', `${rightW * RESIZE_HIT_FRACTION}px`);
      }
    }

    function updateAllResizeBarHitboxes() {
      for (const track of document.querySelectorAll('.carousel-track')) {
        updateResizeBarHitboxes(track);
      }
    }

    function applySlideLayoutAll(widths) {
      document.documentElement.style.setProperty('--slide-img-height', `${slideImgHeightPx}px`);
      for (const slide of document.querySelectorAll('.carousel-slide')) {
        const i = Number(slide.dataset.subjectIndex);
        if (!Number.isNaN(i) && widths[i] != null) {
          slide.style.width = `${widths[i]}px`;
        }
      }
      for (const bar of document.querySelectorAll('.resize-bar')) {
        bar.style.minHeight = `${slideImgHeightPx}px`;
      }
      updateAllResizeBarHitboxes();
    }

    function markSlideResize() {
      userHasResizedSlides = true;
    }

    function setupResizeBar(bar, index, track) {
      bar.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        markSlideResize();
        bar.classList.add('active');
        document.body.classList.add('resizing');
        bar.setPointerCapture(e.pointerId);

        const startX = e.clientX;
        const startWidth = slideWidthsPx[index];
        let dragging = true;

        // Dead simple: the dragged column's width = its start width + however
        // many pixels the mouse has moved. syncLayoutFromAnchor reconciles the
        // shared height + the other columns and applies it live on every move.
        const onPointerMove = (ev) => {
          if (!dragging) return;
          const width = Math.max(SLIDE_MIN_WIDTH_PX, startWidth + (ev.clientX - startX));
          syncLayoutFromAnchor(index, width);
        };

        const onPointerUp = (ev) => {
          dragging = false;
          bar.classList.remove('active');
          document.body.classList.remove('resizing');
          bar.releasePointerCapture(ev.pointerId);
          bar.removeEventListener('pointermove', onPointerMove);
          bar.removeEventListener('pointerup', onPointerUp);
          bar.removeEventListener('pointercancel', onPointerUp);
        };

        bar.addEventListener('pointermove', onPointerMove);
        bar.addEventListener('pointerup', onPointerUp);
        bar.addEventListener('pointercancel', onPointerUp);
      });
    }

    function linearizeSrgb(channel) {
      const c = channel / 255;
      return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
    }

    function rgbToLab(r, g, b) {
      const R = linearizeSrgb(r);
      const G = linearizeSrgb(g);
      const B = linearizeSrgb(b);
      let x = R * 0.4124564 + G * 0.3575761 + B * 0.1804375;
      let y = R * 0.2126729 + G * 0.7151522 + B * 0.072175;
      let z = R * 0.0193339 + G * 0.1191920 + B * 0.9503041;
      x /= 0.95047;
      y /= 1.0;
      z /= 1.08883;
      const f = (t) => (t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116);
      const fx = f(x);
      const fy = f(y);
      const fz = f(z);
      const L = 116 * fy - 16;
      const a = 500 * (fx - fy);
      const bStar = 200 * (fy - fz);
      const C = Math.hypot(a, bStar);
      return { L, C };
    }

    function relativeLuminance(r, g, b) {
      const R = linearizeSrgb(r);
      const G = linearizeSrgb(g);
      const B = linearizeSrgb(b);
      return 0.2126 * R + 0.7152 * G + 0.0722 * B;
    }

    function contrastRatio(lumA, lumB) {
      const lighter = Math.max(lumA, lumB);
      const darker = Math.min(lumA, lumB);
      return (lighter + 0.05) / (darker + 0.05);
    }

    function rgbToHex(r, g, b) {
      return `#${[r, g, b].map((c) => Math.round(c).toString(16).padStart(2, '0')).join('')}`;
    }

    /** Stroke/shadow = average colour of pixels behind this span's bbox. */
    function haloFromSample(sample) {
      return { r: sample.ar, g: sample.ag, b: sample.ab };
    }

    /** Text fill = highest-contrast readable colour against the halo. */
    function textColorForHalo(halo) {
      const haloLum = relativeLuminance(halo.r, halo.g, halo.b);
      const candidates = [
        [242, 243, 245],
        [255, 255, 255],
        [15, 17, 21],
        [0, 0, 0],
        [253, 214, 99],
      ];
      let best = candidates[0];
      let bestScore = 0;
      for (const [cr, cg, cb] of candidates) {
        const score = contrastRatio(haloLum, relativeLuminance(cr, cg, cb));
        if (score > bestScore) {
          bestScore = score;
          best = [cr, cg, cb];
        }
      }
      return rgbToHex(...best);
    }

    function imageContentRect(img) {
      const { naturalWidth: nw, naturalHeight: nh, clientWidth: cw, clientHeight: ch } = img;
      if (!nw || !nh || !cw || !ch) return null;
      const scale = Math.min(cw / nw, ch / nh);
      const dw = nw * scale;
      const dh = nh * scale;
      return { ox: (cw - dw) / 2, oy: (ch - dh) / 2, dw, dh, nw, nh };
    }

    function elementRectOnImage(img, el, content) {
      const imgR = img.getBoundingClientRect();
      const elR = el.getBoundingClientRect();
      const { ox, oy, dw, dh, nw, nh } = content;
      if (!dw || !dh) return null;
      const lx = elR.left - imgR.left - ox;
      const ly = elR.top - imgR.top - oy;
      let sx = Math.floor((lx / dw) * nw);
      let sy = Math.floor((ly / dh) * nh);
      let sw = Math.ceil((elR.width / dw) * nw);
      let sh = Math.ceil((elR.height / dh) * nh);
      const pad = Math.max(2, Math.round(nw * 0.004));
      sx = Math.max(0, sx - pad);
      sy = Math.max(0, sy - pad);
      sw = Math.min(nw - sx, sw + pad * 2);
      sh = Math.min(nh - sy, sh + pad * 2);
      if (sw < 1 || sh < 1) return null;
      return { sx, sy, sw, sh };
    }

    function analyzeImageData(data) {
      const buckets = new Map();
      let sumL = 0;
      let sumC = 0;
      let sumR = 0;
      let sumG = 0;
      let sumB = 0;
      let n = 0;
      for (let i = 0; i < data.length; i += 4) {
        if (data[i + 3] < 48) continue;
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        const { L, C } = rgbToLab(r, g, b);
        sumL += L;
        sumC += C;
        sumR += r;
        sumG += g;
        sumB += b;
        n++;
        const key = ((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3);
        const entry = buckets.get(key) || { r: 0, g: 0, b: 0, n: 0 };
        entry.r += r;
        entry.g += g;
        entry.b += b;
        entry.n++;
        buckets.set(key, entry);
      }
      let best = null;
      for (const entry of buckets.values()) {
        if (!best || entry.n > best.n) best = entry;
      }
      if (!best || !n) {
        return { r: 15, g: 17, b: 21, ar: 15, ag: 17, ab: 21, avgL: 8, avgC: 0 };
      }
      return {
        r: Math.round(best.r / best.n),
        g: Math.round(best.g / best.n),
        b: Math.round(best.b / best.n),
        ar: Math.round(sumR / n),
        ag: Math.round(sumG / n),
        ab: Math.round(sumB / n),
        avgL: sumL / n,
        avgC: sumC / n,
      };
    }

    function sampleImageRegion(img, region) {
      if (!region) return { r: 15, g: 17, b: 21, ar: 15, ag: 17, ab: 21, avgL: 8, avgC: 0 };
      const { sx, sy, sw, sh } = region;
      const w = Math.min(48, sw);
      const h = Math.max(1, Math.round((sh / sw) * w));
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
      return analyzeImageData(ctx.getImageData(0, 0, w, h).data);
    }

    function captionStyleFromSample(sample) {
      const halo = haloFromSample(sample);
      const text = textColorForHalo(halo);
      const stroke = `2px rgba(${halo.r}, ${halo.g}, ${halo.b}, 0.9)`;
      const shadows = [
        `0 0 2px rgba(${halo.r}, ${halo.g}, ${halo.b}, 1)`,
        `0 0 7px rgba(${halo.r}, ${halo.g}, ${halo.b}, 0.95)`,
        `0 0 14px rgba(${halo.r}, ${halo.g}, ${halo.b}, 0.8)`,
      ].join(', ');
      return { text, stroke, shadows };
    }

    function applyCaptionStyle(el, sample, { warn = false } = {}) {
      const { text, stroke, shadows } = captionStyleFromSample(sample);
      el.style.color = warn ? '#fdd663' : text;
      el.style.webkitTextStroke = stroke;
      el.style.textShadow = shadows;
    }

    function paintSlideCaptions(img, modelEl, subjectEl, sampleEl) {
      if (!img.naturalWidth) return;
      const content = imageContentRect(img);
      if (!content) return;

      if (modelEl?.textContent.trim()) {
        applyCaptionStyle(modelEl, sampleImageRegion(img, elementRectOnImage(img, modelEl, content)));
      }
      if (subjectEl.textContent.trim()) {
        applyCaptionStyle(subjectEl, sampleImageRegion(img, elementRectOnImage(img, subjectEl, content)));
      }
      if (sampleEl.textContent.trim() || sampleEl.querySelector('.warn')) {
        applyCaptionStyle(
          sampleEl,
          sampleImageRegion(img, elementRectOnImage(img, sampleEl, content)),
          { warn: sampleEl.classList.contains('warn') }
        );
      }
    }

    function bindSlideCaptions(imgWrap, modelEl, subjectEl, sampleEl) {
      const paint = () => {
        if (document.body.classList.contains('resizing')) return;
        const img = getTopStackImage(imgWrap);
        if (!img?.naturalWidth) return;
        requestAnimationFrame(() => paintSlideCaptions(img, modelEl, subjectEl, sampleEl));
      };
      paint();

      if (!imgWrap._captionResizeObserver) {
        imgWrap._captionResizeObserver = new ResizeObserver(paint);
        imgWrap._captionResizeObserver.observe(imgWrap);
      }
    }

    function setSampleSpan(sampleEl, durationEl, shown, targetSample, exact, meta) {
      const shownStr = `s${String(shown).padStart(2, '0')}`;
      if (exact || shown === targetSample) {
        sampleEl.textContent = shownStr;
        sampleEl.classList.remove('warn');
      } else {
        sampleEl.classList.add('warn');
        sampleEl.innerHTML = `<span class="warn">${targetSample}→${shownStr}</span>`;
      }
      if (durationEl) {
        const seconds = meta?.seconds ?? -1;
        durationEl.textContent = formatDuration(seconds);
        durationEl.hidden = false;
        durationEl.classList.toggle('missing-meta', seconds < 0);
      }
    }

    function timeBudgetValue() {
      return Number(document.getElementById('timeSlider')?.value || 0);
    }

    // Time mode: pick the slowest render that still fits the budget; if none fit, the
    // fastest one (the "just over"), flagged over-budget so the outline can grade it.
    function timeCellPick(model, subject, budget) {
      const cell = catalog[model]?.[subject];
      if (!cell) return null;
      const samples = Object.keys(cell).map(Number);
      let best = null, fastest = null;
      for (const s of samples) {
        const e = pickEntry(model, subject, s);
        if (!e) continue;
        const secs = entryMeta(model, subject, s, e).seconds;
        if (secs == null || secs < 0) continue;
        if (secs <= budget && (!best || secs > best.secs)) best = { sample: s, secs };
        if (!fastest || secs < fastest.secs) fastest = { sample: s, secs };
      }
      if (best) return { sample: best.sample, secs: best.secs, over: false, overBy: 0 };
      if (fastest) return { sample: fastest.sample, secs: fastest.secs, over: true, overBy: fastest.secs - budget };
      const lo = samples.sort((a, b) => a - b)[0];
      return lo != null ? { sample: lo, secs: null, over: false, overBy: 0 } : null;
    }

    function slideShownSample(model, subject, targetSample, exact) {
      if (compareMode === 'time') {
        const p = timeCellPick(model, subject, targetSample);
        return p ? p.sample : null;
      }
      return exact
        ? (catalog[model]?.[subject]?.[targetSample] ? targetSample : null)
        : closestSample(model, subject, targetSample);
    }

    function collectFilenamesForRender() {
      const filenames = [];
      const subjects = allSubjects();
      if (compareMode === 'models' || compareMode === 'time') {
        const target = compareMode === 'time' ? timeBudgetValue() : Number(document.getElementById('sample').value);
        for (const m of getSelectedModels()) {
          for (const subject of subjects) {
            const shown = slideShownSample(m, subject, target, false);
            const e = shown != null ? pickEntry(m, subject, shown) : null;
            if (e) filenames.push(e.file);
          }
        }
      } else {
        const model = getSelectedModel();
        if (!model) return filenames;
        const available = samplesForModel(model);
        const samples = getSelectedSamples()
          .filter((s) => available.includes(s))
          .sort((a, b) => a - b);
        for (const s of samples) {
          for (const subject of subjects) {
            const e = pickEntry(model, subject, s);
            if (e) filenames.push(e.file);
          }
        }
      }
      return filenames;
    }

    function canUpdateInPlace() {
      if (compareMode !== 'models' && compareMode !== 'time') return false;
      const models = getSelectedModels();
      const rows = document.querySelectorAll('#modelList .model-row:not(.prompt-row)');
      if (!rows.length || rows.length !== models.length) return false;
      const subjects = allSubjects();
      for (let i = 0; i < models.length; i++) {
        if (rows[i].dataset.model !== models[i]) return false;
        const slides = rows[i].querySelectorAll('.carousel-slide');
        if (slides.length !== subjects.length) return false;
      }
      return true;
    }

    async function updateRowsInPlace(targetSample, models, subjects, gen) {
      const jobs = [];
      for (let ri = 0; ri < models.length; ri++) {
        const row = document.querySelectorAll('#modelList .model-row:not(.prompt-row)')[ri];
        if (!row) continue;
        const model = models[ri];
        for (let i = 0; i < subjects.length; i++) {
          const slide = row.querySelector(`.carousel-slide[data-subject-index="${i}"]`);
          if (!slide) continue;
          jobs.push(updateSlideInPlace(slide, model, subjects[i], targetSample, false, gen));
        }
      }
      await Promise.all(jobs);
    }

    async function updateSlideInPlace(slide, model, subject, targetSample, exact, gen) {
      const imgWrap = slide.querySelector('.slide-img-wrap');
      const modelEl = slide.querySelector('.slide-overlay-model');
      const subjectEl = slide.querySelector('.slide-overlay-subject');
      const sampleEl = slide.querySelector('.slide-overlay-sample');
      const durationEl = slide.querySelector('.slide-overlay-duration');
      const shown = slideShownSample(model, subject, targetSample, exact);

      if (shown == null) {
        slide.classList.add('missing');
        sampleEl.textContent = '—';
        if (durationEl) {
          durationEl.textContent = '';
          durationEl.hidden = true;
        }
        imgWrap.title = '';
        clearSlideStack(imgWrap);
        clearTimeStyle(slide, imgWrap, durationEl);
        return;
      }

      slide.classList.remove('missing');
      const entry = pickEntry(model, subject, shown);
      const meta = entryMeta(model, subject, shown, entry);
      setSampleSpan(sampleEl, durationEl, shown, targetSample, compareMode === 'time' ? true : exact, meta);
      if (compareMode === 'time') applyTimeStyle(slide, imgWrap, durationEl, timeCellPick(model, subject, targetSample), targetSample);
      else clearTimeStyle(slide, imgWrap, durationEl);
      imgWrap.title = formatMetaTooltip(entry.file, meta);
      await swapSlideImage(imgWrap, entry.file, gen);
      if (gen !== renderGeneration) return;
      const img = getTopStackImage(imgWrap);
      if (img) paintSlideCaptions(img, modelEl, subjectEl, sampleEl);
    }

    let carouselScrollSync = false;

    function onCarouselScroll(ev) {
      if (carouselScrollSync) return;
      carouselScrollSync = true;
      const left = ev.currentTarget.scrollLeft;
      for (const other of document.querySelectorAll('#modelList .carousel')) {
        if (other !== ev.currentTarget) other.scrollLeft = left;
      }
      carouselScrollSync = false;
    }

    function setupSyncedCarousels() {
      const list = document.getElementById('modelList');
      const carousels = list.querySelectorAll('.carousel');
      list.classList.toggle('carousel-sync-hint', carousels.length > 1);
      for (const el of carousels) {
        if (el.dataset.scrollSync) continue;
        el.dataset.scrollSync = '1';
        el.addEventListener('scroll', onCarouselScroll, { passive: true });
      }
    }

    function clearTimeStyle(slide, imgWrap, durationEl) {
      slide.classList.remove('time-over');
      if (imgWrap) { imgWrap.style.outline = ''; imgWrap.style.outlineOffset = ''; }
      if (durationEl) { durationEl.style.color = ''; durationEl.title = ''; }
    }

    // Over-budget cue on a graded scale: amber + thin just over, red + thick way over.
    function applyTimeStyle(slide, imgWrap, durationEl, info, budget) {
      clearTimeStyle(slide, imgWrap, durationEl);
      if (!info || !info.over) return;
      const ratio = Math.max(0, Math.min(1, info.overBy / Math.max(1, budget)));
      const width = (2 + ratio * 6).toFixed(1);   // 2px (just over) → 8px (way over)
      const hue = Math.round(45 * (1 - ratio));    // amber (45) → red (0)
      const color = `hsl(${hue}, 95%, 55%)`;
      if (imgWrap) {
        imgWrap.style.outline = `${width}px solid ${color}`;
        imgWrap.style.outlineOffset = `-${width}px`;
      }
      slide.classList.add('time-over');
      if (durationEl) {
        durationEl.style.color = color;
        durationEl.title = `+${Math.round(info.overBy)}s over the ${budget}s budget`;
      }
    }

    function renderSlide(model, subject, subjectIndex, targetSample, { exact = false, readyUrl = null, modelEl = null } = {}) {
      const slide = document.createElement('article');
      slide.className = 'carousel-slide';
      slide.dataset.subjectIndex = String(subjectIndex);
      slide.dataset.subject = subject;

      const imgWrap = document.createElement('div');
      imgWrap.className = 'slide-img-wrap';
      const stack = document.createElement('div');
      stack.className = 'slide-img-stack';
      imgWrap.appendChild(stack);

      const overlay = document.createElement('div');
      overlay.className = 'slide-overlay';

      const right = document.createElement('div');
      right.className = 'slide-overlay-right';

      const subjectEl = document.createElement('span');
      subjectEl.className = 'slide-overlay-subject slide-overlay-caption';
      subjectEl.textContent = subject;

      const sampleEl = document.createElement('span');
      sampleEl.className = 'slide-overlay-sample slide-overlay-caption';

      const durationEl = document.createElement('span');
      durationEl.className = 'slide-overlay-duration slide-overlay-caption';
      durationEl.hidden = true;

      right.appendChild(subjectEl);
      right.appendChild(sampleEl);
      right.appendChild(durationEl);
      overlay.appendChild(right);

      slide.appendChild(imgWrap);
      slide.appendChild(overlay);

      const shown = slideShownSample(model, subject, targetSample, exact);
      if (shown == null) {
        slide.classList.add('missing');
        sampleEl.textContent = '—';
        durationEl.hidden = true;
      } else {
        const entry = pickEntry(model, subject, shown);
        const meta = entryMeta(model, subject, shown, entry);
        setSampleSpan(sampleEl, durationEl, shown, targetSample, compareMode === 'time' ? true : exact, meta);
        if (compareMode === 'time') applyTimeStyle(slide, imgWrap, durationEl, timeCellPick(model, subject, targetSample), targetSample);
        imgWrap.title = formatMetaTooltip(entry.file, meta);
        const alt = `${model} ${subject}`;
        setImgSrc(imgWrap, entry.file, { readyUrl: readyUrl || undefined, alt }).then(() => {
          const img = getTopStackImage(imgWrap);
          if (img) paintSlideCaptions(img, modelEl, subjectEl, sampleEl);
        });
      }

      bindSlideCaptions(imgWrap, modelEl, subjectEl, sampleEl);

      return slide;
    }

    function renderCarouselRow(header, model, subjects, targetSample, { exact = false, urlByFile = null } = {}) {
      const row = document.createElement('section');
      row.className = 'model-row';
      row.dataset.model = model;

      const carousel = document.createElement('div');
      carousel.className = 'carousel';
      carousel.setAttribute('aria-label', header);

      const track = document.createElement('div');
      track.className = 'carousel-track';
      getSlideWidthsPx(subjects.length);

      const modelEl = document.createElement('span');
      modelEl.className = 'slide-overlay-model slide-overlay-caption';
      const msize = promptSizeOfModel(model);
      modelEl.textContent = msize ? `${model} · ${msize.toUpperCase()}` : model;
      track.appendChild(modelEl);

      subjects.forEach((subject, i) => {
        const shown = slideShownSample(model, subject, targetSample, exact);
        const pe = shown != null ? pickEntry(model, subject, shown) : null;
        const filename = pe ? pe.file : null;
        const readyUrl = filename && urlByFile ? urlByFile.get(filename) : null;
        const slide = renderSlide(model, subject, i, targetSample, { exact, readyUrl, modelEl: i === 0 ? modelEl : null });
        track.appendChild(slide);

        const bar = document.createElement('div');
        bar.className = 'resize-bar';
        bar.setAttribute('role', 'separator');
        bar.setAttribute('aria-orientation', 'vertical');
        bar.setAttribute('aria-label', 'Drag to resize images');
        setupResizeBar(bar, i, track);
        track.appendChild(bar);
      });

      carousel.appendChild(track);
      row.appendChild(carousel);
      return row;
    }

    function renderModelRow(model, targetSample, subjects, urlByFile) {
      return renderCarouselRow(model, model, subjects, targetSample, { urlByFile });
    }

    function renderSampleRow(sample, model, subjects, urlByFile) {
      const header = `s${String(sample).padStart(2, '0')}`;
      return renderCarouselRow(header, model, subjects, sample, { exact: true, urlByFile });
    }

    function updateCompareControls() {
      const m = compareMode;
      const acrossModels = m === 'models' || m === 'time';
      document.getElementById('sampleSliderGroup').hidden = m !== 'models';
      document.getElementById('timeSliderGroup').hidden = m !== 'time';
      document.getElementById('modelSelectGroup').hidden = m !== 'samples';
      document.getElementById('modelFilterGroup').hidden = !acrossModels;
      document.getElementById('sampleFilterGroup').hidden = m !== 'samples';
      const sel = document.getElementById('compareSelect');
      if (sel) sel.value = m;
    }

    async function render() {
      const gen = ++renderGeneration;
      const subjects = allSubjects();

      if (canUpdateInPlace()) {
        const target = compareMode === 'time' ? timeBudgetValue() : Number(document.getElementById('sample').value);
        const models = getSelectedModels();
        const filenames = collectFilenamesForRender();
        await Promise.all(filenames.map((f) => preloadFilename(f).catch(() => null)));
        if (gen !== renderGeneration) return;
        document.getElementById('empty').hidden = models.length > 0;
        await updateRowsInPlace(target, models, subjects, gen);
        if (gen !== renderGeneration) return;
        finishRenderLayout(subjects);
        setupSyncedCarousels();
        return;
      }

      const filenames = collectFilenamesForRender();
      const loaded = await Promise.all(
        filenames.map(async (f) => {
          try {
            return [f, await preloadFilename(f)];
          } catch {
            return [f, null];
          }
        })
      );
      if (gen !== renderGeneration) return;
      const urlByFile = new Map(loaded);

      const list = document.getElementById('modelList');
      list.innerHTML = '';

      if (compareMode === 'models' || compareMode === 'time') {
        const target = compareMode === 'time' ? timeBudgetValue() : Number(document.getElementById('sample').value);
        const models = getSelectedModels();
        document.getElementById('empty').hidden = models.length > 0;
        for (const m of models) list.appendChild(renderModelRow(m, target, subjects, urlByFile));
      } else {
        const model = getSelectedModel();
        const available = model ? samplesForModel(model) : [];
        const samples = getSelectedSamples()
          .filter((s) => available.includes(s))
          .sort((a, b) => a - b);
        document.getElementById('empty').hidden = samples.length > 0 && !!model;
        if (model) {
          for (const s of samples) list.appendChild(renderSampleRow(s, model, subjects, urlByFile));
        }
      }

      if (promptCatalog && subjects.length) list.prepend(renderPromptRow(subjects, promptSizeValue()));

      finishRenderLayout(subjects);
      setupSyncedCarousels();
    }

    function sourceLabel() {
      if (loadSource === 'baked') return '';
      if (loadSource === 'dropped' && droppedFolderName) return `from “${droppedFolderName}”`;
      if (loadSource === 'handle' && droppedFolderName) return `from “${droppedFolderName}”`;
      if (loadSource === 'listing') return 'from folder listing';
      return '';
    }

    async function applyLoaded() {
      await loadMetaJson();
      await loadPromptsJson();
      applyMetaToCatalog();
      rebuildSampleList();
      rebuildTimeSlider();
      rebuildSeedList();
      setupPromptUI();
      populateModelFilter();
      populateSampleFilter();
      populateModelSelect();
      updateCompareControls();
      const n = Object.keys(catalog).length;
